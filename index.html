let currentAccessToken = null;
let currentUserId = null;
let currentRefreshToken = null;
function getHeaders(extra = {}) {
  return {
    apikey: SUPABASE_ANON_KEY,
    Authorization: `Bearer ${currentAccessToken || SUPABASE_ANON_KEY}`,
    "Content-Type": "application/json",

// Callbacks que App() conecta para persistir/limpiar la sesión cuando se renueva o vence el token
let alRefrescarSesion = null;
let alExpirarSesion = null;
let refrescandoPromesa = null;

async function refrescarToken() {
  if (!currentRefreshToken) return false;
  if (refrescandoPromesa) return refrescandoPromesa;
  refrescandoPromesa = (async () => {
    try {
      const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
        method: "POST",
        headers: { apikey: SUPABASE_ANON_KEY, "Content-Type": "application/json" },
        body: JSON.stringify({ refresh_token: currentRefreshToken }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.access_token) return false;
      currentAccessToken = data.access_token;
      currentRefreshToken = data.refresh_token || currentRefreshToken;
      if (alRefrescarSesion) alRefrescarSesion(data);
      return true;
    } catch (e) {
      return false;
    } finally {
      refrescandoPromesa = null;
    }
  })();
  return refrescandoPromesa;
}

// Error específico para cuando el dispositivo realmente no logra conectarse
// (sin internet, DNS, timeout). Se usa para diferenciarlo de un error real
// del servidor (ej: falta una columna, datos inválidos), que NO debe tratarse
// como "sin conexión".
class ErrorDeRed extends Error {}

// Lee el detalle de error que devuelve Supabase (ej: "column products.imagen
// does not exist") para poder mostrar el motivo real en vez de un mensaje genérico.
async function mensajeErrorSupabase(res, mensajePorDefecto) {
  try {
    const datos = await res.json();
    return datos.message || datos.error_description || datos.hint || mensajePorDefecto;
  } catch (e) {
    return mensajePorDefecto;
  }
}

// Envoltorio de fetch: si el token venció (401), renueva la sesión sola y reintenta una vez.
async function peticionApi(url, opciones = {}) {
  const { method = "GET", extraHeaders = {}, body } = opciones;
  const intentar = async () => {
    try {
      return await fetch(url, { method, headers: getHeaders(extraHeaders), body, cache: "no-store" });
    } catch (e) {
      throw new ErrorDeRed("No se pudo conectar con el servidor. Revisá tu conexión a internet.");
    }
  };
  let res = await intentar();
  if (res.status === 401) {
    const renovado = await refrescarToken();
    if (renovado) {
      res = await intentar();
    } else if (alExpirarSesion) {
      alExpirarSesion();
    }
  }
  return res;
}

// Comprime una imagen (foto de cámara o galería) redimensionándola y
// reexportándola como JPEG antes de guardarla, para que no pese varios MB.
function comprimirImagen(archivo, maxAncho = 900, calidad = 0.72) {
  return new Promise((resolve, reject) => {
    const lector = new FileReader();
    lector.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxAncho) {
          height = Math.round(height * (maxAncho / width));
          width = maxAncho;
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", calidad));
      };
      img.onerror = () => reject(new Error("No se pudo procesar la imagen."));
      img.src = lector.result;
    };
    lector.onerror = () => reject(new Error("No se pudo leer el archivo."));
    lector.readAsDataURL(archivo);
  });
}

// Capa central reutilizable: cualquier módulo puede usar cacheGuardar/cacheLeer
// para tener una copia local, y pendienteAgregar/pendientesListar/pendienteEliminar
// para encolar operaciones que se reintentan solas cuando vuelve la conexión.

const OFFLINE_DB_NAME = "nova_offline_db";
const OFFLINE_DB_VERSION = 1;

function abrirDBOffline() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) { reject(new Error("Este navegador no soporta guardado local")); return; }
    const req = indexedDB.open(OFFLINE_DB_NAME, OFFLINE_DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains("cache")) db.createObjectStore("cache", { keyPath: "clave" });
      if (!db.objectStoreNames.contains("pendientes")) db.createObjectStore("pendientes", { keyPath: "id", autoIncrement: true });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function cacheGuardar(clave, valor) {
  try {
    const db = await abrirDBOffline();
    await new Promise((resolve, reject) => {
      const tx = db.transaction("cache", "readwrite");
      tx.objectStore("cache").put({ clave, valor, actualizado: Date.now() });
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  } catch (e) { /* si falla el guardado local, seguimos sin romper la app */ }
}

async function cacheLeer(clave) {
  try {
    const db = await abrirDBOffline();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction("cache", "readonly");
      const req = tx.objectStore("cache").get(clave);
      req.onsuccess = () => resolve(req.result ? req.result.valor : null);
      req.onerror = () => reject(req.error);
    });
  } catch (e) { return null; }
}

// Intenta traer datos frescos del servidor; si falla (sin internet de verdad),
// devuelve la última copia guardada localmente para que la pantalla no se quede
// en blanco. Cada pantalla la usa con su propia "clave" de caché.
async function obtenerConRespaldo(clave, funcionCarga) {
  try {
    const datos = await funcionCarga();
    await cacheGuardar(clave, datos);
    return { datos, offline: false };
  } catch (e) {
    const enCache = await cacheLeer(clave);
    if (enCache !== null && enCache !== undefined) {
      return { datos: enCache, offline: true };
    }
    throw e;
  }
}

async function pendienteAgregar(tipo, payload) {
  try {
    const db = await abrirDBOffline();
    await new Promise((resolve, reject) => {
      const tx = db.transaction("pendientes", "readwrite");
      tx.objectStore("pendientes").add({ tipo, payload, creado_en: Date.now(), intentos: 0 });
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
    notificarConexion("sin_conexion");
    notificarPendientesCambio();
  } catch (e) { /* sin guardado local disponible, no se puede encolar */ }
}

// Listeners aparte para el contador de pendientes (independiente del estado
// de conexión, para que el indicador pueda mostrar "quedan 3" sin tener que
// recalcularlo a mano en cada pantalla).
let listenersPendientesCount = [];
async function notificarPendientesCambio() {
  const cantidad = (await pendientesListar()).length;
  listenersPendientesCount.forEach(fn => { try { fn(cantidad); } catch (e) {} });
}

async function pendientesListar() {
  try {
    const db = await abrirDBOffline();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction("pendientes", "readonly");
      const req = tx.objectStore("pendientes").getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  } catch (e) { return []; }
}

async function pendienteEliminar(id) {
  try {
    const db = await abrirDBOffline();
    await new Promise((resolve, reject) => {
      const tx = db.transaction("pendientes", "readwrite");
      tx.objectStore("pendientes").delete(id);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
    notificarPendientesCambio();
  } catch (e) { /* no crítico */ }
}

// --- IDs temporales para registros creados sin conexión ---
// Cuando se crea un cliente offline, por ejemplo, no tiene todavía su ID
// real de Supabase. Le asignamos uno temporal (idLocal) para poder
// mostrarlo y referenciarlo ya mismo (ej. crearle un fiado enseguida, sin
// esperar a sincronizar). "mapaIdsLocales" guarda la equivalencia
// local→real una vez que ese registro sí se sincroniza, para que las
// operaciones que dependían de él (el fiado, el abono) se enganchen al ID
// correcto al subirse.
function idLocal() { return `local_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`; }
function esIdLocal(id) { return typeof id === "string" && id.startsWith("local_"); }
async function mapaIdsLeer() { return (await cacheLeer("_mapa_ids_locales")) || {}; }
async function mapaIdsGuardar(mapa) { await cacheGuardar("_mapa_ids_locales", mapa); }
function resolverIdConMapa(id, mapa) { return esIdLocal(id) ? (mapa[id] || id) : id; }

// --- Estado de conexión (detección real, no solo navigator.onLine) ---
let estadoConexionGlobal = "conectado";
let listenersConexion = [];
function notificarConexion(estado) {
  estadoConexionGlobal = estado;
  listenersConexion.forEach(fn => { try { fn(estado); } catch (e) {} });
}

async function hayConexionReal() {
  if (!SUPABASE_URL) return navigator.onLine;
  try {
    const controlador = new AbortController();
    const tiempoFuera = setTimeout(() => controlador.abort(), 4000);
    await fetch(`${SUPABASE_URL}/rest/v1/`, { method: "GET", headers: { apikey: SUPABASE_ANON_KEY }, signal: controlador.signal, cache: "no-store" });
    clearTimeout(tiempoFuera);
    return true;
  } catch (e) {
    return false;
  }
}

async function pendienteMarcarError(id, mensaje) {
  try {
    const db = await abrirDBOffline();
    await new Promise((resolve, reject) => {
      const tx = db.transaction("pendientes", "readwrite");
      const store = tx.objectStore("pendientes");
      const req = store.get(id);
      req.onsuccess = () => {
        const registro = req.result;
        if (registro) store.put({ ...registro, error: mensaje });
      };
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
    notificarPendientesCambio();
  } catch (e) { /* no crítico */ }
}

let sincronizando = false;
async function sincronizarPendientes() {
  if (sincronizando) return;
  const pendientes = await pendientesListar();
  if (pendientes.length === 0) { if (estadoConexionGlobal !== "conectado") notificarConexion("conectado"); return; }
  sincronizando = true;
  notificarConexion("sincronizando");
  let huboErrorDeRed = false;
  let huboErrorReal = false;
  const mapaIds = await mapaIdsLeer();
  for (const p of pendientes.filter(x => !x.error).sort((a, b) => a.id - b.id)) {
    try {
      if (p.tipo === "crear_producto") await supaApi.crearProducto(p.payload);
      else if (p.tipo === "actualizar_producto") await supaApi.actualizarProducto(p.payload.id, p.payload.cambios);
      else if (p.tipo === "eliminar_producto") await supaApi.eliminarProducto(p.payload.id);
      else if (p.tipo === "registrar_venta") await supaApi.registrarVenta(p.payload);
      else if (p.tipo === "actualizar_cliente") await supaApi.actualizarCliente(resolverIdConMapa(p.payload.id, mapaIds), p.payload.cambios);
      else if (p.tipo === "crear_movimiento") {
        const pago = { ...p.payload };
        pago.sesion_id = resolverIdConMapa(pago.sesion_id, mapaIds);
        await supaApi.crearMovimiento(pago);
      }
      else if (p.tipo === "abrir_caja") {
        const creado = await supaApi.abrirCaja(p.payload.montoInicial, p.payload.fechaApertura);
        const real = Array.isArray(creado) ? creado[0] : creado;
        mapaIds[p.payload.idLocal] = real.id;
        await mapaIdsGuardar(mapaIds);
      }
      else if (p.tipo === "cerrar_caja") {
        const sesionId = resolverIdConMapa(p.payload.sesionId, mapaIds);
        await supaApi.cerrarCaja(sesionId, p.payload.montoFinal);
      }
      else if (p.tipo === "actualizar_sesion_caja") {
        const sesionId = resolverIdConMapa(p.payload.id, mapaIds);
        await supaApi.actualizarSesionCaja(sesionId, p.payload.cambios);
      }
      else if (p.tipo === "crear_movimiento_guardado") await supaApi.crearMovimientoGuardado(p.payload);
      else if (p.tipo === "crear_cliente") {
        const creado = await supaApi.crearCliente(p.payload.datos);
        const real = Array.isArray(creado) ? creado[0] : creado;
        mapaIds[p.payload.idLocal] = real.id;
        await mapaIdsGuardar(mapaIds);
      }
      else if (p.tipo === "crear_fiado_completo") {
        const clienteId = resolverIdConMapa(p.payload.cliente_id, mapaIds);
        await supaApi.crearFiadoYActualizarSaldo(clienteId, p.payload.productos, p.payload.total, p.payload.nuevoSaldo);
      }
      else if (p.tipo === "crear_pago_completo") {
        const clienteId = resolverIdConMapa(p.payload.cliente_id, mapaIds);
        const sesionId = p.payload.sesion_id ? resolverIdConMapa(p.payload.sesion_id, mapaIds) : null;
        await supaApi.crearPagoYActualizarSaldo(clienteId, p.payload.monto, p.payload.nuevoSaldo, sesionId, p.payload.descripcionMovimiento);
      }
      else if (p.tipo === "crear_nota") await supaApi.crearNota(p.payload);
      else if (p.tipo === "actualizar_nota") await supaApi.actualizarNota(p.payload.id, p.payload.cambios);
      else if (p.tipo === "eliminar_nota") await supaApi.eliminarNota(p.payload.id);
      else if (p.tipo === "crear_comision") {
        const clienteId = resolverIdConMapa(p.payload.cliente_id, mapaIds);
        await supaApi.crearComisionFiado({ ...p.payload, cliente_id: clienteId });
      }
      else if (p.tipo === "crear_historial") {
        const clienteId = resolverIdConMapa(p.payload.cliente_id, mapaIds);
        await supaApi.crearHistorialCredito({ ...p.payload, cliente_id: clienteId });
      }
      else if (p.tipo === "guardar_config_negocio") await supaApi.guardarConfigNegocio(p.payload);
      await pendienteEliminar(p.id);
    } catch (e) {
      if (e instanceof ErrorDeRed) {
        huboErrorDeRed = true;
      } else {
        // No es un problema de conexión (ej: dato inválido). No lo
        // descartamos: lo dejamos marcado con el error para no perder el
        // cambio, y avisamos — reintentar esto solo para siempre no lo iba
        // a arreglar solo.
        huboErrorReal = true;
        await pendienteMarcarError(p.id, e.message || "Error al sincronizar");
      }
    }
  }
  sincronizando = false;
  if (huboErrorReal) {
    notificarConexion("error");
    mostrarError("Algunos cambios no se pudieron subir (no es un problema de conexión). Tus datos siguen guardados en el dispositivo — avisale a soporte para revisarlos.");
  } else if (huboErrorDeRed) {
    notificarConexion("sin_conexion");
  } else {
    notificarConexion("sincronizado");
    setTimeout(() => { if (estadoConexionGlobal === "sincronizado") notificarConexion("conectado"); }, 3000);
  }
}

async function verificarConexion() {
  const ok = await hayConexionReal();
  if (ok && estadoConexionGlobal === "sin_conexion") {
    await sincronizarPendientes();
  } else if (ok && estadoConexionGlobal !== "sincronizando") {
    const pendientes = await pendientesListar();
    if (pendientes.length > 0) await sincronizarPendientes();
    else if (estadoConexionGlobal !== "sincronizado") notificarConexion("conectado");
  } else if (!ok) {
    notificarConexion("sin_conexion");
  }
}

if (typeof window !== "undefined") {
  window.addEventListener("online", verificarConexion);
  window.addEventListener("offline", () => notificarConexion("sin_conexion"));
  setInterval(verificarConexion, 15000);
  setTimeout(verificarConexion, 1500);
}

// --- Envoltorio genérico: intenta la operación real; si falla por conexión, la encola ---
async function conAlternativaOffline(operacionReal, tipoPendiente, payload, aplicarLocal) {
  try {
    const resultado = await operacionReal();
    if (estadoConexionGlobal !== "conectado" && estadoConexionGlobal !== "sincronizando") notificarConexion("conectado");
    return resultado;
  } catch (e) {
    if (!(e instanceof ErrorDeRed)) {
      // Error real del servidor (ej: dato inválido, columna faltante). No es un
      // problema de conexión: no lo encolamos, lo dejamos pasar tal cual para
      // que la pantalla que lo llamó pueda mostrarle el motivo real al usuario.
      throw e;
    }
    if (aplicarLocal) await aplicarLocal();
    await pendienteAgregar(tipoPendiente, payload);
    notificarConexion("sin_conexion");
    return null;
  }
}

// --- Notificaciones propias de la app (reemplazan al mostrarError() feo del navegador) ---
let toastsGlobal = [];
let listenersToast = [];
let toastIdSeq = 1;
function notificarToasts() {
  listenersToast.forEach(fn => { try { fn([...toastsGlobal]); } catch (e) {} });
}
function quitarToast(id) {
  toastsGlobal = toastsGlobal.filter(t => t.id !== id);
  notificarToasts();
}
function mostrarError(mensaje) {
  const id = toastIdSeq++;
  toastsGlobal = [...toastsGlobal, { id, mensaje: String(mensaje), tipo: "error" }];
  notificarToasts();
  setTimeout(() => quitarToast(id), 5000);
}
function mostrarAviso(mensaje) {
  const id = toastIdSeq++;
  toastsGlobal = [...toastsGlobal, { id, mensaje: String(mensaje), tipo: "exito" }];
  notificarToasts();
  setTimeout(() => quitarToast(id), 3500);
}

function ToastContainer() {
  const [toasts, setToasts] = useState(toastsGlobal);
  useEffect(() => {
    const fn = (lista) => setToasts(lista);
    listenersToast.push(fn);
    return () => { listenersToast = listenersToast.filter(l => l !== fn); };
  }, []);
  if (toasts.length === 0) return null;
  return (
    <div className="fixed top-3 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-2 w-[calc(100%-24px)] max-w-sm px-1 pointer-events-none">
      {toasts.map((t) => {
        const esError = t.tipo === "error";
        return (
          <div key={t.id}
            className={`pointer-events-auto flex items-start gap-2.5 rounded-xl shadow-lg border p-3 bg-white dark:bg-black ${esError ? "border-rose-200 dark:border-rose-900/40" : "border-emerald-200 dark:border-emerald-900/40"}`}>
            <span className={`shrink-0 w-6 h-6 rounded-full flex items-center justify-center text-sm ${esError ? "bg-rose-50 dark:bg-rose-900/30 text-rose-500" : "bg-emerald-50 dark:bg-emerald-900/30 text-emerald-500"}`}>
              {esError ? "!" : "✓"}
            </span>
            <span className="text-sm text-slate-700 dark:text-white flex-1 leading-snug pt-0.5">{t.mensaje}</span>
            <button onClick={() => quitarToast(t.id)} className="text-slate-300 dark:text-white/30 text-sm leading-none shrink-0 pt-1">✕</button>
          </div>
        );
      })}
    </div>
  );
}

// --- Confirmación propia de la app (reemplaza al confirm() feo del navegador) ---
let confirmModalGlobal = null; // { mensaje, resolve }
let listenersConfirm = [];
function notificarConfirm() {
  listenersConfirm.forEach(fn => { try { fn(confirmModalGlobal); } catch (e) {} });
}
function confirmarAccion(mensaje) {
  return new Promise((resolve) => {
    confirmModalGlobal = { mensaje, resolve };
    notificarConfirm();
  });
}
function resolverConfirm(valor) {
  if (confirmModalGlobal) confirmModalGlobal.resolve(valor);
  confirmModalGlobal = null;
  notificarConfirm();
}

function ModalConfirmacion() {
  const [estado, setEstado] = useState(confirmModalGlobal);
  useEffect(() => {
    const fn = (nuevo) => setEstado(nuevo);
    listenersConfirm.push(fn);
    return () => { listenersConfirm = listenersConfirm.filter(l => l !== fn); };
  }, []);
  if (!estado) return null;
  return (
    <div className="fixed inset-0 bg-black/40 flex items-end sm:items-center justify-center z-[100]" onClick={() => resolverConfirm(false)}>
      <div onClick={(e) => e.stopPropagation()} className="bg-white dark:bg-black rounded-t-2xl sm:rounded-2xl p-5 w-full sm:max-w-sm">
        <div className="w-10 h-10 rounded-full bg-rose-50 dark:bg-rose-900/30 text-rose-500 flex items-center justify-center text-lg font-bold mb-3">!</div>
        <p className="text-sm text-slate-700 dark:text-white leading-snug mb-5">{estado.mensaje}</p>
        <div className="flex gap-2">
          <button onClick={() => resolverConfirm(false)} className="flex-1 py-2.5 rounded-xl text-sm font-semibold border border-slate-200 dark:border-white/10 text-slate-600 dark:text-white">Cancelar</button>
          <button onClick={() => resolverConfirm(true)} className="flex-1 py-2.5 rounded-xl text-sm font-semibold bg-rose-500 text-white hover:brightness-105">Eliminar</button>
        </div>
      </div>
    </div>
  );
}

function IndicadorConexion() {
  const [estado, setEstado] = useState(estadoConexionGlobal);
  const [pendientesCant, setPendientesCant] = useState(0);
  useEffect(() => {
    const fn = (nuevoEstado) => setEstado(nuevoEstado);
    const fnCant = (n) => setPendientesCant(n);
    listenersConexion.push(fn);
    listenersPendientesCount.push(fnCant);
    pendientesListar().then(p => setPendientesCant(p.length));
    return () => {
      listenersConexion = listenersConexion.filter(l => l !== fn);
      listenersPendientesCount = listenersPendientesCount.filter(l => l !== fnCant);
    };
  }, []);
  if (estado === "conectado" && pendientesCant === 0) return null;
  if (estado === "sin_conexion" && pendientesCant > 0) {
    return <div className="text-[11px] font-medium px-2.5 py-1 rounded-full bg-blue-50 dark:bg-blue-900/20 text-[#2471A3] dark:text-blue-300 whitespace-nowrap">🔵 {pendientesCant} cambio{pendientesCant !== 1 ? "s" : ""} pendiente{pendientesCant !== 1 ? "s" : ""} de sincronizar</div>;
  }

// Clave pública VAPID de Nova (segura de exponer; la privada solo vive en
// la Edge Function del servidor). Necesaria para que el navegador del
// cliente pueda suscribirse a notificaciones push.
const VAPID_PUBLIC_KEY = "BOiIkHhnkZ04A-hpxtPtInhqc-4LyN4q5_cJSCAMVyP_1KoUABrerlKHybkHCtNruVOvswUcFKQ9fnZcAFWLd9k";
function base64UrlAUint8Array(base64Url) {
  const padding = "=".repeat((4 - (base64Url.length % 4)) % 4);
  const base64 = (base64Url + padding).replace(/-/g, "+").replace(/_/g, "/");
  const raw = atob(base64);
  const arr = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
  return arr;
}
// Guarda la suscripción push del cliente (sin sesión, validado por token).
async function guardarSuscripcionPublica(token, subscription) {
  const json = subscription.toJSON();
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/guardar_suscripcion_push`, {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` },
    body: JSON.stringify({ p_token: token, p_endpoint: json.endpoint, p_p256dh: json.keys.p256dh, p_auth: json.keys.auth }),
  });
  if (!res.ok) throw new Error("No se pudo activar la notificación");
}

// Dispara la notificación push al cliente (si activó notificaciones). Se
// llama "en segundo plano": si falla, no debe interrumpir ni bloquear la
// venta/abono, que ya se guardó bien de todos modos — pero sí avisa con un
// aviso chiquito para poder diagnosticar mientras probamos esta función.
function notificarCliente(clienteId, tipo) {
  peticionApi(`${SUPABASE_URL}/functions/v1/enviar-notificacion-push`, {
    method: "POST",
    body: JSON.stringify({ cliente_id: clienteId, tipo, origen: window.location.origin }),
  }).then(async (res) => {
    const d = await res.json().catch(() => ({}));
    if (!res.ok) { mostrarAviso(`[debug notificación] ${res.status}: ${d.error || "error desconocido"}`); }
    else if (d.enviadas === 0) { mostrarAviso("[debug notificación] no había ninguna suscripción activa para este cliente"); }
    else { mostrarAviso(`[debug notificación] enviada (${d.enviadas})`); }
  }).catch((e) => { mostrarAviso(`[debug notificación] fallo de red: ${e.message}`); });
}

// Catálogo de monedas soportadas. Cada negocio guarda su propio
// moneda_codigo (columna estructurada en negocio_config, con un CHECK en
// la base de datos). Para agregar una moneda nueva en el futuro basta con
// añadir un renglón aquí y agregarla al CHECK de negocio_config — nada más
// del código necesita tocarse.
const CATALOGO_MONEDAS = {
  NIO: { simbolo: "C$", nombre: "Córdoba nicaragüense", decimales: 2, locale: "es-NI", alias: ["córdoba", "córdobas", "cordoba", "cordobas", "c$"] },
  VES: { simbolo: "Bs.", nombre: "Bolívar venezolano", decimales: 2, locale: "es-VE", alias: ["bolívar", "bolívares", "bolivar", "bolivares", "bs.", "bs"] },
};
const MONEDA_POR_DEFECTO = "NIO";

// Cache en memoria de la moneda del negocio activo (igual patrón que
// miNegocioIdCache arriba). Se establece una vez que se carga
// negocio_config y se usa de forma síncrona en toda la app para no tener
// que pasar la moneda como prop a decenas de componentes.
let monedaActualCache = MONEDA_POR_DEFECTO;
function establecerMonedaActual(codigo) {
  monedaActualCache = CATALOGO_MONEDAS[codigo] ? codigo : MONEDA_POR_DEFECTO;
}
function limpiarCacheMoneda() { monedaActualCache = MONEDA_POR_DEFECTO; }
// Junta los alias de TODAS las monedas del catálogo (no solo la activa) para
// que el reconocimiento de precios por texto libre funcione sin importar
// qué palabra use la persona ("córdobas", "bolívares", "pesos", "c$", "bs"),
// y para que agregar una moneda nueva al catálogo la sume automáticamente
// aquí también, sin tocar el parser.
function regexAliasMonedaTexto() {
  const alias = new Set(["pesos?"]);
  Object.values(CATALOGO_MONEDAS).forEach(info => info.alias.forEach(a => alias.add(a.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"))));
  return Array.from(alias).join("|");
}
function monedaActualInfo() { return CATALOGO_MONEDAS[monedaActualCache] || CATALOGO_MONEDAS[MONEDA_POR_DEFECTO]; }
function simboloMoneda() { return monedaActualInfo().simbolo; }
function formatMoneda(valor) {
  // A propósito NO se agregan separadores de miles: se mantiene el mismo
  // formato que ya usaba la app (número con punto decimal, sin comas), solo
  // cambia el símbolo según la moneda del negocio. Así ningún reporte,
  // captura de pantalla o costumbre visual existente cambia de golpe.
  const info = monedaActualInfo();
  const num = Number(valor);
  const seguro = Number.isFinite(num) ? num : 0;
  return `${info.simbolo}${seguro.toFixed(info.decimales)}`;
}

  async obtenerOCrearTokenPublico(id) {
    const negocioId = await obtenerMiNegocioId();
    const res = await peticionApi(`${SUPABASE_URL}/rest/v1/clientes?id=eq.${id}&negocio_id=eq.${negocioId}&select=token_publico&limit=1`);
    if (!res.ok) throw new Error("No se pudo obtener el link del cliente");

    const res = await peticionApi(`${SUPABASE_URL}/rest/v1/lotes?negocio_id=eq.${negocioId}&select=*&order=creado_en.desc&limit=${limite}`);
    if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error(d.message || d.hint || "No se pudieron cargar los lotes"); }
    return res.json();
  },
  async crearLote(lote) {
    const negocioId = await obtenerMiNegocioId();
    const res = await peticionApi(`${SUPABASE_URL}/rest/v1/lotes`, {
      method: "POST", extraHeaders: { Prefer: "return=representation" }, body: JSON.stringify({ ...lote, negocio_id: negocioId }),
    });
    if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error(d.message || d.hint || "No se pudo guardar el lote"); }
    return res.json();
  },
  async actualizarLote(id, cambios) {
    const negocioId = await obtenerMiNegocioId();
    const res = await peticionApi(`${SUPABASE_URL}/rest/v1/lotes?id=eq.${id}&negocio_id=eq.${negocioId}`, {
      method: "PATCH", extraHeaders: { Prefer: "return=representation" }, body: JSON.stringify(cambios),
    });
    if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error(d.message || d.hint || "No se pudo actualizar el lote"); }
    return res.json();
  },
  async eliminarLote(id) {
    const negocioId = await obtenerMiNegocioId();
    const res = await peticionApi(`${SUPABASE_URL}/rest/v1/lotes?id=eq.${id}&negocio_id=eq.${negocioId}`, { method: "DELETE" });
    if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error(d.message || d.hint || "No se pudo eliminar el lote"); }
  },

  // --- Entradas de inventario (historial de movimientos de stock por producto) ---
  async listarEntradasInventario(productoId) {
    const negocioId = await obtenerMiNegocioId();
    const res = await peticionApi(`${SUPABASE_URL}/rest/v1/entradas_inventario?producto_id=eq.${productoId}&negocio_id=eq.${negocioId}&select=*&order=fecha.desc,creado_en.desc`);
    if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error(d.message || d.hint || "No se pudieron cargar las entradas de inventario"); }
    return res.json();
  },
  async crearEntradaInventario(entrada) {
    const negocioId = await obtenerMiNegocioId();
    const res = await peticionApi(`${SUPABASE_URL}/rest/v1/entradas_inventario`, {
      method: "POST", extraHeaders: { Prefer: "return=representation" }, body: JSON.stringify({ ...entrada, negocio_id: negocioId }),
    });
    if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error(d.message || d.hint || "No se pudo registrar la entrada"); }
    return res.json();
  },
  async actualizarEntradaInventario(id, cambios) {
    const negocioId = await obtenerMiNegocioId();
    const res = await peticionApi(`${SUPABASE_URL}/rest/v1/entradas_inventario?id=eq.${id}&negocio_id=eq.${negocioId}`, {
      method: "PATCH", extraHeaders: { Prefer: "return=representation" }, body: JSON.stringify(cambios),
    });
    if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error(d.message || d.hint || "No se pudo actualizar la entrada"); }
    return res.json();
  },
  async eliminarEntradaInventario(id) {

    const res = await peticionApi(`${SUPABASE_URL}/rest/v1/entradas_inventario?id=eq.${id}&negocio_id=eq.${negocioId}`, { method: "DELETE" });
    if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error(d.message || d.hint || "No se pudo eliminar la entrada"); }

function PaginaEquipos({ equipos, asignaciones, productos, cargando, error, puedeEditar = true, onCrearEquipo, onEliminarEquipo, onAsignar, onQuitar, onActualizarCantidad }) {
  const [equipoSeleccionado, setEquipoSeleccionado] = useState(null);
  const [nombreNuevo, setNombreNuevo] = useState("");
  const [tipoNuevo, setTipoNuevo] = useState("Freezer");
  const [mostrarForm, setMostrarForm] = useState(false);
  const [guardando, setGuardando] = useState(false);
  const [busqueda, setBusqueda] = useState("");
  const [cantidadesNuevas, setCantidadesNuevas] = useState({});

  const productoPorId = (id) => productos.find(p => p.id === id);
  const productosDeEquipo = (equipoId) => asignaciones
    .filter(a => a.equipo_id === equipoId)
    .map(a => { const prod = productoPorId(a.producto_id); return prod ? { ...prod, cantidad_equipo: Number(a.cantidad) || 0 } : null; })
    .filter(Boolean);
  const equipoActivo = equipos.find(e => e.id === equipoSeleccionado);

  const crearEquipo = async () => {
    if (!nombreNuevo.trim()) { mostrarError("Ponele un nombre al equipo"); return; }
    setGuardando(true);
    try {
      await onCrearEquipo({ nombre: nombreNuevo.trim(), tipo: tipoNuevo });
      setNombreNuevo(""); setTipoNuevo("Freezer"); setMostrarForm(false);
    } catch (e) { mostrarError(e.message); }
    finally { setGuardando(false); }
  };

  const eliminarEquipo = async (equipo) => {
    if (!(await confirmarAccion(`¿Eliminar "${equipo.nombre}"? Los productos que tenías asignados ahí no se borran, solo dejan de estar etiquetados en este equipo.`))) return;
    try { await onEliminarEquipo(equipo); setEquipoSeleccionado(null); } catch (e) { mostrarError(e.message); }
  };

  const cambiarCantidad = async (productoId, equipoId, nuevaCantidad) => {
    if (nuevaCantidad < 0) return;
    try { await onActualizarCantidad(productoId, equipoId, nuevaCantidad); } catch (e) { mostrarError(e.message); }
  };

  const asignarConCantidad = async (productoId, equipoId) => {
    const cantidad = Math.max(1, parseInt(cantidadesNuevas[productoId], 10) || 1);
    try {
      await onAsignar(productoId, equipoId, cantidad);
      setBusqueda("");
      setCantidadesNuevas((c) => { const copia = { ...c }; delete copia[productoId]; return copia; });
    } catch (e) { mostrarError(e.message); }
  };

  // --- Vista de detalle de un equipo ---
  if (equipoActivo) {
    const asignados = productosDeEquipo(equipoActivo.id);
    const idsAsignados = new Set(asignados.map(p => p.id));
    const resultadosBusqueda = busqueda.trim().length > 0
      ? productos.filter(p => !idsAsignados.has(p.id) && p.nombre.toLowerCase().includes(busqueda.toLowerCase())).slice(0, 8)
      : [];

    return (
      <div className="max-w-xl space-y-4">
        <button onClick={() => { setEquipoSeleccionado(null); setBusqueda(""); }} className="text-sm text-slate-500 dark:text-white/60 flex items-center gap-1">← Volver a Equipos</button>
        <div className="flex items-center justify-between">
          <h1 className="text-xl font-bold text-slate-800 dark:text-white font-display">{equipoActivo.nombre}</h1>
          {puedeEditar && <button onClick={() => eliminarEquipo(equipoActivo)} className="text-xs text-rose-500 font-semibold">Eliminar equipo</button>}
        </div>
        <p className="text-xs text-slate-400 dark:text-white/40">{equipoActivo.tipo}</p>

        <div className="bg-white dark:bg-neutral-900 border border-slate-200 dark:border-white/10 rounded-2xl p-5">
          <h2 className="font-semibold text-slate-800 dark:text-white text-sm mb-3">Productos aquí ({asignados.length})</h2>
          {asignados.length === 0 ? (
            <p className="text-sm text-slate-400 dark:text-white/40">Todavía no le asignaste productos.</p>
          ) : (
            <div className="space-y-2">
              {asignados.map(p => {
                const cantidadEquipo = p.cantidad_equipo;
                const agotado = cantidadEquipo <= 0;
                return (
                  <div key={p.id} className="flex items-center justify-between py-2 border-b border-slate-100 dark:border-white/5 last:border-0 gap-2">
                    <div className="min-w-0">
                      <p className="text-sm text-slate-800 dark:text-white truncate">{p.nombre}</p>
                      <p className={"text-xs font-semibold " + (agotado ? "text-rose-500" : "text-slate-400 dark:text-white/40")}>
                        {agotado ? "¡Agotado en este equipo!" : `${cantidadEquipo} en este equipo`} · {p.cantidad} en inventario total
                      </p>
                    </div>
                    {puedeEditar && (
                      <div className="flex items-center gap-1 shrink-0">
                        <button onClick={() => cambiarCantidad(p.id, equipoActivo.id, cantidadEquipo - 1)} className="w-7 h-7 rounded-lg border border-slate-200 dark:border-white/10 text-slate-600 dark:text-white flex items-center justify-center">−</button>
                        <span className="w-7 text-center text-sm font-semibold text-slate-800 dark:text-white">{cantidadEquipo}</span>
                        <button onClick={() => cambiarCantidad(p.id, equipoActivo.id, cantidadEquipo + 1)} className="w-7 h-7 rounded-lg border border-slate-200 dark:border-white/10 text-slate-600 dark:text-white flex items-center justify-center">+</button>
                        <button onClick={() => onQuitar(p.id, equipoActivo.id)} className="text-slate-300 hover:text-rose-500 text-sm px-1.5">✕</button>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}
        </div>

        {puedeEditar && (
          <div className="bg-white dark:bg-neutral-900 border border-slate-200 dark:border-white/10 rounded-2xl p-5">
            <h2 className="font-semibold text-slate-800 dark:text-white text-sm mb-3">Agregar producto a este equipo</h2>
            <input value={busqueda} onChange={(e) => setBusqueda(e.target.value)} placeholder="Buscar producto por nombre..."
              className="w-full px-3 py-2.5 rounded-lg border border-slate-200 dark:border-white/10 bg-slate-50 dark:bg-black text-sm text-slate-800 dark:text-white outline-none focus:ring-2 focus:ring-[#E3A73B]" />
            {resultadosBusqueda.length > 0 && (
              <div className="mt-2 space-y-1.5">
                {resultadosBusqueda.map(p => (
                  <div key={p.id} className="flex items-center gap-2 px-3 py-2 rounded-lg bg-slate-50 dark:bg-white/5">
                    <span className="flex-1 min-w-0 truncate text-sm text-slate-700 dark:text-white">{p.nombre}</span>
                    <span className="text-[11px] text-slate-400 dark:text-white/40 shrink-0">{p.cantidad} en inventario</span>
                    <input
                      type="number"
                      min="1"
                      value={cantidadesNuevas[p.id] ?? 1}
                      onChange={(e) => setCantidadesNuevas((c) => ({ ...c, [p.id]: e.target.value }))}
                      className="w-14 px-2 py-1.5 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm text-center text-slate-800 dark:text-white outline-none focus:border-[#E3A73B] shrink-0"
                    />
                    <button onClick={() => asignarConCantidad(p.id, equipoActivo.id)}
                      className="shrink-0 text-xs font-semibold px-3 py-2 rounded-lg bg-[#16233D] text-white hover:brightness-110">
                      + Agregar
                    </button>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}
      </div>
    );
  }

  // --- Vista de lista de equipos ---
  return (
    <div className="max-w-xl space-y-5">
      <div className="flex items-center justify-between">
        <div>
          <h1 className="text-xl font-bold text-slate-800 dark:text-white font-display">🧊 Equipos</h1>
          <p className="text-sm text-slate-500 dark:text-white/60 mt-1">Freezers y refris, con lo que hay guardado en cada uno.</p>
        </div>
        {puedeEditar && <button onClick={() => setMostrarForm(v => !v)} className="px-4 py-2 rounded-lg bg-[#16233D] text-white text-sm font-semibold">{mostrarForm ? "Cancelar" : "+ Agregar equipo"}</button>}
      </div>

      {error && <div className="bg-rose-50 dark:bg-rose-900/10 border border-rose-200 dark:border-rose-900/30 text-rose-600 dark:text-rose-400 text-sm rounded-lg p-3">{error}</div>}

      {mostrarForm && (
        <div className="bg-white dark:bg-neutral-900 border border-slate-200 dark:border-white/10 rounded-2xl p-5 space-y-3">
          <input value={nombreNuevo} onChange={(e) => setNombreNuevo(e.target.value)} placeholder="Ej. Freezer de la gaseosa"
            onKeyDown={(e) => e.key === "Enter" && crearEquipo()}
            className="w-full px-3 py-2.5 rounded-lg border border-slate-200 dark:border-white/10 bg-slate-50 dark:bg-black text-sm text-slate-800 dark:text-white outline-none focus:ring-2 focus:ring-[#E3A73B]" />
          <div className="flex gap-2">
            <select value={tipoNuevo} onChange={(e) => setTipoNuevo(e.target.value)}
              className="px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-slate-50 dark:bg-black text-sm text-slate-800 dark:text-white outline-none">
              {TIPOS_EQUIPO.map(t => <option key={t} value={t}>{t}</option>)}
            </select>
            <button onClick={crearEquipo} disabled={guardando} className="px-4 py-2 rounded-lg bg-[#E3A73B] text-white text-sm font-semibold disabled:opacity-50">
              {guardando ? "Guardando..." : "Crear"}
            </button>
          </div>
        </div>
      )}

      {cargando ? <p className="text-sm text-slate-400">Cargando...</p> : equipos.length === 0 && !mostrarForm ? (
        <p className="text-sm text-slate-400 dark:text-white/40">Todavía no agregaste ningún equipo.</p>
      ) : (
        <div className="grid sm:grid-cols-2 gap-3">
          {equipos.map(eq => {
            const asignados = productosDeEquipo(eq.id);
            const agotados = asignados.filter(p => Number(p.cantidad_equipo) <= 0).length;
            return (
              <button key={eq.id} onClick={() => setEquipoSeleccionado(eq.id)}
                className="text-left bg-white dark:bg-neutral-900 border border-slate-200 dark:border-white/10 rounded-2xl p-4 hover:border-[#E3A73B] transition-colors">
                <p className="font-semibold text-slate-800 dark:text-white text-sm">{eq.nombre}</p>
                <p className="text-xs text-slate-400 dark:text-white/40 mt-0.5">{eq.tipo} · {asignados.length} producto{asignados.length !== 1 ? "s" : ""}</p>
                {agotados > 0 && <p className="text-xs text-rose-500 font-semibold mt-1">⚠️ {agotados} agotado{agotados !== 1 ? "s" : ""}</p>}
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

function PaginaNotas({ notas, cargando, error, onCrear, onActualizar, onEliminar }) {
  const [titulo, setTitulo] = useState("");
  const [contenido, setContenido] = useState("");
  const [categoria, setCategoria] = useState("idea");
  const [fechaRecordatorio, setFechaRecordatorio] = useState("");
  const [guardando, setGuardando] = useState(false);
  const [mostrarForm, setMostrarForm] = useState(false);

  const agregar = async () => {
    if (!titulo.trim()) { mostrarError("Ponele un título a la nota"); return; }
    setGuardando(true);
    try {
      await onCrear({ titulo: titulo.trim(), contenido: contenido.trim() || null, categoria, fecha_recordatorio: fechaRecordatorio || null });
      setTitulo(""); setContenido(""); setCategoria("idea"); setFechaRecordatorio(""); setMostrarForm(false);
    } catch (e) { mostrarError(e.message); }
    finally { setGuardando(false); }
  };

  const hoy = new Date().toISOString().slice(0, 10);
  const activas = notas.filter(n => !n.completada);
  const completadas = notas.filter(n => n.completada).slice(0, 10);

  return (
    <div className="space-y-5 max-w-2xl">
      <div className="flex items-center justify-between">
        <div>
          <h1 className="text-xl font-bold text-slate-800 dark:text-white font-display">📓 Notas</h1>
          <p className="text-sm text-slate-500 dark:text-white/60 mt-1">Ideas, pendientes y recordatorios del negocio.</p>
        </div>
        <button onClick={() => setMostrarForm(v => !v)} className="px-4 py-2 rounded-lg bg-[#16233D] text-white text-sm font-semibold">
          {mostrarForm ? "Cancelar" : "+ Nueva nota"}
        </button>
      </div>

      {error && <div className="bg-rose-50 dark:bg-rose-900/10 border border-rose-200 dark:border-rose-900/30 text-rose-600 dark:text-rose-400 text-sm rounded-lg p-3">{error}</div>}

      {mostrarForm && (
        <div className="bg-white dark:bg-neutral-900 border border-slate-200 dark:border-white/10 rounded-2xl p-5 space-y-3">
          <input value={titulo} onChange={(e) => setTitulo(e.target.value)} placeholder="Título"
            className="w-full px-3 py-2.5 rounded-lg border border-slate-200 dark:border-white/10 bg-slate-50 dark:bg-black text-sm text-slate-800 dark:text-white outline-none focus:ring-2 focus:ring-[#E3A73B]" />
          <textarea value={contenido} onChange={(e) => setContenido(e.target.value)} placeholder="Detalle (opcional)" rows={3}
            className="w-full px-3 py-2.5 rounded-lg border border-slate-200 dark:border-white/10 bg-slate-50 dark:bg-black text-sm text-slate-800 dark:text-white outline-none focus:ring-2 focus:ring-[#E3A73B]" />
          <div className="flex flex-col sm:flex-row gap-2">
            <select value={categoria} onChange={(e) => setCategoria(e.target.value)}
              className="px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-slate-50 dark:bg-black text-sm text-slate-800 dark:text-white outline-none">
              {CATEGORIAS_NOTA.map(c => <option key={c.valor} value={c.valor}>{c.label}</option>)}
            </select>
            <input type="date" value={fechaRecordatorio} onChange={(e) => setFechaRecordatorio(e.target.value)}
              className="px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-slate-50 dark:bg-black text-sm text-slate-800 dark:text-white outline-none" />
            <button onClick={agregar} disabled={guardando} className="px-4 py-2 rounded-lg bg-[#E3A73B] text-white text-sm font-semibold disabled:opacity-50 sm:ml-auto">
              {guardando ? "Guardando..." : "Guardar nota"}
            </button>
          </div>
        </div>
      )}

      {cargando ? <p className="text-sm text-slate-400">Cargando...</p> : activas.length === 0 && !mostrarForm ? (
        <p className="text-sm text-slate-400 dark:text-white/40">No tenés notas todavía.</p>
      ) : (
        <div className="space-y-3">
          {activas.map(n => {
            const cat = infoCategoria(n.categoria);
            const recordatorioVencido = n.fecha_recordatorio && n.fecha_recordatorio <= hoy;
            return (
              <div key={n.id} className={`bg-white dark:bg-neutral-900 border rounded-2xl p-4 ${n.fijada ? "border-[#E3A73B]" : "border-slate-200 dark:border-white/10"}`}>
                <div className="flex items-start justify-between gap-2">
                  <div className="flex-1">
                    <div className="flex items-center gap-2 flex-wrap mb-1">
                      <span className={`text-[11px] px-2 py-0.5 rounded-full font-semibold ${cat.color}`}>{cat.label}</span>
                      {n.fecha_recordatorio && <span className={`text-[11px] px-2 py-0.5 rounded-full font-semibold ${recordatorioVencido ? "bg-rose-100 dark:bg-rose-900/20 text-rose-600 dark:text-rose-400" : "bg-slate-100 dark:bg-white/10 text-slate-500 dark:text-white/50"}`}>📅 {n.fecha_recordatorio}</span>}
                    </div>
                    <p className="font-semibold text-slate-800 dark:text-white text-sm">{n.titulo}</p>
                    {n.contenido && <p className="text-sm text-slate-500 dark:text-white/60 mt-1 whitespace-pre-wrap">{n.contenido}</p>}
                  </div>
                  <div className="flex items-center gap-1 shrink-0">
                    <button onClick={() => onActualizar(n.id, { fijada: !n.fijada })} title="Fijar" className={`text-sm px-1.5 ${n.fijada ? "text-[#E3A73B]" : "text-slate-300 hover:text-[#E3A73B]"}`}>📌</button>
                    <button onClick={() => onActualizar(n.id, { completada: true })} title="Marcar como resuelta" className="text-sm px-1.5 text-slate-300 hover:text-emerald-500">✓</button>
                    <button onClick={() => onEliminar(n)} title="Eliminar" className="text-sm px-1.5 text-slate-300 hover:text-rose-500">✕</button>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {completadas.length > 0 && (
        <div className="bg-white dark:bg-neutral-900 border border-slate-200 dark:border-white/10 rounded-2xl p-5">
          <h2 className="font-semibold text-slate-500 dark:text-white/50 text-sm mb-3">Resueltas recientemente</h2>
          <div className="space-y-1">
            {completadas.map(n => (
              <div key={n.id} className="flex items-center justify-between text-sm text-slate-400 dark:text-white/40">
                <span className="line-through">{n.titulo}</span>
                <button onClick={() => onEliminar(n)} className="hover:text-rose-500 px-2">✕</button>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function PaginaFaltantes({ faltantes, proveedores, cargando, error, puedeEditar = true, onCrearFaltante, onMarcarFaltante, onEliminarFaltante, onCrearProveedor, onActualizarProveedor, onEliminarProveedor }) {
  const [nombreNuevo, setNombreNuevo] = useState("");
  const [proveedorNuevo, setProveedorNuevo] = useState("");
  const [guardando, setGuardando] = useState(false);
  const [mostrarProveedores, setMostrarProveedores] = useState(false);

  const pendientes = faltantes.filter(f => !f.comprado);
  const compradosRecientes = faltantes.filter(f => f.comprado).slice(0, 15);
  const proveedorPorId = (id) => proveedores.find(p => p.id === id);

  const hoyDia = new Date().getDay();
  const proveedoresHoy = proveedores.filter(p => (p.dias_semana || []).includes(hoyDia));
  const faltantesDeHoy = pendientes.filter(f => f.proveedor_id && proveedoresHoy.some(p => p.id === f.proveedor_id));

  const agregar = async () => {
    if (!nombreNuevo.trim()) { mostrarError("Escribí qué te hace falta"); return; }
    setGuardando(true);
    try {
      await onCrearFaltante({ nombre: nombreNuevo.trim(), proveedor_id: proveedorNuevo || null });
      setNombreNuevo(""); setProveedorNuevo("");
    } catch (e) { mostrarError(e.message); }
    finally { setGuardando(false); }
  };

  return (
    <div className="space-y-5">
      <div>
        <h1 className="text-xl font-bold text-slate-800 dark:text-white font-display">📝 Faltantes</h1>
        <p className="text-sm text-slate-500 dark:text-white/60 mt-1">Anotá lo que se te está acabando y a quién comprárselo.</p>
      </div>

      {error && <div className="bg-rose-50 dark:bg-rose-900/10 border border-rose-200 dark:border-rose-900/30 text-rose-600 dark:text-rose-400 text-sm rounded-lg p-3">{error}</div>}

      {faltantesDeHoy.length > 0 && (
        <div className="bg-amber-50 dark:bg-amber-900/10 border border-amber-200 dark:border-amber-900/30 rounded-2xl p-4">
          <p className="text-sm font-semibold text-amber-700 dark:text-amber-400">🔔 Hoy pasa tu proveedor — te falta:</p>
          <p className="text-sm text-amber-700 dark:text-amber-400 mt-1">{faltantesDeHoy.map(f => f.nombre).join(", ")}</p>
        </div>
      )}

      {puedeEditar && (
        <div className="bg-white dark:bg-neutral-900 border border-slate-200 dark:border-white/10 rounded-2xl p-5">
          <h2 className="font-semibold text-slate-800 dark:text-white text-sm mb-3">Agregar faltante</h2>
          <div className="flex flex-col sm:flex-row gap-2">
            <input value={nombreNuevo} onChange={(e) => setNombreNuevo(e.target.value)} placeholder="Ej. huevo, jugos, maseca..."
              onKeyDown={(e) => e.key === "Enter" && agregar()}
              className="flex-1 px-3 py-2.5 rounded-lg border border-slate-200 dark:border-white/10 bg-slate-50 dark:bg-black text-sm text-slate-800 dark:text-white outline-none focus:ring-2 focus:ring-[#E3A73B]" />
            <select value={proveedorNuevo} onChange={(e) => setProveedorNuevo(e.target.value)}
              className="px-3 py-2.5 rounded-lg border border-slate-200 dark:border-white/10 bg-slate-50 dark:bg-black text-sm text-slate-800 dark:text-white outline-none">
              <option value="">Sin proveedor fijo</option>
              {proveedores.map(p => <option key={p.id} value={p.id}>{p.nombre}</option>)}
            </select>
            <button onClick={agregar} disabled={guardando}
              className="px-4 py-2.5 rounded-lg bg-[#16233D] text-white text-sm font-semibold disabled:opacity-50">
              {guardando ? "..." : "Agregar"}
            </button>
          </div>
        </div>
      )}

      <div className="bg-white dark:bg-neutral-900 border border-slate-200 dark:border-white/10 rounded-2xl p-5">
        <h2 className="font-semibold text-slate-800 dark:text-white text-sm mb-3">Pendientes ({pendientes.length})</h2>
        {cargando ? <p className="text-sm text-slate-400">Cargando...</p> : pendientes.length === 0 ? (
          <p className="text-sm text-slate-400 dark:text-white/40">No tenés faltantes pendientes 🎉</p>
        ) : (
          <div className="space-y-2">
            {pendientes.map(f => {
              const prov = proveedorPorId(f.proveedor_id);
              return (
                <div key={f.id} className="flex items-center justify-between gap-2 py-2 border-b border-slate-100 dark:border-white/5 last:border-0">
                  <label className="flex items-center gap-3 flex-1 cursor-pointer">
                    <input type="checkbox" disabled={!puedeEditar} onChange={() => onMarcarFaltante(f, true)}
                      className="w-4 h-4 rounded accent-[#E3A73B]" />
                    <div>
                      <p className="text-sm text-slate-800 dark:text-white">{f.nombre}</p>
                      {prov && <p className="text-[11px] text-slate-400 dark:text-white/40">{prov.nombre}{prov.dias_semana?.length ? ` · ${prov.dias_semana.map(d => DIAS_SEMANA[d].corto).join("/")}` : ""}</p>}
                    </div>
                  </label>
                  {puedeEditar && (
                    <button onClick={() => onEliminarFaltante(f)} className="text-slate-300 hover:text-rose-500 text-sm px-2">✕</button>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </div>

      {compradosRecientes.length > 0 && (
        <div className="bg-white dark:bg-neutral-900 border border-slate-200 dark:border-white/10 rounded-2xl p-5">
          <h2 className="font-semibold text-slate-500 dark:text-white/50 text-sm mb-3">Comprados recientemente</h2>
          <div className="space-y-1">
            {compradosRecientes.map(f => (
              <div key={f.id} className="flex items-center justify-between text-sm text-slate-400 dark:text-white/40">
                <span className="line-through">{f.nombre}</span>
                {puedeEditar && <button onClick={() => onEliminarFaltante(f)} className="hover:text-rose-500 px-2">✕</button>}
              </div>
            ))}
          </div>
        </div>
      )}

      <div className="bg-white dark:bg-neutral-900 border border-slate-200 dark:border-white/10 rounded-2xl p-5">
        <button onClick={() => setMostrarProveedores(v => !v)} className="w-full flex items-center justify-between">
          <h2 className="font-semibold text-slate-800 dark:text-white text-sm">Proveedores ({proveedores.length})</h2>
          <span className="text-slate-400">{mostrarProveedores ? "▲" : "▼"}</span>
        </button>
        {mostrarProveedores && (
          <PanelProveedores proveedores={proveedores} puedeEditar={puedeEditar}
            onCrear={onCrearProveedor} onActualizar={onActualizarProveedor} onEliminar={onEliminarProveedor} />
        )}
      </div>
    </div>
  );
}

function PanelProveedores({ proveedores, puedeEditar, onCrear, onActualizar, onEliminar }) {
  const [nombre, setNombre] = useState("");
  const [telefono, setTelefono] = useState("");
  const [dias, setDias] = useState([]);
  const [guardando, setGuardando] = useState(false);

  const toggleDia = (d) => setDias(prev => prev.includes(d) ? prev.filter(x => x !== d) : [...prev, d].sort());

  const crear = async () => {
    if (!nombre.trim()) { mostrarError("Escribí el nombre del proveedor"); return; }
    setGuardando(true);
    try {
      await onCrear({ nombre: nombre.trim(), telefono: telefono.trim() || null, dias_semana: dias });
      setNombre(""); setTelefono(""); setDias([]);
    } catch (e) { mostrarError(e.message); }
    finally { setGuardando(false); }
  };

  const quitarDia = async (proveedor, d) => {
    const nuevos = (proveedor.dias_semana || []).filter(x => x !== d);
    try { await onActualizar(proveedor.id, { dias_semana: nuevos }); } catch (e) { mostrarError(e.message); }
  };
  const agregarDia = async (proveedor, d) => {
    const nuevos = [...(proveedor.dias_semana || []), d].sort();
    try { await onActualizar(proveedor.id, { dias_semana: nuevos }); } catch (e) { mostrarError(e.message); }
  };

  return (
    <div className="mt-4 space-y-4">
      {proveedores.map(p => (
        <div key={p.id} className="border border-slate-100 dark:border-white/10 rounded-xl p-3">
          <div className="flex items-center justify-between">
            <div>
              <p className="text-sm font-semibold text-slate-800 dark:text-white">{p.nombre}</p>
              {p.telefono && <p className="text-xs text-slate-400 dark:text-white/40">{p.telefono}</p>}
            </div>
            {puedeEditar && <button onClick={async () => { if (await confirmarAccion(`¿Eliminar al proveedor "${p.nombre}"? Los faltantes que le tenías asignados se quedan sin proveedor.`)) { try { await onEliminar(p); } catch (e) { mostrarError(e.message); } } }} className="text-slate-300 hover:text-rose-500 text-sm px-2">✕</button>}
          </div>
          <div className="flex flex-wrap gap-1.5 mt-2">
            {DIAS_SEMANA.map(d => {
              const activo = (p.dias_semana || []).includes(d.valor);
              return (
                <button key={d.valor} disabled={!puedeEditar} onClick={() => activo ? quitarDia(p, d.valor) : agregarDia(p, d.valor)}
                  className={`text-[11px] px-2 py-1 rounded-full font-semibold ${activo ? "bg-[#E3A73B] text-white" : "bg-slate-100 dark:bg-white/10 text-slate-400 dark:text-white/40"}`}>
                  {d.corto}
                </button>
              );
            })}
          </div>
        </div>
      ))}

      {puedeEditar && (
        <div className="border border-dashed border-slate-200 dark:border-white/10 rounded-xl p-3">
          <p className="text-xs font-semibold text-slate-500 dark:text-white/60 uppercase mb-2">Nuevo proveedor</p>
          <div className="grid sm:grid-cols-2 gap-2 mb-2">
            <input value={nombre} onChange={(e) => setNombre(e.target.value)} placeholder="Agencia / proveedor"
              className="px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-slate-50 dark:bg-black text-sm text-slate-800 dark:text-white outline-none" />
            <input value={telefono} onChange={(e) => setTelefono(e.target.value)} placeholder="Teléfono (opcional)"
              className="px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-slate-50 dark:bg-black text-sm text-slate-800 dark:text-white outline-none" />
          </div>
          <div className="flex flex-wrap gap-1.5 mb-2">
            {DIAS_SEMANA.map(d => (
              <button key={d.valor} onClick={() => toggleDia(d.valor)}
                className={`text-[11px] px-2 py-1 rounded-full font-semibold ${dias.includes(d.valor) ? "bg-[#E3A73B] text-white" : "bg-slate-100 dark:bg-white/10 text-slate-400 dark:text-white/40"}`}>
                {d.corto}
              </button>
            ))}
          </div>

// Un mismo código físico a veces se lee distinto entre escaneos (ej: UPC-A de 12 dígitos
// vs EAN-13 con un cero agregado adelante). Esto genera todas las variantes válidas para comparar.
function variantesCodigoBarra(valor) {
  const base = (valor || "").toString().trim();
  const variantes = new Set([base]);
  if (/^\d+$/.test(base)) {
    if (base.length === 12) variantes.add("0" + base);
    if (base.length === 13 && base[0] === "0") variantes.add(base.slice(1));
  }
  return [...variantes];
}

// Reglas de crédito por defecto (se sobreescriben con negocio_config.reglas_credito).
// No están fijas en el código: cualquier negocio puede tener las suyas.
const REGLAS_CREDITO_DEFAULT = { dias_plazo: 15, dias_proximo_vencer: 3, comision_porcentaje: 2, credito_nuevo_segun_abonado: true };

// Rango de atraso, para agrupar clientes atrasados (16-30 / 31-60 / 61-90 / +90 días).
function calcularRangoAtraso(diasAtraso) {
  if (diasAtraso == null || diasAtraso < 1) return null;
  if (diasAtraso <= 30) return "16-30 días";
  if (diasAtraso <= 60) return "31-60 días";
  if (diasAtraso <= 90) return "61-90 días";
  return "Más de 90 días";
}

// Máquina de estados: Al día → Próximo a vencer → Vencido → Bloqueado (y Desbloqueado al pagar/reactivar).
// La categoría manual (deuda antigua / recuperado) la decide el administrador y tiene prioridad sobre el cálculo automático.
function calcularEstadoCliente(cliente, ultimaActividad, reglas = REGLAS_CREDITO_DEFAULT) {
  const saldo = Number(cliente.saldo_pendiente) || 0;

  if (cliente.categoria_manual === "deuda_antigua") {
    return { label: "Deuda antigua", dot: "🔴", tono: "danger", categoria: "deuda_antigua", diasAtraso: null, rango: null };
  }
  if (cliente.categoria_manual === "recuperado" && saldo <= 0) {
    return { label: "Recuperado", dot: "✅", tono: "ok", categoria: "recuperado", diasAtraso: null, rango: null };
  }
  if (saldo <= 0) {
    return { label: "Al día", dot: "🟢", tono: "ok", categoria: "activo", diasAtraso: 0, rango: null };
  }
  if (cliente.bloqueado) {
    const fechaRefB = ultimaActividad || cliente.creado_en;
    const diasB = fechaRefB ? Math.floor((Date.now() - new Date(fechaRefB).getTime()) / 86400000) : null;
    return { label: "Bloqueado", dot: "🚫", tono: "danger", categoria: "atrasado", diasAtraso: diasB, rango: calcularRangoAtraso(diasB) };
  }

  const plazo = Number(reglas?.dias_plazo ?? 15);
  const avisoPrevio = Number(reglas?.dias_proximo_vencer ?? 3);
  const fechaRef = ultimaActividad || cliente.creado_en;
  const dias = fechaRef ? (Date.now() - new Date(fechaRef).getTime()) / 86400000 : 999;

  if (dias >= plazo) {
    const diasAtraso = Math.floor(dias - plazo);
    return { label: "Vencido", dot: "🔴", tono: "danger", categoria: "atrasado", diasAtraso, rango: calcularRangoAtraso(diasAtraso) };
  }
  if (dias >= plazo - avisoPrevio) {
    return { label: "Próximo a vencer", dot: "🟡", tono: "warn", categoria: "activo", diasAtraso: 0, rango: null };
  }
  return { label: "Al día", dot: "🟢", tono: "ok", categoria: "activo", diasAtraso: 0, rango: null };
}

// % de crédito nuevo disponible según lo ya abonado (si la regla está activa).
function calcularCreditoDisponiblePct(totalOriginal, totalPagado, reglas = REGLAS_CREDITO_DEFAULT) {
  if (!reglas?.credito_nuevo_segun_abonado || !(totalOriginal > 0)) return null;
  return Math.max(0, Math.min(100, Math.round((totalPagado / totalOriginal) * 100)));
}

function TarjetaCliente({ cliente, estado, totalPagado, ultimaActividad, onAbrirMenu, onAbonar, reglasCredito }) {

  const progreso = totalOriginal > 0 ? Math.min(100, Math.round((totalPagado / totalOriginal) * 100)) : 100;
  const estadoFinal = estado || calcularEstadoCliente(cliente, ultimaActividad, reglasCredito);
  const creditoDisponiblePct = calcularCreditoDisponiblePct(totalOriginal, totalPagado, reglasCredito);

// --- Enviar aviso: arma el mensaje con datos reales del cliente y abre WhatsApp con el texto listo.
// Nunca "envía" nada por sí solo — si no hay teléfono o el usuario cierra WhatsApp sin mandar, no se finge un envío.
function ModalAviso({ abierto, cliente, reglasCredito, ultimaActividad, onEnviar, onCerrar, nombreNegocio }) {
  const [tipo, setTipo] = useState("recordatorio_abono");
  useEffect(() => { if (abierto) setTipo("recordatorio_abono"); }, [abierto, cliente]);
  if (!abierto || !cliente) return null;

  const saldo = Number(cliente.saldo_pendiente) || 0;
  const estado = calcularEstadoCliente(cliente, ultimaActividad, reglasCredito);
  const diasTexto = estado.diasAtraso ? `${estado.diasAtraso} día(s)` : null;
  const negocio = (nombreNegocio || "").trim() || "Nuestro negocio";

  // Encabezado y cierre iguales para todos los avisos, para que se vea como una notificación
  // del sistema del negocio y no como un mensaje personal escrito a mano.
  const encabezado = `🔔 *${negocio}*\n_Aviso automático de tu cuenta_\n\nHola *${cliente.nombre}*,`;
  const cierre = `\n\n━━━━━━━━━━━━\n_Este es un mensaje automático generado por el sistema de ${negocio}. Por cualquier consulta, respondé este mismo chat._`;
  const armar = (cuerpo) => `${encabezado}\n\n${cuerpo}${cierre}`;

  const TIPOS = {
    proximo_vencer: { label: "🔔 Crédito próximo a vencer", texto: armar(`Te informamos que tu crédito está *próximo a vencer*.\n\n💰 Saldo pendiente: *${formatMoneda(saldo.toFixed(2))}*`) },
    recordatorio_abono: { label: "💰 Recordatorio de abono", texto: armar(`Este es un recordatorio de tu saldo pendiente.\n\n💰 Saldo pendiente: *${formatMoneda(saldo.toFixed(2))}*\n\nCuando puedas, te esperamos para tu abono.`) },
    vencido: { label: "📅 Crédito vencido", texto: armar(`Tu crédito figura como *vencido*${diasTexto ? ` desde hace ${diasTexto}` : ""} en nuestro sistema.\n\n💰 Saldo pendiente: *${formatMoneda(saldo.toFixed(2))}*\n\nPor favor comunicate con nosotros para regularizar tu situación.`) },
    bloqueado: { label: "🚫 Crédito bloqueado", texto: armar(`Tu crédito ha sido *bloqueado* por el sistema debido al atraso en los pagos.\n\n💰 Saldo pendiente: *${formatMoneda(saldo.toFixed(2))}*\n\nEscribinos para conocer los pasos para regularizarlo.`) },
    desbloqueado: { label: "🔓 Crédito desbloqueado", texto: armar(`Te informamos que tu crédito fue *desbloqueado*. ¡Gracias por ponerte al día!`) },
    abono_registrado: { label: "✅ Abono registrado", texto: armar(`Confirmamos el registro de tu abono.\n\n💰 Saldo pendiente actual: *${formatMoneda(saldo.toFixed(2))}*\n\n¡Gracias por tu pago!`) },
    saldo_pendiente: { label: "💳 Recordatorio de saldo", texto: armar(`Te recordamos tu saldo pendiente registrado en nuestro sistema.\n\n💰 Saldo pendiente: *${formatMoneda(saldo.toFixed(2))}*`) },
  };

  return (
    <div className="fixed inset-0 bg-black/40 flex items-end sm:items-center justify-center z-50" onClick={onCerrar}>
      <div onClick={(e) => e.stopPropagation()} className="bg-white dark:bg-black rounded-t-2xl sm:rounded-2xl p-5 w-full sm:max-w-sm">
        <div className="font-semibold text-slate-800 dark:text-white mb-3 font-display">Enviar aviso a {cliente.nombre}</div>
        <div className="space-y-1.5 mb-3">
          {Object.entries(TIPOS).map(([id, t]) => (
            <button key={id} onClick={() => setTipo(id)}
              className={`w-full text-left px-3 py-2.5 rounded-lg text-sm font-medium border ${tipo === id ? "border-[#E3A73B] bg-amber-50 dark:bg-amber-900/10 text-slate-800 dark:text-white" : "border-slate-200 dark:border-white/10 text-slate-600 dark:text-white/70 hover:bg-slate-50 dark:hover:bg-white/5"}`}>
              {t.label}
            </button>
          ))}
        </div>
        <div className="text-xs text-slate-500 dark:text-white/60 bg-slate-50 dark:bg-white/5 rounded-lg p-3 mb-3 whitespace-pre-wrap">{TIPOS[tipo].texto}</div>
        <p className="text-[11px] text-slate-400 dark:text-white/40 mb-3">Se abre WhatsApp con este mensaje ya escrito — solo tenés que tocar enviar. Sigue mandándose desde tu número; el formato lo hace ver como una notificación del sistema, no como un mensaje personal.</p>
        <button onClick={() => onEnviar(cliente, TIPOS[tipo].label, TIPOS[tipo].texto)} className="w-full px-3 py-2.5 rounded-lg text-sm font-semibold bg-[#16233D] text-white hover:brightness-110 mb-2">📤 Preparar y abrir WhatsApp</button>
        <button onClick={onCerrar} className="w-full px-3 py-2.5 rounded-lg text-sm font-medium border border-slate-200 dark:border-white/10 text-slate-600 dark:text-white">Cancelar</button>
      </div>
    </div>
  );
}

  const recargar = useCallback(() => {
    if (!cliente) return;
    setCargando(true);
    Promise.all([
      obtenerConRespaldo(`fiados_cliente_${cliente.id}`, () => supaApi.listarFiadosCliente(cliente.id)),
      obtenerConRespaldo(`historial_cliente_${cliente.id}`, () => supaApi.listarHistorialCliente(cliente.id)).catch(() => ({ datos: [], offline: false })),
    ])
      .then(([{ datos, offline }, historialRes]) => { setFiados(datos); setHistorial(historialRes.datos || []); if (offline) notificarConexion("sin_conexion"); })
      .catch(() => { setFiados([]); setHistorial([]); })
      .finally(() => setCargando(false));
  }, [cliente]);

  useEffect(() => {
    if (!abierto || !cliente) return;
    recargar();
  }, [abierto, cliente]);

  if (!abierto || !cliente) return null;
  const pagosCliente = pagos.filter(p => p.cliente_id === cliente.id);

              <div className="flex items-center justify-between text-sm">
                <span className="font-mono font-semibold text-slate-700 dark:text-white">{formatMoneda(Number(f.total).toFixed(2))}</span>
                <span className="text-xs text-slate-400 dark:text-white/40">{new Date(f.creado_en).toLocaleString()}</span>

              <div className="text-xs text-slate-500 dark:text-white/60 mt-1 mb-2 space-y-0.5">
