function ModalNuevoFiado({ abierto, clientes, productos, clientePreseleccionado, onGuardar, onCerrar, guardando }) {
  const [clienteId, setClienteId] = useState("");
  const [items, setItems] = useState([]);
  const [productoSel, setProductoSel] = useState(null);
  const [cantidadSel, setCantidadSel] = useState("1");
  const [busquedaProducto, setBusquedaProducto] = useState("");
  const [listaAbierta, setListaAbierta] = useState(false);
  const [modoRapido, setModoRapido] = useState(false);
  const [textoRapido, setTextoRapido] = useState("");
  const [escuchando, setEscuchando] = useState(false);
  const [noResueltos, setNoResueltos] = useState([]);
  const [modoItem, setModoItem] = useState("inventario"); // "inventario" | "externo"
  const [nombreExterno, setNombreExterno] = useState("");
  const [cantidadExterno, setCantidadExterno] = useState("1");
  const [precioExterno, setPrecioExterno] = useState("");
  const reconocedorRef = React.useRef(null);
  const detenerManualRef = React.useRef(false);
  const soportaVoz = typeof window !== "undefined" && (window.SpeechRecognition || window.webkitSpeechRecognition);

  useEffect(() => {
    if (abierto) {
      setClienteId(clientePreseleccionado ? clientePreseleccionado.id : "");
      setItems([]); setProductoSel(null); setCantidadSel("1"); setBusquedaProducto(""); setListaAbierta(false);
      setModoRapido(false); setTextoRapido(""); setNoResueltos([]); setEscuchando(false);
      setModoItem("inventario"); setNombreExterno(""); setCantidadExterno("1"); setPrecioExterno("");
    }
  }, [abierto, clientePreseleccionado]);

  if (!abierto) return null;

  const productosFiltrados = productos.filter(p => p.nombre.toLowerCase().includes(busquedaProducto.toLowerCase()));

  const elegirProducto = (p) => {
    setProductoSel(p);
    setBusquedaProducto(p.nombre);
    setListaAbierta(false);
  };

  const agregarProductoALista = (producto, cant) => {
    const yaEnCarrito = items.reduce((a, it) => a + (it.producto_id === producto.id ? it.cantidad : 0), 0);
    if (cant + yaEnCarrito > producto.cantidad) return false;
    setItems(prev => [...prev, { producto_id: producto.id, nombre: producto.nombre, cantidad: cant, precio_unitario: producto.venta, tipo: "inventario" }]);
    return true;
  };

  const agregarItem = () => {
    const producto = productoSel;
    const cant = parseFloat(cantidadSel) || 0;
    if (!producto || cant <= 0) return;
    const ok = agregarProductoALista(producto, cant);
    if (!ok) { mostrarError(`Solo hay ${producto.cantidad} unidades de ${producto.nombre} en stock.`); return; }
    setProductoSel(null); setCantidadSel("1"); setBusquedaProducto("");
  };

  const agregarItemExterno = () => {
    const cant = parseFloat(cantidadExterno) || 0;
    const precio = parseFloat(precioExterno) || 0;
    if (!nombreExterno.trim() || cant <= 0 || precio <= 0) { mostrarError("Completá nombre, cantidad y precio."); return; }
    setItems(prev => [...prev, { producto_id: null, nombre: nombreExterno.trim(), cantidad: cant, precio_unitario: precio, tipo: "externo" }]);
    setNombreExterno(""); setCantidadExterno("1"); setPrecioExterno("");
  };

  const quitarItem = (i) => setItems(items.filter((_, idx) => idx !== i));
  const total = items.reduce((a, it) => a + it.cantidad * it.precio_unitario, 0);

  const toggleMicrofono = () => {
    if (!soportaVoz) return;
    if (escuchando) { detenerManualRef.current = true; reconocedorRef.current && reconocedorRef.current.stop(); return; }
    detenerManualRef.current = false;
    iniciarReconocimiento();
  };

  const iniciarReconocimiento = () => {
    const Reconocedor = window.SpeechRecognition || window.webkitSpeechRecognition;
    const r = new Reconocedor();
    r.lang = "es-NI";
    r.continuous = true;
    r.interimResults = false;
    r.onresult = (ev) => {
      let textoNuevo = "";
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        if (ev.results[i].isFinal) textoNuevo += ev.results[i][0].transcript + ". ";
      }
      if (textoNuevo) setTextoRapido(prev => (prev ? prev + "\n" : "") + textoNuevo.trim());
    };
    r.onend = () => {
      // Si se cortó solo (por silencio) y el usuario no lo detuvo a propósito, lo reactivamos
      if (!detenerManualRef.current) {
        try { r.start(); return; } catch (e) { /* si falla, seguimos y lo apagamos */ }
      }
      setEscuchando(false);
    };
    r.onerror = (ev) => {
      if (ev.error === "no-speech" || ev.error === "aborted") return; // no cortar el ciclo por silencios cortos
      setEscuchando(false);
    };
    reconocedorRef.current = r;
    r.start();
    setEscuchando(true);
  };

  const NUMEROS_PALABRA = { un: 1, uno: 1, una: 1, dos: 2, tres: 3, cuatro: 4, cinco: 5, seis: 6, siete: 7, ocho: 8, nueve: 9, diez: 10, media: 0.5, medio: 0.5 };
  const PALABRAS_UNIDAD = ["libra", "libras", "unidad", "unidades", "unidades de", "kilo", "kilos", "kg", "litro", "litros", "bolsa", "bolsas", "caja", "cajas", "paquete", "paquetes"];

  const buscarProductoParecido = (nombreCrudo) => {
    const q = nombreCrudo.toLowerCase().trim();
    if (!q) return null;
    const candidatos = productos.filter(p => p.nombre.toLowerCase().includes(q) || q.includes(p.nombre.toLowerCase()));
    if (candidatos.length === 0) return null;
    candidatos.sort((a, b) => Math.abs(a.nombre.length - q.length) - Math.abs(b.nombre.length - q.length));
    return candidatos[0];
  };

  // Interpreta una frase como "una libra de arroz veinte córdobas" -> { nombre: "arroz", cantidad: 1, precio: 20 }
  const interpretarLinea = (lineaOriginal) => {
    let linea = lineaOriginal.toLowerCase().trim();
    let precio = null;

    // 1) Detectar precio con palabra comando "precio", o con el nombre/símbolo
    //    de cualquier moneda soportada (córdobas, bolívares, c$, bs, pesos...)
    const mPrecioComando = linea.match(/precio\s*(?:de\s*)?(\d+(?:[.,]\d+)?)/i);
    const aliasMoneda = regexAliasMonedaTexto();
    const mPrecioMoneda = linea.match(new RegExp(`(\\d+(?:[.,]\\d+)?)\\s*(?:${aliasMoneda})\\b`, "i")) || linea.match(new RegExp(`(?:${aliasMoneda})\\s*(\\d+(?:[.,]\\d+)?)`, "i"));
    const mPrecio = mPrecioComando || mPrecioMoneda;
    if (mPrecio) {
      precio = parseFloat(mPrecio[1].replace(",", "."));
      linea = linea.replace(mPrecio[0], " ");
    }

    // 2) Detectar cantidad: dígito o palabra numérica al inicio (posiblemente seguida de "x" o unidad)
    let cantidad = 1;
    const mNumeroDigito = linea.match(/^\s*(\d+(?:[.,]\d+)?)\s*/);
    if (mNumeroDigito) {
      cantidad = parseFloat(mNumeroDigito[1].replace(",", "."));
      linea = linea.slice(mNumeroDigito[0].length);
    } else {
      const primeraPalabra = linea.trim().split(/\s+/)[0];
      if (primeraPalabra && NUMEROS_PALABRA[primeraPalabra] !== undefined) {
        cantidad = NUMEROS_PALABRA[primeraPalabra];
        linea = linea.trim().split(/\s+/).slice(1).join(" ");
      }
    }

    // 3) Quitar palabras de unidad y conectores sueltos ("de")
    PALABRAS_UNIDAD.forEach(u => { linea = linea.replace(new RegExp(`\\b${u}\\b`, "gi"), " "); });
    linea = linea.replace(/^\s*de\s+/i, " ").replace(/\s+x\s*$/i, "");

    // 4) Si todavía no hay precio y queda un número suelto al final, lo tomamos como precio
    //    (por si dijiste el número sin decir "precio" ni "córdobas")
    if (precio === null) {
      const mNumeroFinal = linea.match(/(\d+(?:[.,]\d+)?)\s*$/);
      if (mNumeroFinal) {
        precio = parseFloat(mNumeroFinal[1].replace(",", "."));
        linea = linea.slice(0, mNumeroFinal.index);
      }
    }

    const nombre = linea.replace(/\s+/g, " ").trim();
    return { nombre, cantidad, precio };
  };

  const interpretarTexto = () => {
    // Separar por líneas y también por comas, para que sirva tanto escrito como dictado de corrido
    const partes = textoRapido.split(/\n|,|\.(?!\d)/).map(s => s.trim()).filter(Boolean);
    if (partes.length === 0) return;

    let resto = partes;
    // Intentar reconocer el nombre del cliente en la primera línea
    if (!clienteId) {
      const primera = partes[0].toLowerCase();
      const clienteEncontrado = clientes.find(c => primera.includes(c.nombre.toLowerCase()) || c.nombre.toLowerCase().includes(primera));
      if (clienteEncontrado) {
        setClienteId(clienteEncontrado.id);
        resto = partes.slice(1);
      }
    }

    const sinResolver = [];
    resto.forEach(linea => {
      const { nombre, cantidad, precio } = interpretarLinea(linea);
      if (!nombre) return;

      // Modo "Fuera del inventario": no busca en el inventario, todo se agrega directo como externo
      if (modoItem === "externo") {
        if (precio === null) { sinResolver.push({ texto: linea, nombreCrudo: nombre, cantidad, precio }); return; }
        setItems(prev => [...prev, { producto_id: null, nombre, cantidad, precio_unitario: precio / cantidad, tipo: "externo" }]);
        return;
      }

      // Modo "Del inventario": el precio dictado se toma como TOTAL de la línea, pero
      // si el producto existe en inventario, siempre manda el precio real guardado (se autocorrige).
      const producto = buscarProductoParecido(nombre);
      if (producto) {
        const yaEnCarrito = items.reduce((a, it) => a + (it.producto_id === producto.id ? it.cantidad : 0), 0);
        if (cantidad + yaEnCarrito > producto.cantidad) { sinResolver.push({ texto: linea, nombreCrudo: nombre, cantidad, precio }); return; }
        setItems(prev => [...prev, { producto_id: producto.id, nombre: producto.nombre, cantidad, precio_unitario: producto.venta, tipo: "inventario" }]);
      } else {
        sinResolver.push({ texto: linea, nombreCrudo: nombre, cantidad, precio });
      }
    });
    setNoResueltos(sinResolver);
    setTextoRapido("");
  };

  const resolverManual = (i, producto) => {
    const item = noResueltos[i];
    const ok = agregarProductoALista(producto, item.cantidad);
    if (!ok) { mostrarError(`Solo hay ${producto.cantidad} unidades de ${producto.nombre} en stock.`); return; }
    setNoResueltos(noResueltos.filter((_, idx) => idx !== i));
  };

  const resolverComoExterno = (i) => {
    const item = noResueltos[i];
    if (!item.precio) { mostrarError("No reconocí el precio de este — agregalo como externo a mano abajo."); return; }
    setItems(prev => [...prev, { producto_id: null, nombre: item.nombreCrudo, cantidad: item.cantidad, precio_unitario: item.precio / item.cantidad, tipo: "externo" }]);
    setNoResueltos(noResueltos.filter((_, idx) => idx !== i));
  };

  const descartarNoResuelto = (i) => setNoResueltos(noResueltos.filter((_, idx) => idx !== i));

  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-40">
      <div className="bg-white dark:bg-black rounded-2xl p-6 w-full max-w-md max-h-[90vh] overflow-y-auto">
        <h2 className="font-semibold text-slate-800 dark:text-white mb-4 font-display">Registrar fiado</h2>

        <button onClick={() => setModoRapido(!modoRapido)} className="text-xs font-semibold text-[#16233D] dark:text-[#E3A73B] mb-3 underline">
          {modoRapido ? "← Volver a la forma normal" : "🎤 Dictar o escribir todo de un jalón"}
        </button>

        {modoRapido && (
          <div className="bg-slate-50 dark:bg-neutral-900 rounded-lg p-3 mb-4">
            <p className="text-xs text-slate-500 dark:text-white/60 mb-2">Ej: "María López, arroz x2, aceite x1, jabón x3" — por voz o escrito.</p>
            <textarea value={textoRapido} onChange={(e) => setTextoRapido(e.target.value)} rows={3} placeholder="Escribí o dictá aquí..."
              className="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm text-slate-700 dark:text-white outline-none focus:border-[#E3A73B] mb-2" />
            <div className="flex gap-2">
              {soportaVoz && (
                <button onClick={toggleMicrofono} className={`px-4 py-2 rounded-lg text-sm font-semibold ${escuchando ? "bg-rose-500 text-white animate-pulse" : "bg-[#16233D] text-white"}`}>
                  {escuchando ? "🔴 Escuchando... (tocá para parar)" : "🎤 Hablar"}
                </button>
              )}
              <button onClick={interpretarTexto} disabled={!textoRapido.trim()} className="flex-1 px-4 py-2 rounded-lg text-sm font-semibold bg-[#E3A73B] text-[#16233D] disabled:opacity-50">
                Interpretar
              </button>
            </div>
            {!soportaVoz && <p className="text-[11px] text-slate-400 mt-2">Tu navegador no soporta dictado por voz aquí, pero podés escribirlo igual.</p>}
          </div>
        )}

        {noResueltos.length > 0 && (
          <div className="bg-amber-50 dark:bg-amber-900/10 border border-amber-200 dark:border-amber-900/30 rounded-lg p-3 mb-4">
            <p className="text-xs font-semibold text-amber-700 dark:text-amber-400 mb-2">⚠️ No identifiqué estos — elegí el producto correcto:</p>
            <div className="space-y-2">
              {noResueltos.map((item, i) => (
                <div key={i} className="bg-white dark:bg-black rounded-lg p-2">
                  <div className="text-xs text-slate-600 dark:text-white/70 mb-1.5">
                    "{item.texto}" — cant: {item.cantidad}{item.precio !== null ? ` · precio: ${formatMoneda(item.precio)}` : ""}
                  </div>
                  <div className="flex gap-1.5">
                    <select onChange={(e) => { const p = productos.find(pr => pr.id === e.target.value); if (p) resolverManual(i, p); }} defaultValue=""
                      className="flex-1 min-w-0 px-2 py-1.5 rounded border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-xs text-slate-700 dark:text-white outline-none">
                      <option value="" disabled>Elegir producto del inventario...</option>
                      {productos.map(p => <option key={p.id} value={p.id}>{p.nombre}</option>)}
                    </select>
                    <button onClick={() => descartarNoResuelto(i)} className="text-rose-500 text-xs px-2">Descartar</button>
                  </div>
                  {item.precio !== null && (
                    <button onClick={() => resolverComoExterno(i)} className="w-full mt-1.5 text-xs font-medium text-[#16233D] dark:text-[#E3A73B] underline text-left">
                      O agregar "{item.nombreCrudo}" como fuera de inventario ({formatMoneda(item.precio)})
                    </button>
                  )}
                </div>
              ))}
            </div>
          </div>
        )}

        {clientePreseleccionado ? (
          <div className="mb-4">
            <label className="block text-xs font-semibold text-slate-500 dark:text-white uppercase mb-1">Cliente</label>
            <div className="px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-slate-50 dark:bg-neutral-900 text-sm text-slate-700 dark:text-white">{clientePreseleccionado.nombre}</div>
          </div>
        ) : (
          <>
            <label className="block text-xs font-semibold text-slate-500 dark:text-white uppercase mb-1">Cliente</label>
            <select value={clienteId} onChange={(e) => setClienteId(e.target.value)}
              className="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm text-slate-700 dark:text-white outline-none focus:border-[#E3A73B] mb-4">
              <option value="">Seleccioná un cliente...</option>
              {clientes.map(c => <option key={c.id} value={c.id}>{c.nombre}</option>)}
            </select>
          </>
        )}

        <div className="flex gap-2 mb-3">
          <button onClick={() => setModoItem("inventario")} className={`flex-1 text-xs font-semibold py-2 rounded-lg ${modoItem === "inventario" ? "bg-[#16233D] text-white" : "border border-slate-200 dark:border-white/10 text-slate-600 dark:text-white/70"}`}>Del inventario</button>
          <button onClick={() => setModoItem("externo")} className={`flex-1 text-xs font-semibold py-2 rounded-lg ${modoItem === "externo" ? "bg-[#16233D] text-white" : "border border-slate-200 dark:border-white/10 text-slate-600 dark:text-white/70"}`}>Fuera del inventario</button>
        </div>

        {modoItem === "inventario" ? (
          <>
            <label className="block text-xs font-semibold text-slate-500 dark:text-white uppercase mb-1">Agregar producto</label>
            <div className="relative mb-3">
              <input
                value={busquedaProducto}
                onChange={(e) => { setBusquedaProducto(e.target.value); setProductoSel(null); setListaAbierta(true); }}
                onFocus={() => setListaAbierta(true)}
                placeholder="Escribí el nombre del producto..."
                className="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm text-slate-700 dark:text-white outline-none focus:border-[#E3A73B]" />

              {listaAbierta && (
                <>
                  <div className="fixed inset-0 z-40" onClick={() => setListaAbierta(false)} />
                  <div className="absolute left-0 right-0 top-full mt-1 z-50 bg-white dark:bg-neutral-900 border border-slate-200 dark:border-white/10 rounded-lg shadow-lg max-h-48 overflow-y-auto">
                    {productosFiltrados.length === 0 ? (
                      <p className="text-xs text-slate-400 px-3 py-2.5">Sin resultados.</p>
                    ) : productosFiltrados.map(p => (
                      <button key={p.id} onClick={() => elegirProducto(p)}
                        className="w-full text-left px-3 py-2.5 text-sm text-slate-700 dark:text-white hover:bg-slate-50 dark:hover:bg-white/5 flex items-center justify-between gap-2">
                        <span className="truncate">{p.nombre}</span>
                        <span className="text-xs text-slate-400 shrink-0">stock: {p.cantidad}</span>
                      </button>
                    ))}
                  </div>
                </>
              )}
            </div>

            <div className="flex gap-2 mb-3">
              <div className="flex-1 min-w-0 px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-slate-50 dark:bg-neutral-900 text-sm text-slate-500 dark:text-white/50 truncate">
                {productoSel ? `${productoSel.nombre} (stock: ${productoSel.cantidad})` : "Elegí un producto de la lista"}
              </div>
              <input type="number" value={cantidadSel} onChange={(e) => setCantidadSel(e.target.value)} placeholder="Cant."
                className="w-16 px-2 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm text-slate-700 dark:text-white outline-none focus:border-[#E3A73B]" />
              <button onClick={agregarItem} className="px-3 rounded-lg bg-[#16233D] text-white text-sm font-semibold">+</button>
            </div>
          </>
        ) : (
          <div className="mb-3">
            <p className="text-xs text-slate-400 dark:text-white/40 mb-2">Para productos o cuentas viejas que no están en tu inventario. No afecta el stock.</p>
            <input value={nombreExterno} onChange={(e) => setNombreExterno(e.target.value)} placeholder="Nombre del producto o concepto"
              className="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm text-slate-700 dark:text-white outline-none focus:border-[#E3A73B] mb-2" />
            <div className="flex gap-2">
              <input type="number" value={cantidadExterno} onChange={(e) => setCantidadExterno(e.target.value)} placeholder="Cantidad"
                className="flex-1 px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm text-slate-700 dark:text-white outline-none focus:border-[#E3A73B]" />
              <input type="number" value={precioExterno} onChange={(e) => setPrecioExterno(e.target.value)} placeholder="Precio unitario"
                className="flex-1 px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm text-slate-700 dark:text-white outline-none focus:border-[#E3A73B]" />
              <button onClick={agregarItemExterno} className="px-3 rounded-lg bg-[#16233D] text-white text-sm font-semibold">+</button>
            </div>
          </div>
        )}

        <div className="space-y-1.5 mb-3">
          {items.map((it, i) => (
            <div key={i} className="flex items-center justify-between text-sm bg-slate-50 dark:bg-neutral-900 rounded-lg px-3 py-2">
              <span className="text-slate-700 dark:text-white">
                {it.nombre} x{it.cantidad}
                {it.tipo === "externo" && <span className="text-[10px] text-amber-600 dark:text-amber-400 ml-1.5">(fuera de inventario)</span>}
              </span>
              <div className="flex items-center gap-2">
                <span className="font-mono text-slate-500 dark:text-white/60">{formatMoneda((it.cantidad * it.precio_unitario).toFixed(2))}</span>
                <button onClick={() => quitarItem(i)} className="text-rose-500 text-xs">✕</button>
              </div>
            </div>
          ))}
          {items.length === 0 && <p className="text-sm text-slate-400 py-1">Agregá al menos un producto.</p>}
        </div>

        <div className="bg-slate-50 dark:bg-neutral-900 rounded-lg p-3 text-sm text-slate-700 dark:text-white flex items-center justify-between mb-4">
          <span>Total del fiado</span>
          <span className="font-mono font-bold">{formatMoneda(total.toFixed(2))}</span>
        </div>

        <div className="flex gap-2 justify-end">
          <button onClick={onCerrar} className="px-4 py-2 rounded-lg text-sm font-medium border border-slate-200 dark:border-white/10 text-slate-600 dark:text-white">Cancelar</button>
          <button disabled={guardando || !clienteId || items.length === 0} onClick={() => onGuardar({ cliente_id: clienteId, productos: items, total })}
            className="px-4 py-2 rounded-lg text-sm font-semibold bg-[#E3A73B] text-[#16233D] disabled:opacity-50 flex items-center gap-2">
            {guardando && <IconLoading />} Registrar fiado
          </button>
        </div>
      </div>
    </div>
  );
}

function PaginaCuentasPorCobrar({ clientes, pagosFiado, productos, cargando, error, onRecargar, onCrearCliente, onActualizarCliente, onEliminarCliente, onCrearFiado, onRegistrarPago, onEditarFiado, onEliminarFiado }) {
  const [busqueda, setBusqueda] = useState("");
  const [modalCliente, setModalCliente] = useState(false);
  const [clienteEditando, setClienteEditando] = useState(null);
  const [modalFiado, setModalFiado] = useState(false);
  const [clienteAbono, setClienteAbono] = useState(null);
  const [clienteHistorial, setClienteHistorial] = useState(null);
  const [guardando, setGuardando] = useState(false);
  const [eliminandoId, setEliminandoId] = useState(null);
  const [clienteMenu, setClienteMenu] = useState(null);
  const [clienteParaFiado, setClienteParaFiado] = useState(null);

  const pagosPorCliente = {};
  const ultimaPorCliente = {};
  pagosFiado.forEach(p => {
    pagosPorCliente[p.cliente_id] = (pagosPorCliente[p.cliente_id] || 0) + Number(p.monto);
    if (!ultimaPorCliente[p.cliente_id] || new Date(p.creado_en) > new Date(ultimaPorCliente[p.cliente_id])) {
      ultimaPorCliente[p.cliente_id] = p.creado_en;
    }
  });

  const clientesFiltrados = clientes.filter(c => c.nombre.toLowerCase().includes(busqueda.toLowerCase()));
  const totalPorCobrar = clientes.reduce((a, c) => a + (Number(c.saldo_pendiente) || 0), 0);
  const clientesPendientes = clientes.filter(c => Number(c.saldo_pendiente) > 0).length;
  const ahora = new Date();
  const recuperadoMes = pagosFiado.filter(p => {
    const f = new Date(p.creado_en);
    return f.getFullYear() === ahora.getFullYear() && f.getMonth() === ahora.getMonth();
  }).reduce((a, p) => a + Number(p.monto), 0);

  const guardarCliente = async (form) => {
    setGuardando(true);
    try {
      if (clienteEditando) await onActualizarCliente(clienteEditando.id, { nombre: form.nombre.trim(), telefono: form.telefono.trim() });
      else await onCrearCliente({ nombre: form.nombre.trim(), telefono: form.telefono.trim(), saldo_pendiente: 0 });
      setModalCliente(false); setClienteEditando(null);
    } catch (e) { mostrarError(e.message); }
    finally { setGuardando(false); }
  };

  const guardarFiado = async (datos) => {
    setGuardando(true);
    try {
      await onCrearFiado(datos);
      setModalFiado(false);
    } catch (e) { mostrarError(e.message); }
    finally { setGuardando(false); }
  };

  const guardarAbono = async (monto) => {
    setGuardando(true);
    try {
      await onRegistrarPago(clienteAbono, monto);
      setClienteAbono(null);
    } catch (e) { mostrarError(e.message); }
    finally { setGuardando(false); }
  };

  const eliminarCliente = async (cliente) => {
    if (!(await confirmarAccion(`¿Eliminar a ${cliente.nombre}? Esto borra su historial de fiados y pagos, y devuelve al inventario los productos de sus fiados pendientes. No se puede deshacer.`))) return;
    setEliminandoId(cliente.id);
    try { await onEliminarCliente(cliente); }
    catch (e) { mostrarError(e.message); }
    finally { setEliminandoId(null); }
  };

  return (
    <div>
      <div className="flex items-center justify-between mb-4 gap-3 flex-wrap">
        <div>
          <h1 className="text-xl font-bold text-slate-800 dark:text-white font-display">Cuentas por cobrar</h1>
          <p className="text-sm text-slate-500 dark:text-white/60 mt-1">Fiados, saldos y abonos de tus clientes.</p>
        </div>
        <div className="flex gap-2">
          <button onClick={() => { setClienteEditando(null); setModalCliente(true); }} className="text-xs font-semibold px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 text-slate-600 dark:text-white/80 hover:bg-slate-50 dark:hover:bg-white/5">+ Cliente</button>
          <button onClick={() => { setClienteParaFiado(null); setModalFiado(true); }} className="text-xs font-semibold px-3 py-2 rounded-lg bg-[#E3A73B] text-[#16233D] hover:brightness-105">+ Registrar fiado</button>
        </div>
      </div>

      <div className="grid grid-cols-2 md:grid-cols-3 gap-3 mb-5">
        <StatCard label="Total por cobrar" value={`${formatMoneda(totalPorCobrar.toFixed(2))}`} icon={IconCard} accent="bg-[#16233D]" />
        <StatCard label="Clientes pendientes" value={clientesPendientes} icon={IconUsers} accent="bg-amber-500" />
        <StatCard label="Recuperado este mes" value={`${formatMoneda(recuperadoMes.toFixed(2))}`} icon={IconWallet} accent="bg-emerald-600" />
      </div>

      {error && <div className="bg-rose-50 dark:bg-rose-900/10 border border-rose-200 dark:border-rose-900/30 text-rose-600 dark:text-rose-400 text-sm rounded-lg p-3 mb-4">{error}</div>}

      <input value={busqueda} onChange={(e) => setBusqueda(e.target.value)} placeholder="Buscar cliente..."
        className="w-full px-3 py-2.5 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm text-slate-700 dark:text-white outline-none focus:border-[#E3A73B] mb-4" />

      {cargando ? (
        <p className="text-sm text-slate-400 py-6 text-center">Cargando clientes...</p>
      ) : clientesFiltrados.length === 0 ? (
        <p className="text-sm text-slate-400 py-6 text-center">{clientes.length === 0 ? "Todavía no tenés clientes registrados." : "No se encontraron clientes."}</p>
      ) : (
        <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
          {clientesFiltrados.map(c => (
            <TarjetaCliente key={c.id} cliente={c} totalPagado={pagosPorCliente[c.id] || 0} ultimaActividad={ultimaPorCliente[c.id]}
              onAbonar={() => setClienteAbono(c)} onAbrirMenu={() => setClienteMenu(c)} />
          ))}
        </div>
      )}

      <ModalAccionesCliente cliente={clienteMenu} onCerrar={() => setClienteMenu(null)}
        onAgregarFiado={() => { setClienteParaFiado(clienteMenu); setModalFiado(true); setClienteMenu(null); }}
        onAbonar={() => { setClienteAbono(clienteMenu); setClienteMenu(null); }}
        onHistorial={() => { setClienteHistorial(clienteMenu); setClienteMenu(null); }}
        onEditar={() => { setClienteEditando(clienteMenu); setModalCliente(true); setClienteMenu(null); }}
        onEliminar={() => { const c = clienteMenu; setClienteMenu(null); eliminarCliente(c); }} />

      <ModalCliente abierto={modalCliente} cliente={clienteEditando} guardando={guardando} onGuardar={guardarCliente} onCerrar={() => { setModalCliente(false); setClienteEditando(null); }} />
      <ModalNuevoFiado abierto={modalFiado} clientes={clientes} productos={productos} clientePreseleccionado={clienteParaFiado} guardando={guardando} onGuardar={guardarFiado} onCerrar={() => { setModalFiado(false); setClienteParaFiado(null); }} />
      <ModalAbono abierto={!!clienteAbono} cliente={clienteAbono} guardando={guardando} onGuardar={guardarAbono} onCerrar={() => setClienteAbono(null)} />
      <ModalHistorialCliente abierto={!!clienteHistorial} cliente={clienteHistorial} pagos={pagosFiado} onCerrar={() => setClienteHistorial(null)} onEditarFiado={onEditarFiado} onEliminarFiado={onEliminarFiado} />
    </div>
  );
}

function TarjetaLoteActivo({ lote, productos, onAgregarIngrediente, onFinalizar, onEliminar }) {
  const [modo, setModo] = useState("inventario");
  const [busquedaIng, setBusquedaIng] = useState("");
  const [listaAbierta, setListaAbierta] = useState(false);
  const [ingredienteInv, setIngredienteInv] = useState(null);
  const [cantidadIng, setCantidadIng] = useState("");
  const [nombreNuevoIng, setNombreNuevoIng] = useState("");
  const [cantidadNuevoIng, setCantidadNuevoIng] = useState("");
  const [unidadNuevoIng, setUnidadNuevoIng] = useState("unidad");
  const [guardandoIng, setGuardandoIng] = useState(false);
  const [finalizando, setFinalizando] = useState(false);
  const [unidadesFinal, setUnidadesFinal] = useState("");
  const [mostrarFinalizar, setMostrarFinalizar] = useState(false);

  const productosFiltrados = productos.filter(p => p.nombre.toLowerCase().includes(busquedaIng.toLowerCase()));

  const elegirIngredienteInv = (p) => {
    setIngredienteInv(p);
    setBusquedaIng(p.nombre);
    setListaAbierta(false);
  };

  const agregarDelInventario = async () => {
    const cant = parseFloat(cantidadIng) || 0;
    if (!ingredienteInv || cant <= 0) { mostrarError("Elegí un ingrediente del inventario y una cantidad."); return; }
    setGuardandoIng(true);
    try {
      await onAgregarIngrediente(lote, { tipo: "inventario", producto_id: ingredienteInv.id, nombre: ingredienteInv.nombre, cantidad: cant, unidad: "u." });
      setIngredienteInv(null); setBusquedaIng(""); setCantidadIng("");
    } catch (e) { mostrarError(e.message); }
    finally { setGuardandoIng(false); }
  };

  const agregarNuevo = async () => {
    const cant = parseFloat(cantidadNuevoIng) || 0;
    if (!nombreNuevoIng.trim() || cant <= 0) { mostrarError("Escribí el nombre del ingrediente y una cantidad."); return; }
    setGuardandoIng(true);
    try {
      await onAgregarIngrediente(lote, { tipo: "nuevo", producto_id: null, nombre: nombreNuevoIng.trim(), cantidad: cant, unidad: unidadNuevoIng });
      setNombreNuevoIng(""); setCantidadNuevoIng(""); setUnidadNuevoIng("unidad");
    } catch (e) { mostrarError(e.message); }
    finally { setGuardandoIng(false); }
  };

  const finalizar = async () => {
    setFinalizando(true);
    try {
      await onFinalizar(lote, unidadesFinal ? parseFloat(unidadesFinal) : null);
    } catch (e) { mostrarError(e.message); }
    finally { setFinalizando(false); }
  };

  const ingredientes = lote.ingredientes || [];

  return (
    <div className="bg-white dark:bg-neutral-900 border border-[#E3A73B]/40 rounded-2xl p-5">
      <div className="flex items-center justify-between mb-1">
        <div className="font-semibold text-slate-800 dark:text-white font-display">{lote.producto_nombre}</div>
        <div className="flex items-center gap-2">
          <Badge tone="warn">En proceso</Badge>
          <button onClick={() => onEliminar(lote)} className="text-slate-400 hover:text-rose-500 text-sm">🗑️</button>
        </div>
      </div>
      <div className="text-xs text-slate-400 dark:text-white/40 mb-4">Iniciado {new Date(lote.creado_en).toLocaleString()}</div>

      <div className="space-y-1.5 mb-4">
        {ingredientes.map((ing, i) => (
          <div key={i} className="flex items-center justify-between text-sm bg-slate-50 dark:bg-black rounded-lg px-3 py-2">
            <span className="text-slate-700 dark:text-white truncate">
              {ing.nombre} — {ing.cantidad} {ing.unidad}
              {ing.tipo === "nuevo" && <span className="text-[10px] text-amber-600 dark:text-amber-400 ml-1.5">(nuevo)</span>}
            </span>
          </div>
        ))}
        {ingredientes.length === 0 && <p className="text-sm text-slate-400 py-1">Todavía no agregaste ingredientes.</p>}
      </div>

      <div className="flex gap-2 mb-3">
        <button onClick={() => setModo("inventario")} className={`flex-1 text-xs font-semibold py-2 rounded-lg ${modo === "inventario" ? "bg-[#16233D] text-white" : "border border-slate-200 dark:border-white/10 text-slate-600 dark:text-white/70"}`}>Del inventario</button>
        <button onClick={() => setModo("nuevo")} className={`flex-1 text-xs font-semibold py-2 rounded-lg ${modo === "nuevo" ? "bg-[#16233D] text-white" : "border border-slate-200 dark:border-white/10 text-slate-600 dark:text-white/70"}`}>Ingrediente nuevo</button>
      </div>

      {modo === "inventario" ? (
        <div className="mb-3">
          <div className="relative mb-2">
            <input
              value={busquedaIng}
              onChange={(e) => { setBusquedaIng(e.target.value); setIngredienteInv(null); setListaAbierta(true); }}
              onFocus={() => setListaAbierta(true)}
              placeholder="Buscar producto del inventario..."
              className="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm text-slate-700 dark:text-white outline-none focus:border-[#E3A73B]" />
            {listaAbierta && (
              <>
                <div className="fixed inset-0 z-40" onClick={() => setListaAbierta(false)} />
                <div className="absolute left-0 right-0 top-full mt-1 z-50 bg-white dark:bg-black border border-slate-200 dark:border-white/10 rounded-lg shadow-lg max-h-48 overflow-y-auto">
                  {productosFiltrados.length === 0 ? (
                    <p className="text-xs text-slate-400 px-3 py-2.5">Sin resultados.</p>
                  ) : productosFiltrados.map(p => (
                    <button key={p.id} onClick={() => elegirIngredienteInv(p)}
                      className="w-full text-left px-3 py-2.5 text-sm text-slate-700 dark:text-white hover:bg-slate-50 dark:hover:bg-white/5 flex items-center justify-between gap-2">
                      <span className="truncate">{p.nombre}</span>
                      <span className="text-xs text-slate-400 shrink-0">stock: {p.cantidad}</span>
                    </button>
                  ))}
                </div>
              </>
            )}
          </div>
          <div className="flex gap-2">
            <input type="number" value={cantidadIng} onChange={(e) => setCantidadIng(e.target.value)} placeholder="Cantidad usada"
              className="flex-1 px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm text-slate-700 dark:text-white outline-none focus:border-[#E3A73B]" />
            <button disabled={guardandoIng} onClick={agregarDelInventario} className="px-4 rounded-lg bg-[#16233D] text-white text-sm font-semibold disabled:opacity-50">+ Agregar</button>
          </div>
        </div>
      ) : (
        <div className="grid grid-cols-2 gap-2 mb-3">
          <input value={nombreNuevoIng} onChange={(e) => setNombreNuevoIng(e.target.value)} placeholder="Nombre del ingrediente"
            className="col-span-2 px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm text-slate-700 dark:text-white outline-none focus:border-[#E3A73B]" />
          <input type="number" value={cantidadNuevoIng} onChange={(e) => setCantidadNuevoIng(e.target.value)} placeholder="Cantidad"
            className="px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm text-slate-700 dark:text-white outline-none focus:border-[#E3A73B]" />
          <select value={unidadNuevoIng} onChange={(e) => setUnidadNuevoIng(e.target.value)}
            className="px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm text-slate-700 dark:text-white outline-none focus:border-[#E3A73B]">
            {["unidad", "g", "kg", "ml", "l", "lb", "oz"].map(u => <option key={u} value={u}>{u}</option>)}
          </select>
          <button disabled={guardandoIng} onClick={agregarNuevo} className="col-span-2 px-4 py-2 rounded-lg bg-[#16233D] text-white text-sm font-semibold disabled:opacity-50">+ Agregar ingrediente nuevo</button>
        </div>
      )}

      {mostrarFinalizar ? (
        <div className="border-t border-slate-100 dark:border-white/10 pt-3 mt-3">
          <label className="block text-xs font-semibold text-slate-500 dark:text-white uppercase mb-1">Unidades producidas (opcional)</label>
          <div className="flex gap-2">
            <input type="number" value={unidadesFinal} onChange={(e) => setUnidadesFinal(e.target.value)} placeholder="Si ya lo sabés"
              className="flex-1 px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm text-slate-700 dark:text-white outline-none focus:border-[#E3A73B]" />
            <button disabled={finalizando} onClick={finalizar} className="px-4 rounded-lg bg-[#E3A73B] text-[#16233D] text-sm font-semibold disabled:opacity-50 flex items-center gap-2">
              {finalizando && <IconLoading />} Confirmar
            </button>
          </div>
        </div>
      ) : (
        <button onClick={() => setMostrarFinalizar(true)} className="w-full mt-1 border border-emerald-500 text-emerald-600 dark:text-emerald-400 font-semibold text-sm px-4 py-2.5 rounded-lg">
          ✅ Finalizar lote
        </button>
      )}
    </div>
  );
}

function PaginaProduccion({ productos, lotes, cargando, error, onIniciar, onAgregarIngrediente, onFinalizar, onEliminar }) {
  const [nombreNuevoLote, setNombreNuevoLote] = useState("");
  const [iniciando, setIniciando] = useState(false);

  const iniciarLote = async () => {
    if (!nombreNuevoLote.trim()) { mostrarError("Escribí qué producto vas a preparar."); return; }
    setIniciando(true);
    try {
      await onIniciar(nombreNuevoLote.trim());
      setNombreNuevoLote("");
    } catch (e) { mostrarError(e.message); }
    finally { setIniciando(false); }
  };

  const eliminarLote = async (l) => {
    if (!(await confirmarAccion(`¿Eliminar el lote de ${l.producto_nombre}?`))) return;
    try { await onEliminar(l.id); } catch (e) { mostrarError(e.message); }
  };

  const enProceso = lotes.filter(l => l.estado === "en_proceso");
  const finalizados = lotes.filter(l => l.estado !== "en_proceso");

  return (
    <div className="space-y-5">
      <div>
        <h1 className="text-xl font-bold text-slate-800 dark:text-white font-display">🏭 Producción por lotes</h1>
        <p className="text-sm text-slate-500 dark:text-white/60 mt-1">Iniciá un lote sin saber cuánto vas a producir, y agregá los ingredientes conforme los vas usando.</p>
      </div>

      {error && <div className="bg-rose-50 dark:bg-rose-900/10 border border-rose-200 dark:border-rose-900/30 text-rose-600 dark:text-rose-400 text-sm rounded-lg p-3">{error}</div>}

      <div className="bg-white dark:bg-neutral-900 border border-slate-200 dark:border-white/10 rounded-2xl p-5">
        <h2 className="font-semibold text-slate-800 dark:text-white text-sm mb-3">Iniciar nuevo lote</h2>
        <div className="flex gap-2">
          <input value={nombreNuevoLote} onChange={(e) => setNombreNuevoLote(e.target.value)} placeholder="Ej. Tacos, Repochetas, Batidos..." list="productos-existentes-lote"
            className="flex-1 px-3 py-2.5 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm text-slate-700 dark:text-white outline-none focus:border-[#E3A73B]" />
          <datalist id="productos-existentes-lote">
            {productos.map(p => <option key={p.id} value={p.nombre} />)}
          </datalist>
          <button disabled={iniciando} onClick={iniciarLote} className="px-4 rounded-lg bg-[#E3A73B] text-[#16233D] text-sm font-semibold disabled:opacity-50 flex items-center gap-2">
            {iniciando && <IconLoading />} Iniciar lote
          </button>
        </div>
      </div>

      {enProceso.length > 0 && (
        <div className="space-y-4">
          <h2 className="text-sm font-semibold text-slate-500 dark:text-white/60 uppercase tracking-wide">Lotes en proceso</h2>
          {enProceso.map(l => (
            <TarjetaLoteActivo key={l.id} lote={l} productos={productos} onAgregarIngrediente={onAgregarIngrediente} onFinalizar={onFinalizar} onEliminar={eliminarLote} />
          ))}
        </div>
      )}

      <div className="bg-white dark:bg-neutral-900 border border-slate-200 dark:border-white/10 rounded-2xl p-5">
        <h2 className="font-semibold text-slate-800 dark:text-white text-sm mb-3">Lotes finalizados</h2>
        {cargando ? (
          <p className="text-sm text-slate-400 py-4 text-center">Cargando...</p>
        ) : finalizados.length === 0 ? (
          <p className="text-sm text-slate-400 py-4 text-center">Todavía no finalizaste ningún lote.</p>
        ) : (
          <div className="space-y-2">
            {finalizados.map(l => (
              <div key={l.id} className="bg-slate-50 dark:bg-black rounded-lg p-3">
                <div className="flex items-center justify-between">
                  <div className="font-medium text-sm text-slate-700 dark:text-white">
                    {l.producto_nombre}{l.unidades_producidas > 0 ? ` — ${l.unidades_producidas} u.` : ""}
                  </div>
                  <div className="flex items-center gap-2">
                    <span className="text-xs text-slate-400 dark:text-white/40">{new Date(l.creado_en).toLocaleString()}</span>
                    <button onClick={() => eliminarLote(l)} className="text-slate-400 hover:text-rose-500 text-sm">🗑️</button>
                  </div>
                </div>
                <div className="text-xs text-slate-500 dark:text-white/60 mt-1">
                  {(l.ingredientes || []).map(ing => `${ing.nombre} (${ing.cantidad} ${ing.unidad})`).join(", ") || "Sin ingredientes registrados."}
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}


function PaginaConsumoHogar({ productos, registros, cargando, error, onRegistrar, onEliminar }) {
  const [productoId, setProductoId] = useState("");
  const [cantidad, setCantidad] = useState("");
  const [nota, setNota] = useState("");
  const [guardando, setGuardando] = useState(false);
  const [eliminandoId, setEliminandoId] = useState(null);

  const producto = productos.find(p => p.id === productoId);
  const cantidadNum = parseFloat(cantidad) || 0;
  const costoUnitario = producto ? Number(producto.costo) : 0;
  const costoTotal = costoUnitario * cantidadNum;

  const registrar = async () => {
    if (!producto || cantidadNum <= 0) { mostrarError("Elegí un producto y una cantidad mayor a 0"); return; }
    if (cantidadNum > producto.cantidad) { mostrarError(`Solo hay ${producto.cantidad} unidades de ${producto.nombre} en stock.`); return; }
    setGuardando(true);
    try {
      await onRegistrar({ producto, cantidad: cantidadNum, nota: nota.trim() });
      setProductoId(""); setCantidad(""); setNota("");
    } catch (e) { mostrarError(e.message); }
    finally { setGuardando(false); }
  };

  const eliminarRegistro = async (registro) => {
    if (!(await confirmarAccion(`¿Eliminar este consumo de ${registro.producto_nombre}? Se devuelve la cantidad al inventario. No se puede deshacer.`))) return;
    setEliminandoId(registro.id);
    try { await onEliminar(registro); }
    catch (e) { mostrarError(e.message); }
    finally { setEliminandoId(null); }
  };

  const hoy = new Date();
  const esHoy = (f) => new Date(f).toDateString() === hoy.toDateString();
  const esEsteMes = (f) => { const d = new Date(f); return d.getFullYear() === hoy.getFullYear() && d.getMonth() === hoy.getMonth(); };
  const esEsteAno = (f) => new Date(f).getFullYear() === hoy.getFullYear();

  const consumoHoy = registros.filter(r => esHoy(r.creado_en)).reduce((a, r) => a + Number(r.costo_total), 0);
  const consumoMes = registros.filter(r => esEsteMes(r.creado_en)).reduce((a, r) => a + Number(r.costo_total), 0);
  const consumoAno = registros.filter(r => esEsteAno(r.creado_en)).reduce((a, r) => a + Number(r.costo_total), 0);

  return (
    <div className="space-y-5">
      <div>
        <h1 className="text-xl font-bold text-slate-800 dark:text-white font-display">🏠 Consumo del hogar</h1>
        <p className="text-sm text-slate-500 dark:text-white/60 mt-1">Productos que la familia consume del negocio, sin afectar ventas, caja ni cuentas por cobrar.</p>
      </div>

      {error && <div className="bg-rose-50 dark:bg-rose-900/10 border border-rose-200 dark:border-rose-900/30 text-rose-600 dark:text-rose-400 text-sm rounded-lg p-3">{error}</div>}

      <div className="grid grid-cols-3 gap-3">
        <StatCard label="Consumo de hoy" value={`${formatMoneda(consumoHoy.toFixed(2))}`} icon={IconHome} accent="bg-[#16233D]" />
        <StatCard label="Consumo del mes" value={`${formatMoneda(consumoMes.toFixed(2))}`} icon={IconWallet} accent="bg-amber-500" />
        <StatCard label="Consumo del año" value={`${formatMoneda(consumoAno.toFixed(2))}`} icon={IconChart} accent="bg-rose-500" />
      </div>

      <div className="bg-white dark:bg-neutral-900 border border-slate-200 dark:border-white/10 rounded-2xl p-5">
        <h2 className="font-semibold text-slate-800 dark:text-white text-sm mb-4">Registrar consumo</h2>
        <div className="grid sm:grid-cols-2 gap-3 mb-3">
          <div>
            <label className="block text-xs font-semibold text-slate-500 dark:text-white uppercase mb-1">Producto</label>
            <select value={productoId} onChange={(e) => setProductoId(e.target.value)}
              className="w-full px-3 py-2.5 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm text-slate-700 dark:text-white outline-none focus:border-[#E3A73B]">
              <option value="">Seleccioná un producto...</option>
              {productos.map(p => <option key={p.id} value={p.id}>{p.nombre} (stock: {p.cantidad})</option>)}
            </select>
          </div>
          <div>
            <label className="block text-xs font-semibold text-slate-500 dark:text-white uppercase mb-1">Cantidad</label>
            <input type="number" value={cantidad} onChange={(e) => setCantidad(e.target.value)} placeholder="0"
              className="w-full px-3 py-2.5 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm text-slate-700 dark:text-white outline-none focus:border-[#E3A73B]" />
          </div>
        </div>
        <label className="block text-xs font-semibold text-slate-500 dark:text-white uppercase mb-1">Nota (opcional)</label>
        <input value={nota} onChange={(e) => setNota(e.target.value)} placeholder="Ej. Desayuno, Almuerzo, Cena, Uso personal..."
          className="w-full px-3 py-2.5 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm text-slate-700 dark:text-white outline-none focus:border-[#E3A73B] mb-3" />

        {producto && cantidadNum > 0 && (
          <div className="bg-slate-50 dark:bg-black rounded-lg p-3 text-xs text-slate-500 dark:text-white mb-3">
            Costo (precio de compra, no de venta): {formatMoneda(costoUnitario.toFixed(2))} x {cantidadNum} = <b className="text-rose-600 dark:text-rose-400">{formatMoneda(costoTotal.toFixed(2))}</b>
          </div>
        )}

        <button disabled={guardando} onClick={registrar} className="w-full bg-[#E3A73B] text-[#16233D] font-semibold text-sm px-4 py-3 rounded-lg disabled:opacity-50 flex items-center justify-center gap-2">
          {guardando && <IconLoading />} Registrar consumo
        </button>
      </div>

      <div className="bg-white dark:bg-neutral-900 border border-slate-200 dark:border-white/10 rounded-2xl p-5">
        <h2 className="font-semibold text-slate-800 dark:text-white text-sm mb-3">Historial</h2>
        {cargando ? (
          <p className="text-sm text-slate-400 py-4 text-center">Cargando...</p>
        ) : registros.length === 0 ? (
          <p className="text-sm text-slate-400 py-4 text-center">Todavía no hay consumos registrados.</p>
        ) : (
          <div className="space-y-2">
            {registros.slice(0, 50).map(r => (
              <div key={r.id} className="flex items-center justify-between bg-slate-50 dark:bg-black rounded-lg p-3">
                <div>
                  <div className="text-sm font-medium text-slate-700 dark:text-white">{r.producto_nombre} x{r.cantidad}</div>
                  <div className="text-xs text-slate-400 dark:text-white/40">{r.nota ? `${r.nota} · ` : ""}{new Date(r.creado_en).toLocaleString()}</div>
                </div>
                <div className="flex items-center gap-3">

function PaginaUsuarios({ nombreNegocio }) {
  const [miembros, setMiembros] = useState([]);

  const [error, setError] = useState(null);
  const [modalAbierto, setModalAbierto] = useState(false);
  const [guardando, setGuardando] = useState(false);

  const cargar = useCallback(async () => {
    try {
      setError(null);
      const { datos, offline } = await obtenerConRespaldo("miembros", () => supaApi.listarMiembros());
      setMiembros(datos);
      if (offline) notificarConexion("sin_conexion");
    } catch (e) {
      setError(e.message || "No se pudieron cargar los usuarios.");
    } finally {
      setCargando(false);
    }
  }, []);

  useEffect(() => { cargar(); }, [cargar]);

  const invitar = async (form) => {
    setGuardando(true);
    try {
      const telefonoDigitos = form.telefono.trim().replace(/\D/g, "");
      const correoFinal = form.correo.trim()
        ? form.correo.trim().toLowerCase()
        : `u${telefonoDigitos}@nova-invitado.app`;
      const creado = await supaApi.crearMiembro({
        nombre: form.nombre.trim(), correo: correoFinal, telefono: form.telefono.trim(),
        rol: form.rol, estado: "invitado", nombre_negocio: nombreNegocio.trim() || "el negocio",
      });
      setModalAbierto(false);
      await cargar();
      const nuevo = creado && creado[0];
      if (nuevo && nuevo.telefono) window.open(enlaceWhatsapp(nuevo), "_blank");
    } catch (e) { mostrarError(e.message); }
    finally { setGuardando(false); }
  };

  const cambiarRol = async (miembro, rol) => {
    try { await supaApi.actualizarMiembro(miembro.id, { rol }); await cargar(); }
    catch (e) { mostrarError(e.message); }
  };

  const quitarAcceso = async (miembro) => {
    if (!(await confirmarAccion(`¿Quitar el acceso de ${miembro.nombre || miembro.correo}?`))) return;
    try { await supaApi.eliminarMiembro(miembro.id); await cargar(); }

    const telefonoLimpio = (m.telefono || "").replace(/\D/g, "");

2️⃣ Tocá "Crear cuenta"

5️⃣ En cuanto entrés, te va a aparecer un mensaje de bienvenida — tocá el botón dorado y listo, ya vas a estar adentro

(Copiá y pegá el correo y la contraseña tal como están aquí arriba)`;
    const numero = telefonoLimpio ? (telefonoLimpio.length <= 8 ? `505${telefonoLimpio}` : telefonoLimpio) : "";
    return `https://wa.me/${numero}?text=${encodeURIComponent(mensaje)}`;
  };

  return (
    <div>
      <div className="flex items-center justify-between mb-4 gap-3 flex-wrap">
        <div>

      {error && <div className="bg-rose-50 dark:bg-rose-900/10 border border-rose-200 dark:border-rose-900/30 text-rose-600 dark:text-rose-400 text-sm rounded-lg p-3 mb-4">{error}</div>}
