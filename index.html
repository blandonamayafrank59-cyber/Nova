  const [nombreUsuario, setNombreUsuario] = useState(() => {
    const email = sesion?.user?.email || "";
    return email ? email.split("@")[0] : "";
  });
  const [fotoPerfil, setFotoPerfil] = useState(null);
  const [reglasCredito, setReglasCredito] = useState(REGLAS_CREDITO_DEFAULT);
  const cargaInicialRef = React.useRef(false);

  useEffect(() => {
    (async () => {
      try {
        const [config, perfil] = await Promise.all([supaApi.obtenerConfigNegocio(), supaApi.obtenerMiPerfil()]);
        if (config) { setNombreNegocio(config.nombre || ""); setLogo(config.logo || null); establecerMonedaActual(config.moneda_codigo); setMoneda(monedaActualCache); if (config.reglas_credito) setReglasCredito({ ...REGLAS_CREDITO_DEFAULT, ...config.reglas_credito }); }
        if (perfil) {
          if (perfil.nombre) setNombreUsuario(perfil.nombre);
          setFotoPerfil(perfil.foto || null);
        }
      } catch (e) { /* si falla, se sigue con los valores por defecto */ }
      finally { cargaInicialRef.current = true; }
    })();
  }, []);

  // Nombre del negocio: se guarda en Supabase (compartido entre todos los dispositivos), con una pequeña espera para no mandar una petición por cada letra
  useEffect(() => {
    if (!cargaInicialRef.current) return;
    const espera = setTimeout(() => {
      supaApi.guardarConfigNegocio({ nombre: nombreNegocio }).catch(() => {});
    }, 800);
    return () => clearTimeout(espera);
  }, [nombreNegocio]);

  // Moneda del negocio: a diferencia del nombre/logo, un cambio de moneda
  // se guarda al toque (sin debounce) y recarga la página, porque el
  // símbolo/formato se usa en decenas de pantallas que no reciben esta
  // variable por props — recargar es la forma simple y segura de que todas
  // queden consistentes de inmediato, igual que ya hace el código en otros
  // cambios de estado global (ver window.location.reload() más abajo).
  const [cambiandoMoneda, setCambiandoMoneda] = useState(false);
  const cambiarMoneda = async (codigo) => {
    if (!CATALOGO_MONEDAS[codigo] || codigo === moneda) return;
    setCambiandoMoneda(true);
    try {
      await supaApi.guardarConfigNegocio({ moneda_codigo: codigo });
      window.location.reload();
    } catch (err) {
      setCambiandoMoneda(false);
      mostrarError(err.message || "No se pudo cambiar la moneda");
    }
  };

  const logoInputRef = React.useRef(null);
  const handleLogoChange = async (e) => {
    const archivo = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!archivo) return;
    try {
      const dataUrl = await comprimirImagen(archivo, 500, 0.75);
      setLogo(dataUrl);
      await supaApi.guardarConfigNegocio({ logo: dataUrl });
    } catch (err) { mostrarError(err.message); }
  };
  const quitarLogo = () => {
    setLogo(null);
    supaApi.guardarConfigNegocio({ logo: null }).catch(() => {});
  };

  // Nombre de tu perfil: se guarda en tu cuenta (te sigue a cualquier dispositivo donde inicies sesión)
  useEffect(() => {
    if (!cargaInicialRef.current) return;
    const espera = setTimeout(() => {
      supaApi.guardarMiPerfil({ nombre: nombreUsuario }).catch(() => {});
    }, 800);
    return () => clearTimeout(espera);
  }, [nombreUsuario]);

  const fotoInputRef = React.useRef(null);
  const handleFotoPerfilChange = async (e) => {
    const archivo = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!archivo) return;
    try {
      const dataUrl = await comprimirImagen(archivo, 500, 0.75);
      setFotoPerfil(dataUrl);
      await supaApi.guardarMiPerfil({ foto: dataUrl });
    } catch (err) { mostrarError(err.message); }
  };
  const quitarFotoPerfil = () => {
    setFotoPerfil(null);
    supaApi.guardarMiPerfil({ foto: null }).catch(() => {});
  };
  const [productos, setProductos] = useState([]);
  const [cargando, setCargando] = useState(true);
  const [error, setError] = useState(null);

  const cargarProductos = useCallback(async () => {
    try {
      const datos = await supaApi.listarProductos();
      setProductos(datos);
      setError(null);
      await cacheGuardar("productos", datos);
      if (estadoConexionGlobal === "sin_conexion") verificarConexion();
    } catch (e) {
      const enCache = await cacheLeer("productos");
      if (enCache) {
        setProductos(enCache);
        setError(null);
        notificarConexion("sin_conexion");
      } else {
        setError("No se pudo conectar con la base de datos. Revisá tu conexión a internet.");
      }
    } finally {
      setCargando(false);
    }
  }, []);

  useEffect(() => {
    cargarProductos();
    const intervalo = setInterval(() => {
      if (estadoConexionGlobal === "sin_conexion") return; // no pisar cambios locales mientras estamos offline
      cargarProductos();
    }, 6000);
    return () => clearInterval(intervalo);
  }, [cargarProductos]);

  const handleCrear = async (datos) => {
    const resultado = await conAlternativaOffline(
      () => supaApi.crearProducto(datos),
      "crear_producto", datos,
      async () => {
        const actuales = (await cacheLeer("productos")) || productos;
        const provisional = { ...datos, id: `local_${Date.now()}`, vendidos: 0, ganancia_acumulada: 0, creado_en: new Date().toISOString(), _local: true };
        const actualizados = [...actuales, provisional];
        await cacheGuardar("productos", actualizados);
        setProductos(actualizados);
      }
    );
    if (resultado !== null) await cargarProductos();
  };

  const handleActualizar = async (id, cambios) => {
    const resultado = await conAlternativaOffline(
      () => supaApi.actualizarProducto(id, cambios),
      "actualizar_producto", { id, cambios },
      async () => {
        const actuales = (await cacheLeer("productos")) || productos;
        const actualizados = actuales.map(p => p.id === id ? { ...p, ...cambios } : p);
        await cacheGuardar("productos", actualizados);
        setProductos(actualizados);
      }
    );
    if (resultado !== null) await cargarProductos();
  };

  const handleEliminar = async (id) => {
    const resultado = await conAlternativaOffline(
      () => supaApi.eliminarProducto(id),
      "eliminar_producto", { id },
      async () => {
        const actuales = (await cacheLeer("productos")) || productos;
        const actualizados = actuales.filter(p => p.id !== id);
        await cacheGuardar("productos", actualizados);
        setProductos(actualizados);
      }
    );
    if (resultado !== null) await cargarProductos();
  };

  const handleRegistrarVenta = async (venta) => {
    const resultado = await conAlternativaOffline(
      () => supaApi.registrarVenta(venta),
      "registrar_venta", venta,
      null // el producto ya se actualizó localmente vía handleActualizar; solo falta encolar la venta
    );
    // El ingreso en caja correspondiente a la venta se registra siempre,
    // esté o no la venta online — si no hay conexión, se encola igual que
    // la venta (antes se perdía en silencio si fallaba estando offline).
    try {
      const { datos: sesionAbierta } = await obtenerConRespaldo("caja_sesion", () => supaApi.obtenerSesionAbierta());
      if (sesionAbierta) {
        const monto = Number(venta.cantidad) * Number(venta.precio_venta);
        const movimiento = {
          sesion_id: sesionAbierta.id,
          tipo: "ingreso",
          descripcion: `${MARCA_VENTA}Venta: ${venta.producto_nombre || "producto"}${venta.cantidad > 1 ? ` x${venta.cantidad}` : ""}`,
          monto,
        };
        await conAlternativaOffline(
          () => supaApi.crearMovimiento(movimiento),
          "crear_movimiento", movimiento,
          async () => {
            const actuales = (await cacheLeer("caja_movimientos_abiertos")) || [];
            const provisional = { ...movimiento, id: idLocal(), creado_en: new Date().toISOString(), _local: true };
            await cacheGuardar("caja_movimientos_abiertos", [provisional, ...actuales]);
          }
        );
      }
    } catch (e) { /* la venta ya quedó guardada; si falla el registro en caja no bloqueamos al usuario */ }
    return resultado;
  };

  const [clientes, setClientes] = useState([]);
  const [pagosFiado, setPagosFiado] = useState([]);
  const [cargandoCuentas, setCargandoCuentas] = useState(true);
  const [errorCuentas, setErrorCuentas] = useState(null);

  const cargarCuentasPorCobrar = useCallback(async () => {
    try {
      setErrorCuentas(null);
      const [{ datos: clientesData, offline: off1 }, { datos: pagosData, offline: off2 }] = await Promise.all([

    } finally {

  useEffect(() => {

    const intervalo = setInterval(() => {
      if (estadoConexionGlobal === "sin_conexion") return;
      cargarCuentasPorCobrar();
    }, 8000);
    return () => clearInterval(intervalo);
  }, [cargarCuentasPorCobrar]);

  const handleCrearCliente = async (datos) => {

    const resultado = await conAlternativaOffline(
      () => supaApi.crearCliente(datos),

        const actuales = (await cacheLeer("clientes")) || clientes;
        const provisional = { ...datos, id: idTemporal, saldo_pendiente: 0, creado_en: new Date().toISOString(), _local: true };
        const actualizados = [...actuales, provisional];

        setClientes(actualizados);

  const handleActualizarCliente = async (id, cambios) => {
    const resultado = await conAlternativaOffline(
      () => supaApi.actualizarCliente(id, cambios),
      "actualizar_cliente", { id, cambios },
      async () => {
        const actuales = (await cacheLeer("clientes")) || clientes;
        const actualizados = actuales.map(c => c.id === id ? { ...c, ...cambios } : c);
        await cacheGuardar("clientes", actualizados);
        setClientes(actualizados);

    );
    if (resultado !== null) await cargarCuentasPorCobrar();

  // Reglas de crédito (plazo, aviso previo, % comisión, si el crédito nuevo depende de lo abonado).
  // Configurables: nunca quedan fijas en el código, y se guardan en negocio_config.
  const handleActualizarReglasCredito = async (nuevasReglas) => {
    const combinadas = { ...reglasCredito, ...nuevasReglas };
    setReglasCredito(combinadas);
    await conAlternativaOffline(
      () => supaApi.guardarConfigNegocio({ reglas_credito: combinadas }),

    );
  };

  // Comisión por atraso: siempre manual, cliente por cliente. Nunca se aplica sola.
  const handleAplicarComision = async (cliente, porcentaje) => {
    const saldoAntes = Number(cliente.saldo_pendiente) || 0;
    const monto = Math.round((saldoAntes * (Number(porcentaje) || 0)) / 100 * 100) / 100;
    const saldoDespues = saldoAntes + monto;
    const resultado = await conAlternativaOffline(
      () => supaApi.actualizarCliente(cliente.id, { saldo_pendiente: saldoDespues }),
      "actualizar_cliente", { id: cliente.id, cambios: { saldo_pendiente: saldoDespues } },

    await conAlternativaOffline(

      "crear_comision", { cliente_id: cliente.id, porcentaje, monto, saldo_antes: saldoAntes, saldo_despues: saldoDespues },
      async () => {}
    );
    await conAlternativaOffline(
      () => supaApi.crearHistorialCredito({ cliente_id: cliente.id, tipo: "comision", detalle: `Comisión ${porcentaje}% aplicada por atraso`, saldo_en_momento: saldoDespues }),
      "crear_historial", { cliente_id: cliente.id, tipo: "comision", detalle: `Comisión ${porcentaje}% aplicada por atraso`, saldo_en_momento: saldoDespues },
      async () => {}
    );
    if (resultado !== null) await cargarCuentasPorCobrar();
  };

  // Registrar en el historial un aviso preparado (y, si corresponde, un cambio de estado manual como bloquear/desbloquear).
  const handleRegistrarHistorialCredito = async (clienteId, tipo, detalle, saldoEnMomento) => {
    await conAlternativaOffline(
      () => supaApi.crearHistorialCredito({ cliente_id: clienteId, tipo, detalle, saldo_en_momento: saldoEnMomento }),
      "crear_historial", { cliente_id: clienteId, tipo, detalle, saldo_en_momento: saldoEnMomento },
      async () => {}
    );
  };

  const [faltantes, setFaltantes] = useState([]);
  const [proveedores, setProveedores] = useState([]);
  const [cargandoFaltantes, setCargandoFaltantes] = useState(true);
  const [errorFaltantes, setErrorFaltantes] = useState(null);

  const cargarFaltantes = useCallback(async () => {
    try {
      setErrorFaltantes(null);
      const [{ datos: faltantesData, offline: off1 }, { datos: proveedoresData, offline: off2 }] = await Promise.all([
        obtenerConRespaldo("faltantes", () => supaApi.listarFaltantes()),
        obtenerConRespaldo("proveedores", () => supaApi.listarProveedores()),
      ]);
      setFaltantes(faltantesData);
      setProveedores(proveedoresData);
      if (off1 || off2) notificarConexion("sin_conexion");
    } catch (e) {
      setErrorFaltantes("No se pudo conectar con la base de datos. Revisá tu conexión a internet.");
    } finally {
      setCargandoFaltantes(false);
    }
  }, []);

  useEffect(() => {
    cargarFaltantes();
    const intervalo = setInterval(() => {
      if (estadoConexionGlobal === "sin_conexion") return;
      cargarFaltantes();
    }, 8000);
    return () => clearInterval(intervalo);
  }, [cargarFaltantes]);

  const handleCrearFaltante = async (datos) => { await supaApi.crearFaltante(datos); await cargarFaltantes(); };
  const handleMarcarFaltante = async (faltante, comprado) => { await supaApi.actualizarFaltante(faltante.id, { comprado, comprado_en: comprado ? new Date().toISOString() : null }); await cargarFaltantes(); };
  const handleEliminarFaltante = async (faltante) => { await supaApi.eliminarFaltante(faltante.id); await cargarFaltantes(); };
  const handleCrearProveedor = async (datos) => { await supaApi.crearProveedor(datos); await cargarFaltantes(); };
  const handleActualizarProveedor = async (id, cambios) => { await supaApi.actualizarProveedor(id, cambios); await cargarFaltantes(); };
  const handleEliminarProveedor = async (proveedor) => { await supaApi.eliminarProveedor(proveedor.id); await cargarFaltantes(); };

  const [notas, setNotas] = useState([]);
  const [cargandoNotas, setCargandoNotas] = useState(true);
  const [errorNotas, setErrorNotas] = useState(null);

  const cargarNotas = useCallback(async () => {
    try {
      setErrorNotas(null);
      const { datos, offline } = await obtenerConRespaldo("notas", () => supaApi.listarNotas());
      setNotas(datos);
      if (offline) notificarConexion("sin_conexion");
    } catch (e) {
      setErrorNotas("No se pudo conectar con la base de datos. Revisá tu conexión a internet.");
    } finally {
      setCargandoNotas(false);
    }
  }, []);

  useEffect(() => {
    cargarNotas();
    const intervalo = setInterval(() => {
      if (estadoConexionGlobal === "sin_conexion") return;
      cargarNotas();
    }, 8000);
    return () => clearInterval(intervalo);
  }, [cargarNotas]);

  const handleCrearNota = async (datos) => {
    const idTemporal = idLocal();
    const resultado = await conAlternativaOffline(
      () => supaApi.crearNota(datos),
      "crear_nota", datos,
      async () => {
        const actuales = (await cacheLeer("notas")) || notas;
        const provisional = { ...datos, id: idTemporal, creado_en: new Date().toISOString(), _local: true };
        const actualizados = [provisional, ...actuales];
        await cacheGuardar("notas", actualizados);
        setNotas(actualizados);
      }
    );
    if (resultado !== null) await cargarNotas();
  };
  const handleActualizarNota = async (id, cambios) => {
    const resultado = await conAlternativaOffline(
      () => supaApi.actualizarNota(id, cambios),
      "actualizar_nota", { id, cambios },
      async () => {
        const actuales = (await cacheLeer("notas")) || notas;
        const actualizados = actuales.map(n => n.id === id ? { ...n, ...cambios } : n);
        await cacheGuardar("notas", actualizados);
        setNotas(actualizados);
      }
    );
    if (resultado !== null) await cargarNotas();
  };
  const handleEliminarNota = async (nota) => {
    const resultado = await conAlternativaOffline(
      () => supaApi.eliminarNota(nota.id),
      "eliminar_nota", { id: nota.id },
      async () => {
        const actuales = (await cacheLeer("notas")) || notas;
        const actualizados = actuales.filter(n => n.id !== nota.id);
        await cacheGuardar("notas", actualizados);
        setNotas(actualizados);
      }
    );
    if (resultado !== null) await cargarNotas();
  };

  const [equipos, setEquipos] = useState([]);
  const [asignacionesEquipos, setAsignacionesEquipos] = useState([]);
  const [cargandoEquipos, setCargandoEquipos] = useState(true);
  const [errorEquipos, setErrorEquipos] = useState(null);

  const cargarEquipos = useCallback(async () => {
    try {
      setErrorEquipos(null);
      const [{ datos: equiposData, offline: off1 }, { datos: asignacionesData, offline: off2 }] = await Promise.all([
        obtenerConRespaldo("equipos", () => supaApi.listarEquipos()),
        obtenerConRespaldo("producto_equipos", () => supaApi.listarAsignacionesEquipos()),
      ]);
      setEquipos(equiposData);
      setAsignacionesEquipos(asignacionesData);
      if (off1 || off2) notificarConexion("sin_conexion");
    } catch (e) {
      setErrorEquipos("No se pudo conectar con la base de datos. Revisá tu conexión a internet.");
    } finally {
      setCargandoEquipos(false);
    }
  }, []);

  useEffect(() => {
    cargarEquipos();
    const intervalo = setInterval(() => {
      if (estadoConexionGlobal === "sin_conexion") return;
      cargarEquipos();
    }, 8000);
    return () => clearInterval(intervalo);
  }, [cargarEquipos]);

  const handleCrearEquipo = async (datos) => { await supaApi.crearEquipo(datos); await cargarEquipos(); };
  const handleEliminarEquipo = async (equipo) => { await supaApi.eliminarEquipo(equipo.id); await cargarEquipos(); };
  const handleAsignarEquipo = async (productoId, equipoId, cantidad) => { await supaApi.asignarProductoAEquipo(productoId, equipoId, cantidad); await cargarEquipos(); };
  const handleQuitarEquipo = async (productoId, equipoId) => { await supaApi.quitarProductoDeEquipo(productoId, equipoId); await cargarEquipos(); };
  const handleActualizarCantidadEquipo = async (productoId, equipoId, cantidad) => { await supaApi.actualizarCantidadEnEquipo(productoId, equipoId, cantidad); await cargarEquipos(); };

  const handleCrearFiado = async ({ cliente_id, productos: items, total }) => {
    for (const item of items) {
      const producto = productos.find(p => p.id === item.producto_id);
      if (producto) {
        const nuevaCantidad = Math.max(0, Number(producto.cantidad) - item.cantidad);
        await handleActualizar(producto.id, { cantidad: nuevaCantidad });
      }
    }
    const cliente = clientes.find(c => c.id === cliente_id);
    const nuevoSaldo = (Number(cliente?.saldo_pendiente) || 0) + total;
    const resultado = await conAlternativaOffline(
      () => supaApi.crearFiadoYActualizarSaldo(cliente_id, items, total, nuevoSaldo),
      "crear_fiado_completo", { cliente_id, productos: items, total, nuevoSaldo },
      async () => {
        const actuales = (await cacheLeer("clientes")) || clientes;
        const actualizados = actuales.map(c => c.id === cliente_id ? { ...c, saldo_pendiente: nuevoSaldo } : c);
        await cacheGuardar("clientes", actualizados);
        setClientes(actualizados);
      }
    );
    if (resultado !== null) notificarCliente(cliente_id, "fiado");
    await Promise.all([cargarProductos(), cargarCuentasPorCobrar()]);
  };

  const handleRegistrarPago = async (cliente, monto) => {
    const nuevoSaldo = Math.max(0, (Number(cliente.saldo_pendiente) || 0) - monto);
    const { datos: sesionAbierta } = await obtenerConRespaldo("caja_sesion", () => supaApi.obtenerSesionAbierta());
    const descripcionMovimiento = `Abono de fiado — ${cliente.nombre}`;
    const resultado = await conAlternativaOffline(
      () => supaApi.crearPagoYActualizarSaldo(cliente.id, monto, nuevoSaldo, sesionAbierta?.id || null, descripcionMovimiento),
      "crear_pago_completo", { cliente_id: cliente.id, monto, nuevoSaldo, sesion_id: sesionAbierta?.id || null, descripcionMovimiento },
      async () => {
        const actuales = (await cacheLeer("clientes")) || clientes;
        const actualizados = actuales.map(c => c.id === cliente.id ? { ...c, saldo_pendiente: nuevoSaldo } : c);
        await cacheGuardar("clientes", actualizados);
        setClientes(actualizados);
      }
    );
    if (!sesionAbierta) mostrarAviso("El pago se registró, pero no hay una caja abierta ahora mismo — abrí la caja para que este ingreso se sume ahí.");
    if (resultado !== null) notificarCliente(cliente.id, "abono");
    await cargarCuentasPorCobrar();
  };

  const handleEliminarCliente = async (cliente) => {
    const fiadosCliente = await supaApi.listarFiadosCliente(cliente.id);
    const cantidadesLocales = {};
    for (const fiado of fiadosCliente) {
      for (const item of (fiado.productos || [])) {
        const producto = productos.find(p => p.id === item.producto_id);
        if (producto) {
          if (!(producto.id in cantidadesLocales)) cantidadesLocales[producto.id] = producto.cantidad;
          cantidadesLocales[producto.id] += item.cantidad;
          await supaApi.actualizarProducto(producto.id, { cantidad: cantidadesLocales[producto.id] });
        }
      }
    }
    await supaApi.eliminarCliente(cliente.id);
    await Promise.all([cargarProductos(), cargarCuentasPorCobrar()]);
  };

  const handleEliminarFiado = async (fiado) => {
    const cantidadesLocales = {};
    for (const item of (fiado.productos || [])) {
      if (item.tipo === "externo" || !item.producto_id) continue;
      const producto = productos.find(p => p.id === item.producto_id);
      if (producto) {
        if (!(producto.id in cantidadesLocales)) cantidadesLocales[producto.id] = producto.cantidad;
        cantidadesLocales[producto.id] += item.cantidad;
        await supaApi.actualizarProducto(producto.id, { cantidad: cantidadesLocales[producto.id] });
      }
    }
    const cliente = clientes.find(c => c.id === fiado.cliente_id);
    if (cliente) {
      const nuevoSaldo = Math.max(0, Number(cliente.saldo_pendiente) - Number(fiado.total));
      await supaApi.actualizarCliente(cliente.id, { saldo_pendiente: nuevoSaldo });
    }
    await supaApi.eliminarFiado(fiado.id);
    await Promise.all([cargarProductos(), cargarCuentasPorCobrar()]);
  };

  const handleEditarFiado = async (fiado, nuevosItems) => {
    const nuevoTotal = nuevosItems.reduce((a, it) => a + (Number(it.cantidad) || 0) * (Number(it.precio_unitario) || 0), 0);

    // Ajustar inventario por la diferencia entre lo que había antes y lo que queda ahora, por producto
    const viejosPorProducto = {};
    (fiado.productos || []).forEach(it => {
      if (it.tipo === "externo" || !it.producto_id) return;
      viejosPorProducto[it.producto_id] = (viejosPorProducto[it.producto_id] || 0) + Number(it.cantidad);
    });
    const nuevosPorProducto = {};
    nuevosItems.forEach(it => {
      if (it.tipo === "externo" || !it.producto_id) return;
      nuevosPorProducto[it.producto_id] = (nuevosPorProducto[it.producto_id] || 0) + Number(it.cantidad);
    });
    const idsProductos = new Set([...Object.keys(viejosPorProducto), ...Object.keys(nuevosPorProducto)]);
    for (const pid of idsProductos) {
      const delta = (viejosPorProducto[pid] || 0) - (nuevosPorProducto[pid] || 0); // positivo = se devuelve stock
      if (delta !== 0) {
        const producto = productos.find(p => p.id === pid);
        if (producto) await supaApi.actualizarProducto(producto.id, { cantidad: Math.max(0, producto.cantidad + delta) });
      }
    }

    const cliente = clientes.find(c => c.id === fiado.cliente_id);
    if (cliente) {
      const deltaTotal = nuevoTotal - Number(fiado.total);
      const nuevoSaldo = Math.max(0, Number(cliente.saldo_pendiente) + deltaTotal);
      await supaApi.actualizarCliente(cliente.id, { saldo_pendiente: nuevoSaldo });
    }

    await supaApi.actualizarFiado(fiado.id, { productos: nuevosItems, total: nuevoTotal });
    await Promise.all([cargarProductos(), cargarCuentasPorCobrar()]);
  };

  const [consumoHogar, setConsumoHogar] = useState([]);
  const [cargandoConsumo, setCargandoConsumo] = useState(true);
  const [errorConsumo, setErrorConsumo] = useState(null);

  const cargarConsumoHogar = useCallback(async () => {
    try {
      setErrorConsumo(null);
      const { datos, offline } = await obtenerConRespaldo("consumo_hogar", () => supaApi.listarConsumoHogar());
      setConsumoHogar(datos);
      if (offline) notificarConexion("sin_conexion");
    } catch (e) {
      setErrorConsumo("No se pudo conectar con la base de datos. Revisá tu conexión a internet.");
    } finally {
      setCargandoConsumo(false);
    }
  }, []);

  useEffect(() => {
    cargarConsumoHogar();
    const intervalo = setInterval(() => {
      if (estadoConexionGlobal === "sin_conexion") return;
      cargarConsumoHogar();
    }, 8000);
    return () => clearInterval(intervalo);
  }, [cargarConsumoHogar]);

  const handleRegistrarConsumo = async ({ producto, cantidad, nota }) => {
    const nuevaCantidad = Math.max(0, producto.cantidad - cantidad);
    await supaApi.actualizarProducto(producto.id, { cantidad: nuevaCantidad });
    const costoUnitario = Number(producto.costo);
    await supaApi.crearConsumoHogar({
      producto_id: producto.id, producto_nombre: producto.nombre, cantidad,
      costo_unitario: costoUnitario, costo_total: costoUnitario * cantidad, nota: nota || null,
    });
    await Promise.all([cargarProductos(), cargarConsumoHogar()]);
  };

  const handleEliminarConsumo = async (registro) => {
    const producto = productos.find(p => p.id === registro.producto_id);
    if (producto) {
      await supaApi.actualizarProducto(producto.id, { cantidad: producto.cantidad + Number(registro.cantidad) });
    }
    await supaApi.eliminarConsumoHogar(registro.id);
    await Promise.all([cargarProductos(), cargarConsumoHogar()]);
  };

  const [lotes, setLotes] = useState([]);
  const [cargandoLotes, setCargandoLotes] = useState(true);
  const [errorLotes, setErrorLotes] = useState(null);

  const cargarLotes = useCallback(async () => {
    try {
      setErrorLotes(null);
      const { datos, offline } = await obtenerConRespaldo("lotes", () => supaApi.listarLotes());
      setLotes(datos);
      if (offline) notificarConexion("sin_conexion");
    } catch (e) {
      setErrorLotes("No se pudieron cargar los lotes. Revisá tu conexión a internet.");
    } finally {
      setCargandoLotes(false);
    }
  }, []);

  useEffect(() => { cargarLotes(); }, [cargarLotes]);

  const handleIniciarLote = async (nombreProducto) => {
    await supaApi.crearLote({ producto_nombre: nombreProducto, unidades_producidas: 0, ingredientes: [], estado: "en_proceso" });
    await cargarLotes();
  };
  const handleAgregarIngredienteLote = async (lote, ingrediente) => {
    const nuevosIngredientes = [...(lote.ingredientes || []), ingrediente];
    await supaApi.actualizarLote(lote.id, { ingredientes: nuevosIngredientes });
    await cargarLotes();
  };
  const handleFinalizarLote = async (lote, unidades) => {
    const cambios = { estado: "finalizado" };
    if (unidades !== null && unidades !== undefined && !isNaN(unidades)) cambios.unidades_producidas = unidades;
    await supaApi.actualizarLote(lote.id, cambios);

    // Al cerrar producción, las unidades producidas entran al inventario para poder venderlas
    if (unidades !== null && unidades !== undefined && !isNaN(unidades) && unidades > 0) {
      const nombreLote = (lote.producto_nombre || "").trim().toLowerCase();
      const productoExistente = productos.find(p => (p.nombre || "").trim().toLowerCase() === nombreLote);
      try {
        if (productoExistente) {
          try {
            await supaApi.crearEntradaInventario({ producto_id: productoExistente.id, cantidad: unidades, tipo: "produccion", fecha: new Date().toISOString().slice(0, 10), nota: "Producción por lotes finalizada" });
          } catch (e) { /* no bloquea si falla el registro de la entrada */ }
          await supaApi.actualizarProducto(productoExistente.id, { cantidad: (productoExistente.cantidad || 0) + unidades });
          mostrarAviso(`Se sumaron ${unidades} unidades de "${lote.producto_nombre}" al inventario.`);
        } else {
          await supaApi.crearProducto({ nombre: lote.producto_nombre, categoria: "", costo: 0, venta: 0, cantidad: unidades, minimo: 0 });
          mostrarAviso(`Se creó "${lote.producto_nombre}" en inventario con ${unidades} unidades. Recordá ponerle su costo y precio de venta.`);
        }
        await cargarProductos();
      } catch (e) { mostrarError("El lote se finalizó, pero no se pudo actualizar el inventario: " + e.message); }
    }

    await cargarLotes();
  };
  const handleEliminarLote = async (id) => { await supaApi.eliminarLote(id); await cargarLotes(); };

  const stockBajo = productos.filter(p => p.cantidad <= p.minimo).length;
  const valorStock = productos.reduce((a, p) => a + p.cantidad * p.costo, 0);
  const gananciaAcumulada = productos.reduce((a, p) => a + (p.ganancia_acumulada || 0), 0);
  const unidadesVendidas = productos.reduce((a, p) => a + (p.vendidos || 0), 0);

  const totalPorCobrar = clientes.reduce((a, c) => a + (Number(c.saldo_pendiente) || 0), 0);
  const clientesPendientes = clientes.filter(c => Number(c.saldo_pendiente) > 0).length;
  const ahoraDash = new Date();
  const recuperadoMes = pagosFiado.filter(p => {
    const f = new Date(p.creado_en);
    return f.getFullYear() === ahoraDash.getFullYear() && f.getMonth() === ahoraDash.getMonth();
  }).reduce((a, p) => a + Number(p.monto), 0);

  const paginas = {
    dashboard: <PaginaDashboard productos={productos} stockBajo={stockBajo} valorStock={valorStock} gananciaAcumulada={gananciaAcumulada} unidadesVendidas={unidadesVendidas} totalPorCobrar={totalPorCobrar} clientesPendientes={clientesPendientes} recuperadoMes={recuperadoMes} verGanancias={permisos.ver_ganancias} onIrA={setPagina} onVerVentas={irAHistorialVentas} />,
    inventario: <PaginaInventario productos={productos} clientes={clientes} cargando={cargando} error={error} onRecargar={cargarProductos} onCrear={handleCrear} onActualizar={handleActualizar} onEliminar={handleEliminar} onVentaRegistrada={handleRegistrarVenta} onCrearFiado={handleCrearFiado} verCostos={permisos.ver_costos} puedeEditar={permisos.editar} />,
    caja: <PaginaCaja productos={productos} />,
    perdidas: <PaginaPerdidas productos={productos} onActualizarProducto={handleActualizar} onRecargarProductos={cargarProductos} />,
    historial: <PaginaHistorial productos={productos} onActualizarProducto={handleActualizar} onRecargarProductos={cargarProductos} filtroInicial={historialFiltroInicial} />,
    estadisticas: <PaginaEstadisticas consumoHogar={consumoHogar} onVerVentas={irAHistorialVentas} />,
    cuentas: <PaginaCuentasPorCobrar clientes={clientes} pagosFiado={pagosFiado} productos={productos} cargando={cargandoCuentas} error={errorCuentas} onRecargar={cargarCuentasPorCobrar} onCrearCliente={handleCrearCliente} onActualizarCliente={handleActualizarCliente} onEliminarCliente={handleEliminarCliente} onCrearFiado={handleCrearFiado} onRegistrarPago={handleRegistrarPago} onEditarFiado={handleEditarFiado} onEliminarFiado={handleEliminarFiado} reglasCredito={reglasCredito} onAplicarComision={handleAplicarComision} onRegistrarHistorial={handleRegistrarHistorialCredito} nombreNegocio={nombreNegocio} />,
    consumo: <PaginaConsumoHogar productos={productos} registros={consumoHogar} cargando={cargandoConsumo} error={errorConsumo} onRegistrar={handleRegistrarConsumo} onEliminar={handleEliminarConsumo} />,
    produccion: <PaginaProduccion productos={productos} lotes={lotes} cargando={cargandoLotes} error={errorLotes} onIniciar={handleIniciarLote} onAgregarIngrediente={handleAgregarIngredienteLote} onFinalizar={handleFinalizarLote} onEliminar={handleEliminarLote} />,
    notas: <PaginaNotas notas={notas} cargando={cargandoNotas} error={errorNotas} onCrear={handleCrearNota} onActualizar={handleActualizarNota} onEliminar={handleEliminarNota} />,
    equipos: <PaginaEquipos equipos={equipos} asignaciones={asignacionesEquipos} productos={productos} cargando={cargandoEquipos} error={errorEquipos} puedeEditar={permisos.editar} onCrearEquipo={handleCrearEquipo} onEliminarEquipo={handleEliminarEquipo} onAsignar={handleAsignarEquipo} onQuitar={handleQuitarEquipo} onActualizarCantidad={handleActualizarCantidadEquipo} />,
    faltantes: <PaginaFaltantes faltantes={faltantes} proveedores={proveedores} cargando={cargandoFaltantes} error={errorFaltantes} puedeEditar={permisos.editar} onCrearFaltante={handleCrearFaltante} onMarcarFaltante={handleMarcarFaltante} onEliminarFaltante={handleEliminarFaltante} onCrearProveedor={handleCrearProveedor} onActualizarProveedor={handleActualizarProveedor} onEliminarProveedor={handleEliminarProveedor} />,
    usuarios: <PaginaUsuarios nombreNegocio={nombreNegocio} />,
    configuracion: <PaginaConfiguracion nombreNegocio={nombreNegocio} setNombreNegocio={setNombreNegocio} logo={logo} onLogoChange={handleLogoChange} onQuitarLogo={quitarLogo} logoInputRef={logoInputRef} moneda={moneda} onMonedaChange={cambiarMoneda} cambiandoMoneda={cambiandoMoneda} />,
  };

  return (
    <div className={modoOscuro ? "dark" : ""}>
      <div className="min-h-screen bg-slate-50 dark:bg-black flex transition-colors">
        {sidebarAbierto && <div className="fixed inset-0 bg-black/40 z-20 lg:hidden" onClick={() => setSidebarAbierto(false)} />}
        <aside className={`fixed lg:static z-30 top-0 left-0 h-full w-64 bg-[#16233D] text-white flex flex-col transition-transform duration-200 ${sidebarAbierto ? "translate-x-0" : "-translate-x-full lg:translate-x-0"}`}>
          <div className="relative p-5 border-b border-white/10">
            <button className="lg:hidden absolute top-4 right-4 text-white/50 hover:text-white" onClick={() => setSidebarAbierto(false)}><IconClose /></button>
            <NovaBrand theme="dark" size="sm" />
            <div className="text-[11px] text-white/40 font-mono mt-2">Panel de administración</div>
            <input ref={logoInputRef} type="file" accept="image/*" onChange={handleLogoChange} className="hidden" />
          </div>
          <nav className="flex-1 p-3 space-y-1 overflow-y-auto">
            {navVisible.map((item) => (
              <React.Fragment key={item.id}>
                {item.id === "configuracion" && <div className="h-px bg-white/10 my-2 mx-1" />}
                <button onClick={() => { setPagina(item.id); setHistorialFiltroInicial("todos"); setSidebarAbierto(false); }}
                  className={`w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-sm font-medium transition-colors ${pagina === item.id ? "bg-[#E3A73B] text-[#16233D]" : "text-white/80 hover:bg-white/10"}`}>
                  <span className="flex items-center gap-2.5"><item.icon /> {item.label}</span>
                  {!item.listo && <span className="text-[9px] uppercase font-bold bg-white/15 px-1.5 py-0.5 rounded">pronto</span>}
                </button>
              </React.Fragment>
            ))}
          </nav>
          <div className="border-t border-white/10 px-4 py-3 flex items-center gap-2.5">
            <button onClick={() => logoInputRef.current && logoInputRef.current.click()} title="Cambiar logo del negocio" className="w-8 h-8 rounded-lg overflow-hidden bg-white/10 ring-1 ring-white/10 flex items-center justify-center text-white text-xs font-bold shrink-0">
              {logo ? <img src={logo} alt="Logo del negocio" className="w-full h-full object-cover" /> : (nombreNegocio.trim().charAt(0).toUpperCase() || "?")}
            </button>
            <input value={nombreNegocio} onChange={(e) => setNombreNegocio(e.target.value)} placeholder="Nombre del negocio"
              className="min-w-0 flex-1 bg-transparent text-sm font-medium text-white outline-none border-b border-dashed border-white/20 focus:border-white/40" />
          </div>
          <div className="px-4 pb-4 text-[11px] text-white/40 font-mono">v1.0 · Con inicio de sesión</div>
        </aside>
        <div className="flex-1 flex flex-col min-w-0">
          <header className="h-16 bg-white dark:bg-black border-b border-slate-200 dark:border-white/10 flex items-center justify-between px-4 lg:px-6 sticky top-0 z-10">
            <div className="flex items-center gap-3">
              <button className="lg:hidden text-slate-500 dark:text-white text-xl" onClick={() => setSidebarAbierto(true)}><IconMenu /></button>
              <div className="hidden sm:flex items-center gap-2 text-sm text-slate-400 dark:text-white">
                <span className="font-medium text-slate-600 dark:text-white">{NAV_ITEMS.find(n => n.id === pagina)?.label}</span>
              </div>
            </div>
            <div className="flex items-center gap-2">
              <IndicadorConexion />
              <button className="w-9 h-9 rounded-lg flex items-center justify-center text-slate-500 dark:text-white hover:bg-slate-100 dark:hover:bg-slate-700/60"><IconBell /></button>
              <PanelPerfil
                sesion={sesion}
                nombreNegocio={nombreNegocio}
                nombreUsuario={nombreUsuario}
                setNombreUsuario={setNombreUsuario}
                fotoPerfil={fotoPerfil}
                onFotoChange={handleFotoPerfilChange}
                onQuitarFoto={quitarFotoPerfil}
                fotoInputRef={fotoInputRef}
                modoOscuro={modoOscuro}
                setModoOscuro={setModoOscuro}
                onIrConfiguracion={() => setPagina("configuracion")}
                onCerrarSesion={onCerrarSesion}
              />
            </div>
          </header>
          <main className="flex-1 p-4 lg:p-6">{paginas[pagina]}</main>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<><App /><ToastContainer /><ModalConfirmacion /></>);
</script>
