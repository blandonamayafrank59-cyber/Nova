  const [montoApertura, setMontoApertura] = useState("");
  const [fechaApertura, setFechaApertura] = useState(() => new Date().toISOString().slice(0, 10));
  const [nuevoTipo, setNuevoTipo] = useState("ingreso");
  const [nuevaDescripcion, setNuevaDescripcion] = useState("");
  const [mostrarSugerencias, setMostrarSugerencias] = useState(false);
  const [nuevoMonto, setNuevoMonto] = useState("");
  const [procesando, setProcesando] = useState(false);
  const [tipoGuardado, setTipoGuardado] = useState("retiro");
  const [montoGuardado, setMontoGuardado] = useState("");
  const [descGuardado, setDescGuardado] = useState("");
  const [procesandoGuardado, setProcesandoGuardado] = useState(false);
  const [ventasHoy, setVentasHoy] = useState([]);
  const [mostrarCierre, setMostrarCierre] = useState(false);
  const [montoFinalContado, setMontoFinalContado] = useState("");
  const [panelAbierto, setPanelAbierto] = useState(null); // null | "monto_inicial" | "ingresos" | "gastos" | "guardado" | "saldo"
  const [montoInicialEditar, setMontoInicialEditar] = useState("");
  const [editandoGuardado, setEditandoGuardado] = useState(false);
  const [nuevoMontoGuardado, setNuevoMontoGuardado] = useState("");
  const [guardandoAjusteGuardado, setGuardandoAjusteGuardado] = useState(false);
  const [guardandoMontoInicial, setGuardandoMontoInicial] = useState(false);
  const [movimientoEditando, setMovimientoEditando] = useState(null);
  const [movimientoEditandoEsGuardado, setMovimientoEditandoEsGuardado] = useState(false);
  const [guardandoEdicion, setGuardandoEdicion] = useState(false);

  const guardarEdicionMovimiento = async (mov, cambios) => {
    setGuardandoEdicion(true);
    try {
      if (movimientoEditandoEsGuardado) await supaApi.actualizarMovimientoGuardado(mov.id, cambios);
      else await supaApi.actualizarMovimiento(mov.id, cambios);
      setMovimientoEditando(null);
      await cargarTodo();
    } catch (e) { mostrarError(e.message); }
    finally { setGuardandoEdicion(false); }
  };

  const guardarMontoInicial = async () => {
    const nuevo = parseFloat(montoInicialEditar);
    if (isNaN(nuevo) || nuevo < 0) { mostrarError("Poné un monto válido."); return; }
    setGuardandoMontoInicial(true);
    try {
      const resultado = await conAlternativaOffline(
        () => supaApi.actualizarSesionCaja(sesion.id, { monto_inicial: nuevo }),
        "actualizar_sesion_caja", { id: sesion.id, cambios: { monto_inicial: nuevo } },
        async () => {
          const actualizada = { ...sesion, monto_inicial: nuevo };
          await cacheGuardar("caja_sesion", actualizada);
          setSesion(actualizada);
        }
      );
      setPanelAbierto(null);
      if (resultado !== null) await cargarTodo();
    } catch (e) { mostrarError(e.message); }
    finally { setGuardandoMontoInicial(false); }
  };

  const cargarTodo = useCallback(async () => {
    try {
      setError(null);
      const { datos: s, offline: off1 } = await obtenerConRespaldo("caja_sesion", () => supaApi.obtenerSesionAbierta());
      const { datos: guardado, offline: off2 } = await obtenerConRespaldo("dinero_guardado", () => supaApi.listarMovimientosGuardado());
      setSesion(s);
      setMovsGuardado(guardado);
      let huboOffline = off1 || off2;
      if (s) {
        const { datos: movs, offline: off3 } = await obtenerConRespaldo("caja_movimientos_abiertos", () => supaApi.listarMovimientos(s.id));
        const { datos: ventasServidor, offline: off4 } = await obtenerConRespaldo("ventas", () => supaApi.listarVentas());
        const ventas = await ventasIncluyendoPendientes(ventasServidor);
        setMovimientos(movs);
        const hoy = new Date();
        setVentasHoy(ventas.filter(v => new Date(v.creado_en).toDateString() === hoy.toDateString()));
        huboOffline = huboOffline || off3 || off4;
      } else {
        setMovimientos([]);
        setVentasHoy([]);
        const { datos: h, offline: off5 } = await obtenerConRespaldo("caja_historial", () => supaApi.listarSesionesCerradas());
        setHistorial(h);
        huboOffline = huboOffline || off5;
      }
      if (huboOffline) notificarConexion("sin_conexion");
    } catch (e) {
      setError("No se pudo conectar con la caja. Revisá tu conexión a internet.");
    } finally {
      setCargando(false);
    }
  }, []);

  useEffect(() => { cargarTodo(); }, [cargarTodo]);

  const totalIngresos = movimientos.filter(m => m.tipo === "ingreso").reduce((a, m) => a + Number(m.monto), 0);
  const totalGastos = movimientos.filter(m => m.tipo === "gasto").reduce((a, m) => a + Number(m.monto), 0);
  const saldoActual = sesion ? Number(sesion.monto_inicial) + totalIngresos - totalGastos : 0;
  const saldoGuardado = movsGuardado.reduce((a, m) => a + (m.tipo === "retiro" ? Number(m.monto) : -Number(m.monto)), 0);

  // Desglose para el resumen de cierre (usa los movimientos reales, sin contar nada dos veces)
  const totalVentasHoy = ventasHoy.reduce((a, v) => a + v.cantidad * v.precio_venta, 0);
  const ingresoDesdeGuardado = movimientos.filter(m => m.tipo === "ingreso" && m.descripcion?.startsWith(MARCA_GUARDADO)).reduce((a, m) => a + Number(m.monto), 0);
  const ingresoDesdeVentas = movimientos.filter(m => m.tipo === "ingreso" && m.descripcion?.startsWith(MARCA_VENTA)).reduce((a, m) => a + Number(m.monto), 0);
  const ingresosOtros = totalIngresos - ingresoDesdeGuardado - ingresoDesdeVentas;
  const retirosHaciaGuardado = movimientos.filter(m => m.tipo === "gasto" && m.descripcion?.startsWith(MARCA_GUARDADO)).reduce((a, m) => a + Number(m.monto), 0);
  const gastosOtros = totalGastos - retirosHaciaGuardado;
  const totalRetiradoDeCaja = totalGastos; // incluye retiros hacia guardado y otros gastos, cada uno contado una sola vez
  const saldoFinalEsperado = Number(sesion?.monto_inicial || 0) + totalVentasHoy + ingresosOtros + ingresoDesdeGuardado - totalRetiradoDeCaja;

  const abrirCaja = async () => {
    const monto = parseFloat(montoApertura) || 0;
    if (monto <= 0) { mostrarError("Poné un monto mayor a 0"); return; }
    if (monto > saldoGuardado) {
      mostrarError(`No hay suficiente dinero guardado para abrir con ${formatMoneda(monto.toFixed(2))}. Guardado actual: ${formatMoneda(saldoGuardado.toFixed(2))}. Editá el dinero guardado primero si hace falta.`);
      return;
    }
    setProcesando(true);
    try {
      const idProvisional = idLocal();
      const descApertura = `Apertura de caja ${fechaApertura}`;
      const resultado = await conAlternativaOffline(
        () => supaApi.abrirCaja(monto, fechaApertura),
        "abrir_caja", { idLocal: idProvisional, montoInicial: monto, fechaApertura },
        async () => {
          const provisional = { id: idProvisional, monto_inicial: monto, estado: "abierta", fecha_apertura: fechaApertura, _local: true };
          await cacheGuardar("caja_sesion", provisional);
          setSesion(provisional);
        }
      );
      await conAlternativaOffline(
        () => supaApi.crearMovimientoGuardado({ tipo: "ingreso", monto, descripcion: descApertura }),
        "crear_movimiento_guardado", { tipo: "ingreso", monto, descripcion: descApertura },
        async () => {
          const provisionalMov = { id: idLocal(), tipo: "ingreso", monto, descripcion: descApertura, creado_en: new Date().toISOString(), _local: true };
          const actuales = (await cacheLeer("dinero_guardado")) || movsGuardado;
          const actualizados = [provisionalMov, ...actuales];
          await cacheGuardar("dinero_guardado", actualizados);
          setMovsGuardado(actualizados);
        }
      );
      setMontoApertura("");
      setFechaApertura(new Date().toISOString().slice(0, 10));
      if (resultado !== null) await cargarTodo();
    } catch (e) { mostrarError(e.message); }
    finally { setProcesando(false); }
  };

  const registrarMovimiento = async () => {
    const monto = parseFloat(nuevoMonto) || 0;
    if (monto <= 0) { mostrarError("Poné un monto mayor a 0"); return; }
    setProcesando(true);
    try {
      const nuevoMovimiento = { sesion_id: sesion.id, tipo: nuevoTipo, descripcion: nuevaDescripcion.trim(), monto };
      const resultado = await conAlternativaOffline(
        () => supaApi.crearMovimiento(nuevoMovimiento),
        "crear_movimiento", nuevoMovimiento,
        async () => {
          const provisional = { ...nuevoMovimiento, id: idLocal(), creado_en: new Date().toISOString(), _local: true };
          const actualizados = [provisional, ...movimientos];
          await cacheGuardar("caja_movimientos_abiertos", actualizados);
          setMovimientos(actualizados);
        }
      );
      setNuevaDescripcion(""); setNuevoMonto("");
      if (resultado !== null) await cargarTodo();
    } catch (e) { mostrarError(e.message); }
    finally { setProcesando(false); }
  };

  const abrirResumenCierre = () => {
    setMontoFinalContado(saldoFinalEsperado.toFixed(2));
    setMostrarCierre(true);
  };

  const confirmarCierre = async () => {
    const montoFinal = parseFloat(montoFinalContado);
    if (isNaN(montoFinal) || montoFinal < 0) { mostrarError("Poné el saldo final contado."); return; }
    setProcesando(true);
    try {
      const resultado = await conAlternativaOffline(
        () => supaApi.cerrarCaja(sesion.id, montoFinal),
        "cerrar_caja", { sesionId: sesion.id, montoFinal },
        async () => {
          const cerrada = { ...sesion, estado: "cerrada", monto_final: montoFinal, fecha_cierre: new Date().toISOString(), _local: true };
          const historialActual = (await cacheLeer("caja_historial")) || historial;
          const historialActualizado = [cerrada, ...historialActual];
          await cacheGuardar("caja_historial", historialActualizado);
          await cacheGuardar("caja_sesion", null);
          setHistorial(historialActualizado);
          setSesion(null);
          setMovimientos([]);
        }
      );
      setMostrarCierre(false);
      if (resultado !== null) await cargarTodo();
    } catch (e) { mostrarError(e.message); }
    finally { setProcesando(false); }
  };

  const eliminarMovimiento = async (m) => {
    if (!(await confirmarAccion("¿Eliminar este movimiento? No se puede deshacer."))) return;
    try { await supaApi.eliminarMovimiento(m.id); await cargarTodo(); }
    catch (e) { mostrarError(e.message); }
  };

  const eliminarSesionHistorial = async (h) => {
    if (!(await confirmarAccion("¿Eliminar esta caja del historial? No se puede deshacer."))) return;
    try { await supaApi.eliminarSesionCaja(h.id); await cargarTodo(); }
    catch (e) { mostrarError(e.message); }
  };

  const moverDineroGuardado = async () => {
    const monto = parseFloat(montoGuardado) || 0;
    if (monto <= 0) { mostrarError("Poné un monto mayor a 0"); return; }
    if (tipoGuardado === "retiro" && monto > saldoActual) { mostrarError(`No hay suficiente dinero en la caja. Saldo actual: ${formatMoneda(saldoActual.toFixed(2))}`); return; }
    if (tipoGuardado === "ingreso" && monto > saldoGuardado) { mostrarError(`No hay suficiente dinero guardado. Guardado actual: ${formatMoneda(saldoGuardado.toFixed(2))}`); return; }
    setProcesandoGuardado(true);
    try {
      const desc = descGuardado.trim() || (tipoGuardado === "retiro" ? "Retiro hacia dinero guardado" : "Ingreso desde dinero guardado");
      const movCaja = { sesion_id: sesion.id, tipo: tipoGuardado === "retiro" ? "gasto" : "ingreso", descripcion: MARCA_GUARDADO + desc, monto };
      const resultado = await conAlternativaOffline(
        () => supaApi.crearMovimiento(movCaja),
        "crear_movimiento", movCaja,
        async () => {
          const provisional = { ...movCaja, id: idLocal(), creado_en: new Date().toISOString(), _local: true };
          const actualizados = [provisional, ...movimientos];
          await cacheGuardar("caja_movimientos_abiertos", actualizados);
          setMovimientos(actualizados);
        }
      );
      await conAlternativaOffline(
        () => supaApi.crearMovimientoGuardado({ tipo: tipoGuardado, monto, descripcion: desc }),
        "crear_movimiento_guardado", { tipo: tipoGuardado, monto, descripcion: desc },
        async () => {
          const provisionalG = { id: idLocal(), tipo: tipoGuardado, monto, descripcion: desc, creado_en: new Date().toISOString(), _local: true };
          const actuales = (await cacheLeer("dinero_guardado")) || movsGuardado;
          const actualizados = [provisionalG, ...actuales];
          await cacheGuardar("dinero_guardado", actualizados);
          setMovsGuardado(actualizados);
        }
      );
      setMontoGuardado(""); setDescGuardado("");
      if (resultado !== null) await cargarTodo();
    } catch (e) { mostrarError(e.message); }
    finally { setProcesandoGuardado(false); }
  };

  const eliminarMovimientoGuardado = async (m) => {
    if (!(await confirmarAccion("¿Eliminar este movimiento de dinero guardado? Esto no afecta el saldo de la caja, solo corrige el registro de guardado."))) return;
    try { await supaApi.eliminarMovimientoGuardado(m.id); await cargarTodo(); }
    catch (e) { mostrarError(e.message); }
  };

  // Ajuste directo del saldo guardado — no depende de que la caja esté abierta,
  // porque es dinero fuera de caja. Registra la diferencia como un movimiento más,
  // así el historial y el saldo quedan siempre correctos.
  const ajustarSaldoGuardado = async (nuevoTotal) => {
    const delta = nuevoTotal - saldoGuardado;
    if (delta === 0) { setEditandoGuardado(false); return; }
    setGuardandoAjusteGuardado(true);
    try {
      const mov = delta > 0
        ? { tipo: "retiro", monto: delta, descripcion: "Ajuste manual de dinero guardado" }
        : { tipo: "ingreso", monto: Math.abs(delta), descripcion: "Ajuste manual de dinero guardado" };
      const resultado = await conAlternativaOffline(
        () => supaApi.crearMovimientoGuardado(mov),
        "crear_movimiento_guardado", mov,
        async () => {
          const provisional = { ...mov, id: idLocal(), creado_en: new Date().toISOString(), _local: true };
          const actuales = (await cacheLeer("dinero_guardado")) || movsGuardado;
          const actualizados = [provisional, ...actuales];
          await cacheGuardar("dinero_guardado", actualizados);
          setMovsGuardado(actualizados);
        }
      );
      setEditandoGuardado(false);
      setNuevoMontoGuardado("");
      if (resultado !== null) await cargarTodo();
    } catch (e) { mostrarError(e.message); }
    finally { setGuardandoAjusteGuardado(false); }
  };

  const ponerEnCeroGuardado = async () => {
    if (saldoGuardado === 0) return;
    if (!(await confirmarAccion(`¿Poner en cero el dinero guardado? Ahora mismo hay ${formatMoneda(saldoGuardado.toFixed(2))}. Se guarda en el historial, no se puede deshacer.`))) return;
    setGuardandoAjusteGuardado(true);
    try {
      const mov = { tipo: "ingreso", monto: saldoGuardado, descripcion: "Guardado puesto en cero" };
      const resultado = await conAlternativaOffline(
        () => supaApi.crearMovimientoGuardado(mov),
        "crear_movimiento_guardado", mov,
        async () => {
          const provisional = { ...mov, id: idLocal(), creado_en: new Date().toISOString(), _local: true };
          const actuales = (await cacheLeer("dinero_guardado")) || movsGuardado;
          const actualizados = [provisional, ...actuales];
          await cacheGuardar("dinero_guardado", actualizados);
          setMovsGuardado(actualizados);
        }
      );
      if (resultado !== null) await cargarTodo();
    } catch (e) { mostrarError(e.message); }
    finally { setGuardandoAjusteGuardado(false); }
  };

  if (cargando) return <div className="flex items-center justify-center py-16 text-slate-400 gap-2 text-sm"><IconLoading /> Cargando caja...</div>;

  return (
    <div className="space-y-5">
      <div>
        <h1 className="text-xl font-bold text-slate-800 dark:text-white font-display">Control de caja</h1>
        <p className="text-sm text-slate-500 dark:text-white mt-1">Registrá entradas y salidas de dinero del día.</p>
      </div>

      {error && <div className="bg-rose-50 dark:bg-rose-900/20 border border-rose-200 dark:border-rose-800 text-rose-700 dark:text-rose-300 text-sm rounded-lg p-3">{error}</div>}

      <div className="max-w-sm">
        <StatCard label="💰 Dinero guardado (fuera de caja)" value={`${formatMoneda(saldoGuardado.toFixed(2))}`} icon={IconWallet} accent="bg-amber-500" onClick={() => setPanelAbierto("guardado")} />
      </div>

      {!sesion ? (
        <div className="bg-white dark:bg-black border border-slate-200 dark:border-white/10 rounded-2xl p-6 max-w-sm">
          <h2 className="font-semibold text-slate-800 dark:text-white mb-3">Abrir caja</h2>
          <label className="block text-xs font-semibold text-slate-500 dark:text-white uppercase mb-1">Monto inicial (efectivo con el que abrís)</label>
          <input type="number" value={montoApertura} onChange={(e) => setMontoApertura(e.target.value)}
            className="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm mb-3 outline-none focus:border-[#E3A73B]" placeholder="0" />
          <button disabled={procesando} onClick={abrirCaja} className="w-full bg-[#E3A73B] text-[#16233D] font-semibold text-sm px-4 py-2 rounded-lg disabled:opacity-50 flex items-center justify-center gap-2">
            {procesando && <IconLoading />} Abrir caja
          </button>

          {historial.length > 0 && (
            <div className="mt-6 pt-4 border-t border-slate-100 dark:border-white/10">
              <h3 className="text-xs font-semibold text-slate-500 dark:text-white uppercase mb-2">Cajas anteriores</h3>
              <div className="space-y-2">
                {historial.map(h => (
                  <div key={h.id} className="flex justify-between items-center text-xs text-slate-500 dark:text-white py-1">
                    <span>{new Date(h.fecha_cierre).toLocaleDateString()}</span>
                    <div className="flex items-center gap-2">
                      <span className="font-mono">{formatMoneda(Number(h.monto_inicial).toFixed(2))} → {formatMoneda(Number(h.monto_final).toFixed(2))}</span>
                      <button onClick={() => eliminarSesionHistorial(h)} className="text-slate-400 hover:text-rose-500">🗑️</button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      ) : (
        <div className="space-y-5">
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
            <StatCard label="Monto inicial" value={`${formatMoneda(Number(sesion.monto_inicial).toFixed(2))}`} icon={IconWallet} accent="bg-[#16233D]" onClick={() => { setMontoInicialEditar(String(sesion.monto_inicial)); setPanelAbierto("monto_inicial"); }} />
            <StatCard label="Ingresos" value={`${formatMoneda(totalIngresos.toFixed(2))}`} icon={IconChart} accent="bg-emerald-600" onClick={() => setPanelAbierto("ingresos")} />
            <StatCard label="Gastos" value={`${formatMoneda(totalGastos.toFixed(2))}`} icon={IconAlert} accent="bg-rose-600" onClick={() => setPanelAbierto("gastos")} />
            <StatCard label="Saldo actual" value={`${formatMoneda(saldoActual.toFixed(2))}`} icon={IconCart} accent="bg-[#2471A3]" onClick={() => setPanelAbierto("saldo")} />
          </div>

          <div className="grid lg:grid-cols-2 gap-4">
            <div className="bg-white dark:bg-black border border-slate-200 dark:border-white/10 rounded-2xl p-5">
              <h2 className="font-semibold text-slate-800 dark:text-white text-sm mb-3">Registrar movimiento</h2>
              <div className="flex gap-2 mb-3">
                <button onClick={() => setNuevoTipo("ingreso")} className={`flex-1 py-2 rounded-lg text-sm font-medium ${nuevoTipo === "ingreso" ? "bg-emerald-600 text-white" : "bg-slate-100 dark:bg-neutral-900 text-slate-600 dark:text-white"}`}>Entrada</button>
                <button onClick={() => setNuevoTipo("gasto")} className={`flex-1 py-2 rounded-lg text-sm font-medium ${nuevoTipo === "gasto" ? "bg-rose-600 text-white" : "bg-slate-100 dark:bg-neutral-900 text-slate-600 dark:text-white"}`}>Salida</button>
              </div>
              <label className="block text-xs font-semibold text-slate-500 dark:text-white uppercase mb-1">Descripción</label>
              <div className="relative mb-3">
                <input
                  value={nuevaDescripcion}
                  onChange={(e) => { setNuevaDescripcion(e.target.value); setMostrarSugerencias(true); }}
                  onFocus={() => setMostrarSugerencias(true)}
                  onBlur={() => setTimeout(() => setMostrarSugerencias(false), 150)}
                  placeholder="Ej: Venta del día, compra de bolsas..."
                  className="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm outline-none focus:border-[#E3A73B]" />
                {mostrarSugerencias && nuevaDescripcion.trim().length > 0 && (() => {
                  const coincidencias = productos.filter(p => p.nombre.toLowerCase().includes(nuevaDescripcion.trim().toLowerCase())).slice(0, 6);
                  if (coincidencias.length === 0) return null;
                  return (
                    <div className="absolute z-10 top-full left-0 right-0 mt-1 bg-white dark:bg-neutral-900 border border-slate-200 dark:border-white/10 rounded-lg shadow-lg overflow-hidden">
                      {coincidencias.map(p => (
                        <button
                          key={p.id}
                          type="button"
                          onMouseDown={() => { setNuevaDescripcion(p.nombre); setMostrarSugerencias(false); }}
                          className="w-full text-left px-3 py-2 text-sm text-slate-700 dark:text-white hover:bg-slate-100 dark:hover:bg-white/10 flex items-center justify-between gap-2"
                        >
                          <span className="truncate">{p.nombre}</span>
                          <span className="text-[11px] text-slate-400 dark:text-white/40 shrink-0">{p.cantidad} en inventario</span>
                        </button>
                      ))}
                    </div>
                  );
                })()}
              </div>
              <label className="block text-xs font-semibold text-slate-500 dark:text-white uppercase mb-1">Monto</label>
              <input type="number" value={nuevoMonto} onChange={(e) => setNuevoMonto(e.target.value)} placeholder="0"
                className="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm mb-3 outline-none focus:border-[#E3A73B]" />
              <button disabled={procesando} onClick={registrarMovimiento} className="w-full bg-[#E3A73B] text-[#16233D] font-semibold text-sm px-4 py-2 rounded-lg disabled:opacity-50 flex items-center justify-center gap-2">
                {procesando && <IconLoading />} Registrar
              </button>
              <button disabled={procesando} onClick={abrirResumenCierre} className="w-full mt-2 border border-rose-300 dark:border-rose-800 text-rose-600 dark:text-rose-400 font-semibold text-sm px-4 py-2 rounded-lg">
                Cerrar caja
              </button>
            </div>

            <div className="bg-white dark:bg-black border border-slate-200 dark:border-white/10 rounded-2xl p-5">
              <h2 className="font-semibold text-slate-800 dark:text-white text-sm mb-3">Movimientos de hoy</h2>
              <div className="space-y-2 max-h-96 overflow-y-auto">
                {movimientos.length === 0 && <p className="text-sm text-slate-400 text-center py-6">Todavía no hay movimientos</p>}
                {movimientos.map(m => (
                  <div key={m.id} className="flex justify-between items-center py-2 px-3 rounded-lg bg-slate-50 dark:bg-neutral-900">
                    <div>
                      <div className="text-sm font-medium text-slate-700 dark:text-white">{descripcionMovimiento(m)}</div>
                      <div className="text-xs text-slate-400 font-mono">{new Date(m.creado_en).toLocaleTimeString()}</div>
                    </div>
                    <div className="flex items-center gap-2">
                      <div className={`font-mono font-semibold text-sm ${m.tipo === "ingreso" ? "text-emerald-600 dark:text-emerald-400" : "text-rose-600 dark:text-rose-400"}`}>
                        {m.tipo === "ingreso" ? "+" : "-"}{formatMoneda(Number(m.monto).toFixed(2))}
                      </div>
                      <button onClick={() => eliminarMovimiento(m)} className="text-slate-400 hover:text-rose-500 text-sm">🗑️</button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>

          <div className="bg-white dark:bg-black border border-amber-300/50 dark:border-amber-500/20 rounded-2xl p-5">
            <h2 className="font-semibold text-slate-800 dark:text-white text-sm mb-1">Mover dinero guardado</h2>
            <p className="text-xs text-slate-400 dark:text-white/40 mb-3">Dinero guardado actual: <b className="text-amber-600 dark:text-amber-400">{formatMoneda(saldoGuardado.toFixed(2))}</b></p>
            <div className="flex gap-2 mb-3">
              <button onClick={() => setTipoGuardado("retiro")} className={`flex-1 py-2 rounded-lg text-sm font-medium ${tipoGuardado === "retiro" ? "bg-amber-500 text-[#16233D]" : "bg-slate-100 dark:bg-neutral-900 text-slate-600 dark:text-white"}`}>📥 Retirar de la caja</button>
              <button onClick={() => setTipoGuardado("ingreso")} className={`flex-1 py-2 rounded-lg text-sm font-medium ${tipoGuardado === "ingreso" ? "bg-amber-500 text-[#16233D]" : "bg-slate-100 dark:bg-neutral-900 text-slate-600 dark:text-white"}`}>📤 Meter a la caja</button>
            </div>
            <p className="text-xs text-slate-400 dark:text-white/40 mb-3">
              {tipoGuardado === "retiro" ? "Sacás efectivo de la caja y lo apartás como guardado." : "Traés efectivo guardado de vuelta a la caja."}
            </p>
            <div className="grid sm:grid-cols-2 gap-2 mb-3">
              <input type="number" value={montoGuardado} onChange={(e) => setMontoGuardado(e.target.value)} placeholder="Monto"

                  <input value={descGuardado} onChange={(e) => setDescGuardado(e.target.value)} placeholder="Descripción (opcional)"

}

function PaginaPerdidas({ productos, onActualizarProducto, onRecargarProductos }) {
  const [perdidas, setPerdidas] = useState([]);
  const [cargando, setCargando] = useState(true);
  const [error, setError] = useState(null);
  const [productoId, setProductoId] = useState("");
  const [cantidad, setCantidad] = useState("");
  const [motivo, setMotivo] = useState("dañado");
  const [procesando, setProcesando] = useState(false);

  const cargar = useCallback(async () => {
    try {
      setError(null);
      const { datos, offline } = await obtenerConRespaldo("perdidas", () => supaApi.listarPerdidas());
      setPerdidas(datos);
      if (offline) notificarConexion("sin_conexion");
    } catch (e) {
      setError("No se pudo conectar. Revisá tu conexión a internet.");
    } finally {
      setCargando(false);
    }
  }, []);

  useEffect(() => { cargar(); }, [cargar]);

  const productoSeleccionado = productos.find(p => p.id === productoId);
  const cantidadNum = parseFloat(cantidad) || 0;
  const valorPerdido = productoSeleccionado ? productoSeleccionado.costo * cantidadNum : 0;

  const registrar = async () => {
    if (!productoSeleccionado) { mostrarError("Elegí un producto"); return; }
    if (cantidadNum <= 0) { mostrarError("Poné una cantidad mayor a 0"); return; }
    setProcesando(true);
    try {
      await supaApi.registrarPerdida({
        producto_id: productoSeleccionado.id,
        producto_nombre: productoSeleccionado.nombre,
        cantidad: cantidadNum,
        motivo,
        valor_perdido: valorPerdido,
      });
      const nuevaCantidad = Math.max(0, productoSeleccionado.cantidad - cantidadNum);
      await onActualizarProducto(productoSeleccionado.id, { cantidad: nuevaCantidad });
      setProductoId(""); setCantidad("");
      await cargar();
      await onRecargarProductos();
    } catch (e) { mostrarError(e.message); }
    finally { setProcesando(false); }
  };

  const totalPerdido = perdidas.reduce((a, p) => a + Number(p.valor_perdido), 0);

  const eliminarPerdida = async (p) => {
    if (!(await confirmarAccion(`¿Eliminar esta pérdida de ${p.producto_nombre}? Se devuelve la cantidad al inventario.`))) return;
    try {
      const producto = productos.find(prod => prod.id === p.producto_id);
      if (producto) await onActualizarProducto(producto.id, { cantidad: producto.cantidad + Number(p.cantidad) });
      await supaApi.eliminarPerdida(p.id);
      await cargar();
      await onRecargarProductos();
    } catch (e) { mostrarError(e.message); }
  };

  return (
    <div className="space-y-5">
      <div>
        <h1 className="text-xl font-bold text-slate-800 dark:text-white font-display">Pérdidas</h1>
        <p className="text-sm text-slate-500 dark:text-white mt-1">Registrá productos dañados, perdidos o vencidos — se descuentan del inventario.</p>
      </div>

      {error && <div className="bg-rose-50 dark:bg-rose-900/20 border border-rose-200 dark:border-rose-800 text-rose-700 dark:text-rose-300 text-sm rounded-lg p-3">{error}</div>}

      <div className="grid lg:grid-cols-3 gap-4">
        <div className="bg-white dark:bg-black border border-slate-200 dark:border-white/10 rounded-2xl p-5">
          <h2 className="font-semibold text-slate-800 dark:text-white text-sm mb-3">Registrar pérdida</h2>
          <label className="block text-xs font-semibold text-slate-500 dark:text-white uppercase mb-1">Producto</label>
          <select value={productoId} onChange={(e) => setProductoId(e.target.value)}
            className="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm mb-3 outline-none focus:border-[#E3A73B]">
            <option value="">Seleccioná un producto</option>
            {productos.map(p => <option key={p.id} value={p.id}>{p.nombre} (stock: {p.cantidad})</option>)}
          </select>
          <label className="block text-xs font-semibold text-slate-500 dark:text-white uppercase mb-1">Cantidad perdida</label>
          <input type="number" value={cantidad} onChange={(e) => setCantidad(e.target.value)} placeholder="0"
            className="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm mb-3 outline-none focus:border-[#E3A73B]" />
          <label className="block text-xs font-semibold text-slate-500 dark:text-white uppercase mb-1">Motivo</label>
          <select value={motivo} onChange={(e) => setMotivo(e.target.value)}
            className="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm mb-3 outline-none focus:border-[#E3A73B]">
            <option value="dañado">Producto dañado</option>
            <option value="perdido">Producto perdido</option>
            <option value="vencido">Producto vencido</option>
          </select>
          {productoSeleccionado && cantidadNum > 0 && (
            <div className="bg-rose-50 dark:bg-rose-900/20 rounded-lg p-3 text-xs text-rose-700 dark:text-rose-300 mb-3">

function BotonVentaRapida({ producto, onVenderUno, onAbrirCantidad }) {
  const timerRef = React.useRef(null);
  const activadoRef = React.useRef(false);

  const iniciar = () => {
    activadoRef.current = false;
    timerRef.current = setTimeout(() => {
      activadoRef.current = true;
      if (navigator.vibrate) navigator.vibrate(15);
      onAbrirCantidad(producto);
    }, 550);
  };
  const cancelar = () => {
    if (timerRef.current) { clearTimeout(timerRef.current); timerRef.current = null; }
  };
  const soltar = (e) => {
    if (e && e.cancelable) e.preventDefault();
    cancelar();
    if (!activadoRef.current) onVenderUno(producto);
  };

  return (
    <button
      onMouseDown={iniciar} onMouseUp={soltar} onMouseLeave={cancelar}
      onTouchStart={iniciar} onTouchEnd={soltar} onTouchCancel={cancelar}
      onContextMenu={(e) => e.preventDefault()}
      className="text-xs px-2.5 py-1.5 rounded bg-[#2471A3] text-white font-semibold select-none">
      -1
    </button>
  );
}

const TIPO_ENTRADA_LABEL = { stock_anterior: "Stock anterior", compra: "Nueva compra", ajuste: "Ajuste", produccion: "Producción por lotes" };

function SeccionEntradasInventario({ producto, onActualizarProducto, onRecargarProductos }) {
  const [entradas, setEntradas] = useState([]);
  const [cargando, setCargando] = useState(true);
  const [cantidadActual, setCantidadActual] = useState(producto.cantidad);
  const [cantidad, setCantidad] = useState("");
  const [tipo, setTipo] = useState("compra");
  const [fecha, setFecha] = useState(() => new Date().toISOString().slice(0, 10));
  const [nota, setNota] = useState("");
  const [guardando, setGuardando] = useState(false);
  const [entradaEditando, setEntradaEditando] = useState(null);

  const cargar = useCallback(async () => {
    try {
      const datos = await supaApi.listarEntradasInventario(producto.id);
      setEntradas(datos);
    } catch (e) { /* silencioso, no bloquea el resto del formulario */ }
    finally { setCargando(false); }
  }, [producto.id]);

  useEffect(() => { setCantidadActual(producto.cantidad); cargar(); }, [producto.id]);

  const agregarEntrada = async () => {
    const numeroIngresado = parseFloat(cantidad);
    if (isNaN(numeroIngresado)) { mostrarError(tipo === "ajuste" ? "Escribí el nuevo stock total." : "Escribí una cantidad distinta de 0."); return; }
    const cant = tipo === "ajuste" ? (numeroIngresado - cantidadActual) : numeroIngresado;
    if (cant === 0) { mostrarError(tipo === "ajuste" ? "Ese ya es el stock actual, no hay nada que ajustar." : "Escribí una cantidad distinta de 0."); return; }
    setGuardando(true);
    try {
      await supaApi.crearEntradaInventario({ producto_id: producto.id, cantidad: cant, tipo, fecha, nota: nota.trim() || null });
      const nuevoStock = Math.max(0, cantidadActual + cant);
      await onActualizarProducto(producto.id, { cantidad: nuevoStock });
      setCantidadActual(nuevoStock);
      setCantidad(""); setNota(""); setTipo("compra"); setFecha(new Date().toISOString().slice(0, 10));
      await cargar();
      await onRecargarProductos();
    } catch (e) { mostrarError(e.message); }
    finally { setGuardando(false); }
  };

  const guardarEdicion = async (form) => {
    const nuevaCant = parseFloat(form.cantidad);
    if (isNaN(nuevaCant) || nuevaCant === 0) { mostrarError("Escribí una cantidad distinta de 0."); return; }
    setGuardando(true);
    try {
      const delta = nuevaCant - entradaEditando.cantidad;
      await supaApi.actualizarEntradaInventario(entradaEditando.id, { cantidad: nuevaCant, tipo: form.tipo, fecha: form.fecha, nota: form.nota.trim() || null });
      const nuevoStock = Math.max(0, cantidadActual + delta);
      await onActualizarProducto(producto.id, { cantidad: nuevoStock });
      setCantidadActual(nuevoStock);
      setEntradaEditando(null);
      await cargar();
      await onRecargarProductos();
    } catch (e) { mostrarError(e.message); }
    finally { setGuardando(false); }
  };

  const eliminarEntrada = async (e) => {
    if (!(await confirmarAccion(`¿Eliminar esta entrada de ${e.cantidad > 0 ? "+" : ""}${e.cantidad}? El stock se recalcula solo.`))) return;
    setGuardando(true);
    try {
      await supaApi.eliminarEntradaInventario(e.id);
      const nuevoStock = Math.max(0, cantidadActual - e.cantidad);
      await onActualizarProducto(producto.id, { cantidad: nuevoStock });
      setCantidadActual(nuevoStock);
      await cargar();
      await onRecargarProductos();
    } catch (err) { mostrarError(err.message); }
    finally { setGuardando(false); }
  };

  return (
    <div className="border-t border-slate-100 dark:border-white/10 pt-4 mt-1">
      <h3 className="text-xs font-semibold text-slate-500 dark:text-white uppercase tracking-wide mb-1">Entradas de stock</h3>
      <p className="text-sm text-slate-700 dark:text-white mb-3">Stock actual: <b className="font-mono">{cantidadActual}</b> unidades</p>

      <div className="grid grid-cols-2 gap-2 mb-2">
        <input type="number" value={cantidad} onChange={(e) => setCantidad(e.target.value)} placeholder="Cantidad (+6 o -2)"
          className="px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm text-slate-700 dark:text-white outline-none focus:border-[#E3A73B]" />
        <select value={tipo} onChange={(e) => setTipo(e.target.value)}
          className="px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm text-slate-700 dark:text-white outline-none focus:border-[#E3A73B]">
          {Object.keys(TIPO_ENTRADA_LABEL).map(t => <option key={t} value={t}>{TIPO_ENTRADA_LABEL[t]}</option>)}
        </select>
        <input type="date" value={fecha} onChange={(e) => setFecha(e.target.value)}
          className="px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm text-slate-700 dark:text-white outline-none focus:border-[#E3A73B]" />
        <input value={nota} onChange={(e) => setNota(e.target.value)} placeholder="Nota (opcional)"
          className="px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm text-slate-700 dark:text-white outline-none focus:border-[#E3A73B]" />
      </div>
      <button disabled={guardando} onClick={agregarEntrada} className="w-full bg-[#16233D] text-white text-sm font-semibold py-2 rounded-lg disabled:opacity-50 flex items-center justify-center gap-2 mb-3">
        {guardando && <IconLoading />} + Agregar entrada
      </button>

      <div className="space-y-1.5 max-h-40 overflow-y-auto">
        {cargando ? (
          <p className="text-xs text-slate-400 py-2">Cargando...</p>
        ) : entradas.length === 0 ? (
          <p className="text-xs text-slate-400 py-2">Todavía no hay entradas registradas para este producto.</p>
        ) : entradas.map(e => (
          <div key={e.id} className="flex items-center justify-between bg-slate-50 dark:bg-neutral-900 rounded-lg px-3 py-2 text-xs">
            <div className="min-w-0">
              <div className="text-slate-700 dark:text-white font-medium">{TIPO_ENTRADA_LABEL[e.tipo] || e.tipo} · <span className={e.cantidad >= 0 ? "text-emerald-600 dark:text-emerald-400" : "text-rose-600 dark:text-rose-400"}>{e.cantidad > 0 ? "+" : ""}{e.cantidad}</span></div>
              <div className="text-slate-400 truncate">{e.fecha}{e.nota ? ` · ${e.nota}` : ""}</div>
            </div>
            <div className="flex items-center gap-2 shrink-0">
              <button onClick={() => setEntradaEditando(e)} className="px-2 py-1 rounded border border-slate-200 dark:border-white/20 text-slate-600 dark:text-white">Editar</button>
              <button onClick={() => eliminarEntrada(e)} className="text-slate-400 hover:text-rose-500">🗑️</button>
            </div>
          </div>
        ))}
      </div>

      {entradaEditando && (
        <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50" onClick={() => setEntradaEditando(null)}>
          <ModalEditarEntrada entrada={entradaEditando} guardando={guardando} onGuardar={guardarEdicion} onCerrar={() => setEntradaEditando(null)} />
        </div>
      )}
    </div>
  );
}
