  const [cantidad, setCantidad] = useState("");
  const [tipo, setTipo] = useState("compra");
  const [fecha, setFecha] = useState(() => new Date().toISOString().slice(0, 10));
  const [nota, setNota] = useState("");
  const [guardando, setGuardando] = useState(false);
  const [entradaEditando, setEntradaEditando] = useState(null);

  const cargar = useCallback(async () => {
    try {
      const datos = await supaApi.listarEntradasInventario(producto.id);
      setEntradas(datos);
    } catch (e) { /* silencioso, no bloquea el resto del formulario */ }
    finally { setCargando(false); }
  }, [producto.id]);

  useEffect(() => { setCantidadActual(producto.cantidad); cargar(); }, [producto.id]);

  const agregarEntrada = async () => {
    const numeroIngresado = parseFloat(cantidad);
    if (isNaN(numeroIngresado)) { mostrarError(tipo === "ajuste" ? "Escribí el nuevo stock total." : "Escribí una cantidad distinta de 0."); return; }
    const cant = tipo === "ajuste" ? (numeroIngresado - cantidadActual) : numeroIngresado;
    if (cant === 0) { mostrarError(tipo === "ajuste" ? "Ese ya es el stock actual, no hay nada que ajustar." : "Escribí una cantidad distinta de 0."); return; }
    setGuardando(true);
    try {
      await supaApi.crearEntradaInventario({ producto_id: producto.id, cantidad: cant, tipo, fecha, nota: nota.trim() || null });
      const nuevoStock = Math.max(0, cantidadActual + cant);
      await onActualizarProducto(producto.id, { cantidad: nuevoStock });
      setCantidadActual(nuevoStock);
      setCantidad(""); setNota(""); setTipo("compra"); setFecha(new Date().toISOString().slice(0, 10));
      await cargar();
      await onRecargarProductos();
    } catch (e) { mostrarError(e.message); }
    finally { setGuardando(false); }
  };

  const guardarEdicion = async (form) => {
    const nuevaCant = parseFloat(form.cantidad);
    if (isNaN(nuevaCant) || nuevaCant === 0) { mostrarError("Escribí una cantidad distinta de 0."); return; }
    setGuardando(true);
    try {
      const delta = nuevaCant - entradaEditando.cantidad;
      await supaApi.actualizarEntradaInventario(entradaEditando.id, { cantidad: nuevaCant, tipo: form.tipo, fecha: form.fecha, nota: form.nota.trim() || null });
      const nuevoStock = Math.max(0, cantidadActual + delta);
      await onActualizarProducto(producto.id, { cantidad: nuevoStock });
      setCantidadActual(nuevoStock);
      setEntradaEditando(null);
      await cargar();
      await onRecargarProductos();
    } catch (e) { mostrarError(e.message); }
    finally { setGuardando(false); }
  };

  const eliminarEntrada = async (e) => {
    if (!(await confirmarAccion(`¿Eliminar esta entrada de ${e.cantidad > 0 ? "+" : ""}${e.cantidad}? El stock se recalcula solo.`))) return;
    setGuardando(true);
    try {
      await supaApi.eliminarEntradaInventario(e.id);
      const nuevoStock = Math.max(0, cantidadActual - e.cantidad);
      await onActualizarProducto(producto.id, { cantidad: nuevoStock });
      setCantidadActual(nuevoStock);
      await cargar();
      await onRecargarProductos();
    } catch (err) { mostrarError(err.message); }
    finally { setGuardando(false); }
  };

  return (
    <div className="border-t border-slate-100 dark:border-white/10 pt-4 mt-1">
      <h3 className="text-xs font-semibold text-slate-500 dark:text-white uppercase tracking-wide mb-1">Entradas de stock</h3>
      <p className="text-sm text-slate-700 dark:text-white mb-3">Stock actual: <b className="font-mono">{cantidadActual}</b> unidades</p>

      <div className="grid grid-cols-2 gap-2 mb-2">
        <input type="number" value={cantidad} onChange={(e) => setCantidad(e.target.value)} placeholder="Cantidad (+6 o -2)"
          className="px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm text-slate-700 dark:text-white outline-none focus:border-[#E3A73B]" />
        <select value={tipo} onChange={(e) => setTipo(e.target.value)}
          className="px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm text-slate-700 dark:text-white outline-none focus:border-[#E3A73B]">
          {Object.keys(TIPO_ENTRADA_LABEL).map(t => <option key={t} value={t}>{TIPO_ENTRADA_LABEL[t]}</option>)}
        </select>
        <input type="date" value={fecha} onChange={(e) => setFecha(e.target.value)}
          className="px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm text-slate-700 dark:text-white outline-none focus:border-[#E3A73B]" />
        <input value={nota} onChange={(e) => setNota(e.target.value)} placeholder="Nota (opcional)"
          className="px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm text-slate-700 dark:text-white outline-none focus:border-[#E3A73B]" />
      </div>
      <button disabled={guardando} onClick={agregarEntrada} className="w-full bg-[#16233D] text-white text-sm font-semibold py-2 rounded-lg disabled:opacity-50 flex items-center justify-center gap-2 mb-3">
        {guardando && <IconLoading />} + Agregar entrada
      </button>

      <div className="space-y-1.5 max-h-40 overflow-y-auto">
        {cargando ? (
          <p className="text-xs text-slate-400 py-2">Cargando...</p>
        ) : entradas.length === 0 ? (
          <p className="text-xs text-slate-400 py-2">Todavía no hay entradas registradas para este producto.</p>
        ) : entradas.map(e => (
          <div key={e.id} className="flex items-center justify-between bg-slate-50 dark:bg-neutral-900 rounded-lg px-3 py-2 text-xs">
            <div className="min-w-0">
              <div className="text-slate-700 dark:text-white font-medium">{TIPO_ENTRADA_LABEL[e.tipo] || e.tipo} · <span className={e.cantidad >= 0 ? "text-emerald-600 dark:text-emerald-400" : "text-rose-600 dark:text-rose-400"}>{e.cantidad > 0 ? "+" : ""}{e.cantidad}</span></div>
              <div className="text-slate-400 truncate">{e.fecha}{e.nota ? ` · ${e.nota}` : ""}</div>
            </div>
            <div className="flex items-center gap-2 shrink-0">
              <button onClick={() => setEntradaEditando(e)} className="px-2 py-1 rounded border border-slate-200 dark:border-white/20 text-slate-600 dark:text-white">Editar</button>
              <button onClick={() => eliminarEntrada(e)} className="text-slate-400 hover:text-rose-500">🗑️</button>
            </div>
          </div>
        ))}
      </div>

      {entradaEditando && (
        <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50" onClick={() => setEntradaEditando(null)}>
          <ModalEditarEntrada entrada={entradaEditando} guardando={guardando} onGuardar={guardarEdicion} onCerrar={() => setEntradaEditando(null)} />
        </div>
      )}
    </div>
  );
}

function ModalEditarEntrada({ entrada, onGuardar, onCerrar, guardando }) {
  const [form, setForm] = useState({ cantidad: entrada.cantidad, tipo: entrada.tipo, fecha: entrada.fecha, nota: entrada.nota || "" });
  return (
    <div onClick={(e) => e.stopPropagation()} className="bg-white dark:bg-black rounded-2xl p-6 w-full max-w-sm">
      <h2 className="font-semibold text-slate-800 dark:text-white mb-4 font-display">Editar entrada</h2>
      <div className="grid grid-cols-2 gap-2 mb-4">
        <input type="number" value={form.cantidad} onChange={(e) => setForm({ ...form, cantidad: e.target.value })}
          className="px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm outline-none focus:border-[#E3A73B]" />
        <select value={form.tipo} onChange={(e) => setForm({ ...form, tipo: e.target.value })}
          className="px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm outline-none focus:border-[#E3A73B]">
          {Object.keys(TIPO_ENTRADA_LABEL).map(t => <option key={t} value={t}>{TIPO_ENTRADA_LABEL[t]}</option>)}
        </select>
        <input type="date" value={form.fecha} onChange={(e) => setForm({ ...form, fecha: e.target.value })}
          className="px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm outline-none focus:border-[#E3A73B]" />
        <input value={form.nota} onChange={(e) => setForm({ ...form, nota: e.target.value })} placeholder="Nota (opcional)"
          className="px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm outline-none focus:border-[#E3A73B]" />
      </div>
      <div className="flex gap-2">
        <button onClick={onCerrar} className="flex-1 px-3 py-2.5 rounded-lg text-sm font-medium border border-slate-200 dark:border-white/10 text-slate-600 dark:text-white">Cancelar</button>
        <button disabled={guardando} onClick={() => onGuardar({ ...form, cantidad: parseFloat(form.cantidad) })} className="flex-1 px-3 py-2.5 rounded-lg text-sm font-semibold bg-[#E3A73B] text-[#16233D] disabled:opacity-50 flex items-center justify-center gap-2">
          {guardando && <IconLoading />} Guardar
        </button>
      </div>
    </div>
  );
}

function ModalProducto({ abierto, producto, onGuardar, onCerrar, guardando, onActualizarProducto, onRecargarProductos }) {
  const [form, setForm] = useState({ nombre: "", categoria: "", costo: "", venta: "", cantidad: "", minimo: "", unidades_por_caja: "", precio_caja: "" });
  const [modoCalculo, setModoCalculo] = useState("tradicional"); // "tradicional" | "margen"
  const [pctSeleccionado, setPctSeleccionado] = useState(30);
  const [pctOtro, setPctOtro] = useState("");
  const [mostrarOtro, setMostrarOtro] = useState(false);
  const [ventaManual, setVentaManual] = useState(false);
  const [mostrarCaja, setMostrarCaja] = useState(false);
  const [precioCajaManual, setPrecioCajaManual] = useState(false);

  useEffect(() => {
    if (producto) {
      setForm({
        nombre: producto.nombre, categoria: producto.categoria || "", costo: producto.costo, venta: producto.venta,
        cantidad: producto.cantidad, minimo: producto.minimo,
        unidades_por_caja: producto.unidades_por_caja || "", precio_caja: producto.precio_caja || "",
      });
      setVentaManual(true); // al editar un producto existente, no recalcular su precio automáticamente
      setMostrarCaja(!!producto.unidades_por_caja || !!producto.precio_caja);
      setPrecioCajaManual(true);
    } else {
      setForm({ nombre: "", categoria: "", costo: "", venta: "", cantidad: "", minimo: "", unidades_por_caja: "", precio_caja: "" });
      setVentaManual(false);
      setMostrarCaja(false);
      setPrecioCajaManual(false);
    }
    setModoCalculo("tradicional");
    setPctSeleccionado(30);
    setPctOtro("");
    setMostrarOtro(false);
  }, [producto, abierto]);

  const costoNum = parseFloat(form.costo) || 0;
  const pctActivo = mostrarOtro ? (parseFloat(pctOtro) || 0) : pctSeleccionado;

  const ventaSugerida = (() => {
    if (costoNum <= 0) return 0;
    if (modoCalculo === "tradicional") {
      return costoNum * (1 + pctActivo / 100);
    }
    if (pctActivo >= 100) return costoNum;
    return costoNum / (1 - pctActivo / 100);
  })();

  useEffect(() => {
    if (!ventaManual && costoNum > 0 && ventaSugerida > 0) {
      setForm((f) => ({ ...f, venta: ventaSugerida.toFixed(2) }));
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [costoNum, pctActivo, modoCalculo, ventaManual]);

  const ventaNum = parseFloat(form.venta) || 0;
  const unidadesCajaNum = parseFloat(form.unidades_por_caja) || 0;
  const precioCajaSugerido = unidadesCajaNum > 0 && costoNum > 0 && ventaSugerida > 0 ? ventaSugerida * unidadesCajaNum : 0;

  useEffect(() => {
    if (mostrarCaja && !precioCajaManual && unidadesCajaNum > 0 && precioCajaSugerido > 0) {
      setForm((f) => ({ ...f, precio_caja: precioCajaSugerido.toFixed(2) }));
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [unidadesCajaNum, precioCajaSugerido, mostrarCaja, precioCajaManual]);

  if (!abierto) return null;

  const ganancia = ventaNum - costoNum;
  const margenReal = ventaNum > 0 ? ((ganancia / ventaNum) * 100).toFixed(0) : 0;
  const precioCajaNum = parseFloat(form.precio_caja) || 0;
  const costoCajaTotal = costoNum * unidadesCajaNum;
  const gananciaCaja = precioCajaNum - costoCajaTotal;
  const margenCajaReal = precioCajaNum > 0 ? ((gananciaCaja / precioCajaNum) * 100).toFixed(0) : 0;
  const PCTS = [15, 20, 30, 50];

  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-40">
      <div className="bg-white dark:bg-black rounded-2xl p-6 w-full max-w-sm max-h-[90vh] overflow-y-auto">
        <h2 className="font-semibold text-slate-800 dark:text-white mb-4 font-display">{producto ? "Editar producto" : "Agregar producto"}</h2>
        <div className="space-y-3">
          <div>
            <label className="block text-xs font-semibold text-slate-500 dark:text-white uppercase mb-1">Nombre del producto</label>
            <input
              type="text"
              value={form.nombre}
              onChange={(e) => setForm({ ...form, nombre: e.target.value })}
              className="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm text-slate-700 dark:text-white outline-none focus:border-[#E3A73B]"
            />
          </div>
          <div>
            <label className="block text-xs font-semibold text-slate-500 dark:text-white uppercase mb-1">Categoría (opcional)</label>
            <input
              type="text"
              value={form.categoria}
              onChange={(e) => setForm({ ...form, categoria: e.target.value })}
              className="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm text-slate-700 dark:text-white outline-none focus:border-[#E3A73B]"
            />
          </div>

          {/* Calculadora de precio */}
          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="block text-xs font-semibold text-slate-500 dark:text-white uppercase mb-1">Costo de compra ({simboloMoneda()})</label>
              <input
                type="number"
                value={form.costo}
                onChange={(e) => setForm({ ...form, costo: e.target.value })}
                className="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm text-slate-700 dark:text-white outline-none focus:border-[#E3A73B]"
              />
            </div>
            <div>
              <label className="block text-xs font-semibold text-slate-500 dark:text-white uppercase mb-1">Precio de venta ({simboloMoneda()})</label>
              <input
                type="number"
                value={form.venta}
                onChange={(e) => { setVentaManual(true); setForm({ ...form, venta: e.target.value }); }}
                className="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm text-slate-700 dark:text-white outline-none focus:border-[#E3A73B]"
              />
            </div>
          </div>

          <div className="grid grid-cols-2 gap-2">
            <button
              type="button"
              onClick={() => { setModoCalculo("tradicional"); setVentaManual(false); }}
              className={"px-2 py-2 rounded-lg text-[11px] font-semibold border text-center leading-tight " + (modoCalculo === "tradicional" ? "bg-[#E3A73B] border-[#E3A73B] text-[#16233D]" : "border-slate-200 dark:border-white/10 text-slate-600 dark:text-white")}
            >
              📊 Sumar al costo<br />(Tradicional)
            </button>
            <button
              type="button"
              onClick={() => { setModoCalculo("margen"); setVentaManual(false); }}
              className={"px-2 py-2 rounded-lg text-[11px] font-semibold border text-center leading-tight " + (modoCalculo === "margen" ? "bg-[#E3A73B] border-[#E3A73B] text-[#16233D]" : "border-slate-200 dark:border-white/10 text-slate-600 dark:text-white")}
            >
              📈 Margen s/venta<br />(Real)
            </button>
          </div>

          <div>
            <label className="block text-xs font-semibold text-slate-500 dark:text-white uppercase mb-1">¿Cuánto le quieres ganar?</label>
            <div className="flex gap-1.5 flex-wrap">
              {PCTS.map((p) => (
                <button
                  key={p}
                  type="button"
                  onClick={() => { setPctSeleccionado(p); setMostrarOtro(false); setVentaManual(false); }}
                  className={"px-3 py-1.5 rounded-lg text-xs font-semibold border " + (!mostrarOtro && pctSeleccionado === p ? "bg-[#16233D] border-[#16233D] text-white" : "border-slate-200 dark:border-white/10 text-slate-600 dark:text-white")}
                >
                  {!mostrarOtro && pctSeleccionado === p ? "✓ " : ""}+{p}%
                </button>
              ))}
              <button
                type="button"
                onClick={() => { setMostrarOtro(true); setVentaManual(false); }}
                className={"px-3 py-1.5 rounded-lg text-xs font-semibold border " + (mostrarOtro ? "bg-[#16233D] border-[#16233D] text-white" : "border-slate-200 dark:border-white/10 text-slate-600 dark:text-white")}
              >
                ✏️ Otro
              </button>
            </div>
            {mostrarOtro && (
              <input
                type="number"
                autoFocus
                placeholder="% de ganancia"
                value={pctOtro}
                onChange={(e) => { setPctOtro(e.target.value); setVentaManual(false); }}
                className="mt-2 w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm text-slate-700 dark:text-white outline-none focus:border-[#E3A73B]"
              />
            )}
          </div>

          {costoNum > 0 && ventaNum > 0 && (
            <div className="bg-emerald-50 dark:bg-emerald-900/20 border border-emerald-100 dark:border-emerald-800 rounded-lg p-3">
              <div className="flex items-center justify-between text-xs text-slate-500 dark:text-white mb-1">
                <span>💰 Ganancia limpia estimada</span>
                <span className="px-2 py-0.5 rounded-full bg-white dark:bg-black text-emerald-600 dark:text-emerald-400 font-semibold">{margenReal}% margen</span>
              </div>
              <div className="text-2xl font-bold text-emerald-600 dark:text-emerald-400">
                +{formatMoneda(ganancia.toFixed(2))} <span className="text-xs font-normal text-slate-500 dark:text-white">para tu bolsillo</span>
              </div>
            </div>
          )}

          {!ventaManual && ventaSugerida > 0 && (
            <button
              type="button"
              onClick={() => setVentaManual(true)}
              className="w-full px-4 py-2.5 rounded-lg text-sm font-semibold bg-[#16233D] text-white flex items-center justify-center gap-2"
            >
              ✓ Usar precio de {formatMoneda(ventaSugerida.toFixed(2))}
            </button>
          )}

          {/* Precio por caja/paquete (opcional, para venta a distribuidoras) */}
          <div className="border-t border-slate-100 dark:border-white/10 pt-3">
            <button
              type="button"
              onClick={() => setMostrarCaja(!mostrarCaja)}
              className="w-full flex items-center justify-between text-xs font-semibold text-slate-500 dark:text-white uppercase"
            >
              <span>📦 Precio por caja/paquete (opcional)</span>
              <span>{mostrarCaja ? "−" : "+"}</span>
            </button>
            {mostrarCaja && (
              <div className="mt-2 space-y-3">
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-semibold text-slate-500 dark:text-white uppercase mb-1">Unidades por caja</label>
                    <input
                      type="number"
                      value={form.unidades_por_caja}
                      onChange={(e) => setForm({ ...form, unidades_por_caja: e.target.value })}
                      className="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm text-slate-700 dark:text-white outline-none focus:border-[#E3A73B]"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-500 dark:text-white uppercase mb-1">Precio de venta por caja ({simboloMoneda()})</label>
                    <input
                      type="number"
                      value={form.precio_caja}
                      onChange={(e) => { setPrecioCajaManual(true); setForm({ ...form, precio_caja: e.target.value }); }}
                      className="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm text-slate-700 dark:text-white outline-none focus:border-[#E3A73B]"
                    />
                  </div>
                </div>
                {unidadesCajaNum > 0 && precioCajaNum > 0 && (
                  <div className="bg-emerald-50 dark:bg-emerald-900/20 border border-emerald-100 dark:border-emerald-800 rounded-lg p-3">
                    <div className="flex items-center justify-between text-xs text-slate-500 dark:text-white mb-1">
                      <span>💰 Ganancia por caja</span>
                      <span className="px-2 py-0.5 rounded-full bg-white dark:bg-black text-emerald-600 dark:text-emerald-400 font-semibold">{margenCajaReal}% margen</span>
                    </div>
                    <div className="text-lg font-bold text-emerald-600 dark:text-emerald-400">
                      +{formatMoneda(gananciaCaja.toFixed(2))} <span className="text-xs font-normal text-slate-500 dark:text-white">por caja de {unidadesCajaNum} unidades</span>
                    </div>
                  </div>
                )}
                {!precioCajaManual && precioCajaSugerido > 0 && (
                  <button
                    type="button"
                    onClick={() => setPrecioCajaManual(true)}
                    className="w-full px-4 py-2 rounded-lg text-xs font-semibold bg-[#16233D] text-white flex items-center justify-center gap-2"
                  >
                    ✓ Usar precio sugerido de {formatMoneda(precioCajaSugerido.toFixed(2))}
                  </button>
                )}
              </div>
            )}
          </div>

          {!producto && (
            <div>
              <label className="block text-xs font-semibold text-slate-500 dark:text-white uppercase mb-1">Cantidad en stock</label>
              <input
                type="number"
                value={form.cantidad}
                onChange={(e) => setForm({ ...form, cantidad: e.target.value })}
                className="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm text-slate-700 dark:text-white outline-none focus:border-[#E3A73B]"
              />
            </div>
          )}
          <div>
            <label className="block text-xs font-semibold text-slate-500 dark:text-white uppercase mb-1">Alertar cuando queden menos de</label>
            <input
              type="number"
              value={form.minimo}
              onChange={(e) => setForm({ ...form, minimo: e.target.value })}
              className="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm text-slate-700 dark:text-white outline-none focus:border-[#E3A73B]"
            />
          </div>
        </div>

        {producto && (
          <SeccionEntradasInventario producto={producto} onActualizarProducto={onActualizarProducto} onRecargarProductos={onRecargarProductos} />
        )}

        <div className="flex gap-2 justify-end mt-5">
          <button onClick={onCerrar} className="px-4 py-2 rounded-lg text-sm font-medium border border-slate-200 dark:border-white/10 text-slate-600 dark:text-white">Cancelar</button>
          <button disabled={guardando || !form.nombre.trim()} onClick={() => onGuardar(form)} className="px-4 py-2 rounded-lg text-sm font-semibold bg-[#E3A73B] text-[#16233D] disabled:opacity-50 flex items-center gap-2">
            {guardando && <IconLoading />} Guardar
          </button>
        </div>
      </div>
    </div>
  );
}

function TarjetaProductoGrid({ producto, puedeEditar, verCostos, cantidadEnCarrito, onAgregar, onAbrirMenu, onImagenChange }) {
  const [subiendoFoto, setSubiendoFoto] = useState(false);
  const [menuFotoAbierto, setMenuFotoAbierto] = useState(false);
  const bajo = producto.cantidad <= producto.minimo;
  const inicial = producto.nombre.trim().charAt(0).toUpperCase() || "?";
  const sinStock = producto.cantidad <= 0;
  const margen = producto.costo > 0 ? ((producto.venta - producto.costo) / producto.costo * 100).toFixed(0) : 0;
  const idCamara = `foto-camara-${producto.id}`;
  const idGaleria = `foto-galeria-${producto.id}`;

  const elegirFoto = async (e) => {
    setMenuFotoAbierto(false);
    const archivo = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!archivo) return;
    setSubiendoFoto(true);
    try {
      const dataUrl = await comprimirImagen(archivo);
      await onImagenChange(producto, dataUrl);
    } catch (err) { mostrarError(err.message); }
    finally { setSubiendoFoto(false); }
  };

  const quitarFoto = async () => {
    setMenuFotoAbierto(false);
    setSubiendoFoto(true);
    try { await onImagenChange(producto, null); }
    catch (err) { mostrarError(err.message); }
    finally { setSubiendoFoto(false); }
  };

  return (
    <div className="bg-white dark:bg-black border border-slate-200 dark:border-white/10 rounded-2xl overflow-hidden flex flex-col">
      <div
        role={puedeEditar ? "button" : undefined}
        tabIndex={puedeEditar ? 0 : undefined}
        onClick={() => puedeEditar && setMenuFotoAbierto(true)}
        onKeyDown={(e) => { if (puedeEditar && (e.key === "Enter" || e.key === " ")) setMenuFotoAbierto(true); }}
        className={`relative w-full aspect-square bg-[#16233D]/5 dark:bg-white/5 ${puedeEditar ? "cursor-pointer" : ""}`}>
        {producto.imagen ? (
          <img src={producto.imagen} alt={producto.nombre} className="w-full h-full object-cover" />
        ) : (
          <div className="w-full h-full flex items-center justify-center">
            <span className="text-4xl font-bold text-[#16233D]/30 dark:text-white/25 font-display">{inicial}</span>
          </div>
        )}
        {subiendoFoto && (
          <div className="absolute inset-0 bg-black/40 flex items-center justify-center"><IconLoading className="text-white" /></div>
        )}
        {bajo && (
          <div className="absolute top-2 left-2"><Badge tone="danger">Bajo</Badge></div>
        )}
        {puedeEditar && (
          <button onClick={(e) => { e.stopPropagation(); onAbrirMenu(producto); }}
            className="absolute top-2 right-2 w-7 h-7 rounded-full bg-white/90 dark:bg-black/70 flex items-center justify-center text-slate-500 dark:text-white/70 text-base leading-none shadow-sm">⋮</button>
        )}
        {puedeEditar && (
          <button disabled={sinStock} onClick={(e) => { e.stopPropagation(); onAgregar(producto); }}
            className="absolute bottom-2 right-2 w-10 h-10 rounded-full bg-[#16233D] text-white flex items-center justify-center text-xl font-bold disabled:opacity-30 shadow-md active:scale-95 transition-transform">
            +
            {cantidadEnCarrito > 0 && (
              <span className="absolute -top-1.5 -right-1.5 bg-[#E3A73B] text-[#16233D] text-[10px] font-bold rounded-full min-w-[18px] h-[18px] px-1 flex items-center justify-center">{cantidadEnCarrito}</span>
            )}
          </button>
        )}
      </div>

      {puedeEditar && (
        <>
          <input id={idCamara} type="file" accept="image/*" capture="environment" onChange={elegirFoto} className="hidden" />
          <input id={idGaleria} type="file" accept="image/*" onChange={elegirFoto} className="hidden" />
          {menuFotoAbierto && (
            <div className="fixed inset-0 bg-black/40 flex items-end sm:items-center justify-center z-40" onClick={() => setMenuFotoAbierto(false)}>
              <div onClick={(e) => e.stopPropagation()} className="bg-white dark:bg-black rounded-t-2xl sm:rounded-2xl p-5 w-full sm:max-w-xs">
                <div className="font-semibold text-slate-800 dark:text-white mb-3 font-display truncate">Foto de {producto.nombre}</div>
                <div className="space-y-1.5">
                  <label htmlFor={idCamara}
                    className="w-full text-left px-3 py-3 rounded-lg text-sm font-medium text-slate-700 dark:text-white hover:bg-slate-50 dark:hover:bg-white/5 flex items-center gap-2.5 cursor-pointer">
                    📷 Tomar foto
                  </label>
                  <label htmlFor={idGaleria}
                    className="w-full text-left px-3 py-3 rounded-lg text-sm font-medium text-slate-700 dark:text-white hover:bg-slate-50 dark:hover:bg-white/5 flex items-center gap-2.5 cursor-pointer">
                    🖼️ Elegir de galería
                  </label>
                  {producto.imagen && (
                    <button onClick={quitarFoto} className="w-full text-left px-3 py-3 rounded-lg text-sm font-medium text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-900/10 flex items-center gap-2.5">
                      🗑️ Quitar foto
                    </button>
                  )}
                </div>
                <button onClick={() => setMenuFotoAbierto(false)} className="w-full mt-3 px-3 py-2.5 rounded-lg text-sm font-medium border border-slate-200 dark:border-white/10 text-slate-600 dark:text-white">Cancelar</button>
              </div>
            </div>
          )}
        </>
      )}

      <div className="p-3 flex flex-col gap-1">
        <div className="text-sm font-semibold text-slate-800 dark:text-white truncate" title={producto.nombre}>{producto.nombre}</div>
        <span className="text-xs text-slate-400 dark:text-white/40 font-mono">Stock {producto.cantidad}</span>
        <div className="flex flex-col mt-1">
          <span className="text-base font-bold text-[#16233D] dark:text-[#E3A73B] font-mono">{formatMoneda(Number(producto.venta).toFixed(2))}</span>
          {verCostos && <span className="text-[11px] text-emerald-600 dark:text-emerald-400 font-mono">{margen}% margen</span>}
          {!!producto.precio_caja && !!producto.unidades_por_caja && (
            <span className="text-[11px] text-slate-400 dark:text-white/40 font-mono">📦 {formatMoneda(Number(producto.precio_caja).toFixed(2))} / caja ({producto.unidades_por_caja}u)</span>
          )}
        </div>
      </div>
    </div>
  );
}

function CarritoVentaModal({ abierto, items, productos, clientes, onCambiarCantidad, onQuitar, onConfirmar, onCerrar, procesando }) {
  const [metodo, setMetodo] = useState("efectivo");
  const [clienteId, setClienteId] = useState("");
  const [pagoRecibido, setPagoRecibido] = useState("");

  useEffect(() => {
    if (abierto) { setMetodo("efectivo"); setClienteId(""); setPagoRecibido(""); }
  }, [abierto]);

  if (!abierto) return null;

  const lineas = Object.entries(items)
    .map(([id, cantidad]) => {
      const producto = productos.find(p => String(p.id) === String(id));
      return producto ? { producto, cantidad } : null;
    })
    .filter(Boolean);

  const total = lineas.reduce((a, l) => a + l.cantidad * Number(l.producto.venta), 0);
  const pago = parseFloat(pagoRecibido) || 0;
  const cambio = Math.max(0, pago - total);
  const puedeConfirmar = lineas.length > 0 && (metodo === "efectivo" || (metodo === "fiado" && clienteId));

  return (
    <div className="fixed inset-0 bg-black/40 flex items-end sm:items-center justify-center z-40" onClick={onCerrar}>
      <div onClick={(e) => e.stopPropagation()} className="bg-white dark:bg-black rounded-t-2xl sm:rounded-2xl p-5 w-full sm:max-w-sm max-h-[85vh] overflow-y-auto">
        <div className="flex items-center justify-between mb-3">
          <h3 className="font-bold text-slate-800 dark:text-white font-display">Carrito de venta</h3>
          <button onClick={onCerrar} className="text-slate-400 dark:text-white/50"><IconClose /></button>
        </div>

        {lineas.length === 0 ? (
          <p className="text-sm text-slate-400 text-center py-8">El carrito está vacío.</p>
        ) : (
          <div className="space-y-2 mb-4">
            {lineas.map(({ producto, cantidad }) => (
              <div key={producto.id} className="flex items-center gap-2 bg-slate-50 dark:bg-neutral-900 rounded-xl p-2.5">
                <div className="w-9 h-9 rounded-lg bg-[#16233D]/10 dark:bg-white/10 flex items-center justify-center shrink-0 overflow-hidden">
                  {producto.imagen ? (
                    <img src={producto.imagen} alt={producto.nombre} className="w-full h-full object-cover" />
                  ) : (
                    <span className="text-sm font-bold text-[#16233D]/60 dark:text-white/50 font-display">{producto.nombre.trim().charAt(0).toUpperCase()}</span>
                  )}
                </div>
                <div className="min-w-0 flex-1">
                  <div className="text-sm font-medium text-slate-700 dark:text-white truncate">{producto.nombre}</div>
                  <div className="text-xs text-slate-400 dark:text-white/40 font-mono">{formatMoneda(Number(producto.venta).toFixed(2))} / u</div>
                </div>
                <div className="flex items-center gap-1.5 shrink-0">
                  <button onClick={() => onCambiarCantidad(producto.id, -1)} className="w-6 h-6 rounded-full border border-slate-200 dark:border-white/20 text-slate-600 dark:text-white flex items-center justify-center text-sm">−</button>
                  <span className="text-sm font-semibold w-4 text-center font-mono">{cantidad}</span>
                  <button onClick={() => onCambiarCantidad(producto.id, 1)} disabled={cantidad >= producto.cantidad} className="w-6 h-6 rounded-full border border-slate-200 dark:border-white/20 text-slate-600 dark:text-white flex items-center justify-center text-sm disabled:opacity-30">+</button>
                </div>
                <div className="text-sm font-semibold text-[#16233D] dark:text-[#E3A73B] font-mono w-16 text-right shrink-0">{formatMoneda((cantidad * Number(producto.venta)).toFixed(2))}</div>
                <button onClick={() => onQuitar(producto.id)} className="text-slate-300 dark:text-white/30 hover:text-rose-500 text-sm shrink-0">🗑️</button>
              </div>
            ))}
          </div>
        )}

        <div className="border-t border-slate-100 dark:border-white/10 pt-3">
          <div className="flex items-center justify-between mb-3">
            <span className="text-sm text-slate-500 dark:text-white">{lineas.length} producto(s)</span>
            <span className="text-xl font-bold text-[#16233D] dark:text-white font-mono">{formatMoneda(total.toFixed(2))}</span>
          </div>

          <div className="flex gap-2 mb-3">
            <button onClick={() => setMetodo("efectivo")} className={`flex-1 py-2 rounded-lg text-sm font-semibold border ${metodo === "efectivo" ? "bg-[#16233D] text-white border-[#16233D]" : "border-slate-200 dark:border-white/10 text-slate-500 dark:text-white"}`}>Efectivo</button>
            <button onClick={() => setMetodo("fiado")} className={`flex-1 py-2 rounded-lg text-sm font-semibold border ${metodo === "fiado" ? "bg-[#16233D] text-white border-[#16233D]" : "border-slate-200 dark:border-white/10 text-slate-500 dark:text-white"}`}>Fiado</button>
          </div>

          {metodo === "efectivo" ? (
            <div className="bg-slate-50 dark:bg-neutral-900 rounded-lg p-3 mb-3">
              <div className="flex items-center justify-between mb-2">
                <span className="text-xs text-slate-500 dark:text-white">Pago recibido</span>
                <input type="number" value={pagoRecibido} onChange={(e) => setPagoRecibido(e.target.value)} placeholder="0.00"
                  className="w-24 text-right text-sm font-mono bg-transparent outline-none border-b border-slate-200 dark:border-white/20 text-slate-800 dark:text-white" />
              </div>
              <div className="flex items-center justify-between">
                <span className="text-xs text-slate-500 dark:text-white">Cambio</span>
                <span className="text-sm font-mono font-semibold text-slate-700 dark:text-white">{formatMoneda(cambio.toFixed(2))}</span>
              </div>
            </div>
          ) : (
            <select value={clienteId} onChange={(e) => setClienteId(e.target.value)}
              className="w-full mb-3 px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm text-slate-700 dark:text-white outline-none focus:border-[#E3A73B]">
              <option value="">Elegí un cliente...</option>
              {clientes.map(c => <option key={c.id} value={c.id}>{c.nombre}</option>)}
            </select>
          )}

          <button disabled={!puedeConfirmar || procesando} onClick={() => onConfirmar({ lineas, total, metodo, clienteId })}
            className="w-full py-3 rounded-xl text-sm font-semibold bg-[#E3A73B] text-[#16233D] disabled:opacity-50 flex items-center justify-center gap-2">
            {procesando && <IconLoading />} Confirmar venta
          </button>
        </div>
      </div>
    </div>
  );
}

function PaginaInventario({ productos, clientes = [], cargando, error, onRecargar, onCrear, onActualizar, onEliminar, onVentaRegistrada, onCrearFiado, verCostos = true, puedeEditar = true }) {
  const [busqueda, setBusqueda] = useState("");
  const [modalAbierto, setModalAbierto] = useState(false);
  const [productoEditando, setProductoEditando] = useState(null);
  const [guardando, setGuardando] = useState(false);
  const [productoMenu, setProductoMenu] = useState(null);
  const [productoVentaCantidad, setProductoVentaCantidad] = useState(null);
  const [vendiendo, setVendiendo] = useState(false);

  const filtrados = productos.filter(p => p.nombre.toLowerCase().includes(busqueda.toLowerCase()));
  const abrirNuevo = () => { setProductoEditando(null); setModalAbierto(true); };
  const abrirEditar = (p) => { setProductoEditando(p); setModalAbierto(true); };

  const guardar = async (form) => {
    setGuardando(true);
    try {
      if (productoEditando) {
        const datos = {
          nombre: form.nombre.trim(), categoria: form.categoria.trim(),
          costo: parseFloat(form.costo) || 0, venta: parseFloat(form.venta) || 0,
          minimo: parseFloat(form.minimo) || 0,
          unidades_por_caja: form.unidades_por_caja ? parseFloat(form.unidades_por_caja) : null,
          precio_caja: form.precio_caja ? parseFloat(form.precio_caja) : null,
        };
        await onActualizar(productoEditando.id, datos);
      } else {
        const datos = {
          nombre: form.nombre.trim(), categoria: form.categoria.trim(),
          costo: parseFloat(form.costo) || 0, venta: parseFloat(form.venta) || 0,
          cantidad: parseFloat(form.cantidad) || 0, minimo: parseFloat(form.minimo) || 0,
          unidades_por_caja: form.unidades_por_caja ? parseFloat(form.unidades_por_caja) : null,
          precio_caja: form.precio_caja ? parseFloat(form.precio_caja) : null,
        };
        await onCrear(datos);
      }
      setModalAbierto(false);
    } catch (e) { mostrarError(e.message); }
    finally { setGuardando(false); }
  };

  const vender = async (p, cant = 1) => {
    const nuevaCantidad = Math.max(0, p.cantidad - cant);
    const nuevaGanancia = (p.ganancia_acumulada || 0) + (p.venta - p.costo) * cant;
    const nuevosVendidos = (p.vendidos || 0) + cant;
    await onActualizar(p.id, { cantidad: nuevaCantidad, ganancia_acumulada: nuevaGanancia, vendidos: nuevosVendidos });
    await onVentaRegistrada({
      producto_id: p.id, producto_nombre: p.nombre, cantidad: cant,
      precio_venta: p.venta, precio_costo: p.costo, ganancia: (p.venta - p.costo) * cant,
    });
  };

  const confirmarVentaCantidad = async (p, cant) => {
    setVendiendo(true);
    try {
      await vender(p, cant);
      setProductoVentaCantidad(null);
    } catch (e) { mostrarError(e.message); }
    finally { setVendiendo(false); }
  };

  const [carrito, setCarrito] = useState({});
  const [carritoAbierto, setCarritoAbierto] = useState(false);
  const [procesandoVenta, setProcesandoVenta] = useState(false);

  const totalUnidadesCarrito = Object.values(carrito).reduce((a, b) => a + b, 0);

  const agregarAlCarrito = (p) => {
    setCarrito(prev => {
      const actual = prev[p.id] || 0;
      if (actual >= p.cantidad) return prev;
      return { ...prev, [p.id]: actual + 1 };
    });
  };
  const cambiarCantidadCarrito = (id, delta) => {
    setCarrito(prev => {
      const producto = productos.find(p => String(p.id) === String(id));
      const actual = prev[id] || 0;
      const nueva = Math.max(0, Math.min(producto ? producto.cantidad : actual, actual + delta));
      if (nueva === 0) { const copia = { ...prev }; delete copia[id]; return copia; }
      return { ...prev, [id]: nueva };
    });
  };
  const quitarDelCarrito = (id) => {
    setCarrito(prev => { const copia = { ...prev }; delete copia[id]; return copia; });
  };

  const handleImagenProducto = async (producto, dataUrl) => {
    await onActualizar(producto.id, { imagen: dataUrl });
  };

  const confirmarVentaCarrito = async ({ lineas, total, metodo, clienteId }) => {
    setProcesandoVenta(true);
    try {
      if (metodo === "efectivo") {
        for (const { producto, cantidad } of lineas) {
          await vender(producto, cantidad);
        }
      } else {
        const items = lineas.map(({ producto, cantidad }) => ({
          producto_id: producto.id, nombre: producto.nombre, cantidad, precio_unitario: producto.venta, tipo: "inventario",
        }));
        await onCrearFiado({ cliente_id: clienteId, productos: items, total });
      }
      setCarrito({});
      setCarritoAbierto(false);
    } catch (e) { mostrarError(e.message); }
    finally { setProcesandoVenta(false); }
  };

  return (
    <div className="space-y-5 pb-20">
      <div className="flex items-center justify-between flex-wrap gap-3">
        <div>
          <h1 className="text-xl font-bold text-slate-800 dark:text-white font-display">Inventario</h1>
          <p className="text-sm text-slate-500 dark:text-white mt-1">Conectado a la base de datos en la nube — se sincroniza entre dispositivos.</p>
        </div>
        <div className="flex gap-2">
          <button onClick={onRecargar} className="flex items-center gap-2 border border-slate-200 dark:border-white/10 text-slate-600 dark:text-white font-medium text-sm px-3 py-2 rounded-lg">
            <IconRefresh className={cargando ? "animate-spin inline-block" : "inline-block"} />
          </button>
          {puedeEditar && (
            <button onClick={abrirNuevo} className="flex items-center gap-2 bg-[#E3A73B] text-[#16233D] font-semibold text-sm px-4 py-2 rounded-lg hover:brightness-105">
              <IconPlus /> Agregar producto
            </button>
          )}
        </div>
      </div>

      {error && <div className="bg-rose-50 dark:bg-rose-900/20 border border-rose-200 dark:border-rose-800 text-rose-700 dark:text-rose-300 text-sm rounded-lg p-3">{error}</div>}

      <div className="relative max-w-xs">
        <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><IconSearch /></span>
        <input value={busqueda} onChange={(e) => setBusqueda(e.target.value)} placeholder="Buscar producto..."
          className="w-full pl-9 pr-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm text-slate-700 dark:text-white outline-none focus:border-[#E3A73B]" />
      </div>

      {cargando && productos.length === 0 ? (
        <div className="flex items-center justify-center py-16 text-slate-400 gap-2 text-sm"><IconLoading /> Cargando inventario...</div>
      ) : filtrados.length === 0 ? (
        <div className="text-center py-16 text-slate-400 text-sm">{productos.length === 0 ? "Todavía no hay productos — agregá el primero." : "Sin resultados para tu búsqueda."}</div>
      ) : (
        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3">
          {filtrados.map((p) => (
            <TarjetaProductoGrid key={p.id} producto={p} puedeEditar={puedeEditar} verCostos={verCostos}
              cantidadEnCarrito={carrito[p.id] || 0} onAgregar={agregarAlCarrito} onAbrirMenu={setProductoMenu} onImagenChange={handleImagenProducto} />
          ))}
        </div>
      )}

      {puedeEditar && totalUnidadesCarrito > 0 && (
        <button onClick={() => setCarritoAbierto(true)}
          className="fixed bottom-5 right-5 z-30 flex items-center gap-2 bg-[#16233D] text-white font-semibold text-sm pl-4 pr-5 py-3 rounded-full shadow-lg">
          <IconCart />
          <span>Ver carrito</span>
          <span className="bg-[#E3A73B] text-[#16233D] text-xs font-bold rounded-full min-w-[20px] h-5 px-1.5 flex items-center justify-center">{totalUnidadesCarrito}</span>
        </button>
      )}

      <CarritoVentaModal abierto={carritoAbierto} items={carrito} productos={productos} clientes={clientes}
        onCambiarCantidad={cambiarCantidadCarrito} onQuitar={quitarDelCarrito}
        onConfirmar={confirmarVentaCarrito} onCerrar={() => setCarritoAbierto(false)} procesando={procesandoVenta} />

      <ModalVentaCantidad producto={productoVentaCantidad} guardando={vendiendo} onConfirmar={confirmarVentaCantidad} onCerrar={() => setProductoVentaCantidad(null)} />
      <ModalAccionesProducto producto={productoMenu}
        onEditar={() => { abrirEditar(productoMenu); setProductoMenu(null); }}
        onEliminar={async () => { if (await confirmarAccion(`¿Eliminar ${productoMenu.nombre}?`)) onEliminar(productoMenu.id); setProductoMenu(null); }}
        onCerrar={() => setProductoMenu(null)} />
      <ModalProducto abierto={modalAbierto} producto={productoEditando} onGuardar={guardar} onCerrar={() => setModalAbierto(false)} guardando={guardando} onActualizarProducto={onActualizar} onRecargarProductos={onRecargar} />
    </div>
  );
}

function PaginaHistorial({ productos, onActualizarProducto, onRecargarProductos }) {
  const [eventos, setEventos] = useState([]);
  const [cargando, setCargando] = useState(true);
  const [error, setError] = useState(null);
  const [filtro, setFiltro] = useState("todos");

  const cargar = useCallback(async () => {
    try {
      setError(null);
      const [
        { datos: ventasServidor, offline: off1 },
        { datos: perdidas, offline: off2 },
        { datos: movimientos, offline: off3 },
        { datos: productosDb, offline: off4 },
      ] = await Promise.all([
        obtenerConRespaldo("hist_ventas", () => supaApi.listarVentas()),
        obtenerConRespaldo("hist_perdidas", () => supaApi.listarPerdidas()),
        obtenerConRespaldo("hist_movimientos", () => supaApi.listarTodosMovimientosCaja()),
        obtenerConRespaldo("hist_productos", () => supaApi.listarProductos()),
      ]);
      const ventas = await ventasIncluyendoPendientes(ventasServidor);

      const items = [
        ...ventas.map(v => ({
          id: v.id, tipo: "venta", fecha: v.creado_en, raw: v,
          descripcion: `Venta: ${v.cantidad} u. de ${v.producto_nombre}${v._pendiente ? " (sin sincronizar)" : ""}`,
          monto: v.cantidad * v.precio_venta, positivo: true,
        })),
        ...perdidas.map(p => ({
          id: p.id, tipo: "perdida", fecha: p.creado_en, raw: p,
          descripcion: `Pérdida (${p.motivo}): ${p.cantidad} u. de ${p.producto_nombre}`,
          monto: p.valor_perdido, positivo: false,
        })),
        ...movimientos.map(m => ({
          id: m.id, tipo: m.tipo === "ingreso" ? "dinero_entrada" : "dinero_salida", fecha: m.creado_en, raw: m,
          descripcion: m.descripcion || (m.tipo === "ingreso" ? "Entrada de dinero" : "Salida de dinero"),
          monto: m.monto, positivo: m.tipo === "ingreso",
        })),
        ...productosDb.map(p => ({
          id: p.id, tipo: "producto_agregado", fecha: p.creado_en, raw: p,
          descripcion: `Producto agregado: ${p.nombre}`,
          monto: null, positivo: true,
        })),
      ].sort((a, b) => new Date(b.fecha) - new Date(a.fecha));

      setEventos(items);
      if (off1 || off2 || off3 || off4) notificarConexion("sin_conexion");
    } catch (e) {
      setError("No se pudo cargar el historial. Revisá tu conexión a internet.");
    } finally {
      setCargando(false);
    }
  }, []);

  useEffect(() => { cargar(); }, [cargar]);

  const eliminarEvento = async (e) => {
    if (e.tipo === "producto_agregado") { mostrarError("Para eliminar un producto, hacelo desde Inventario."); return; }
    if (!(await confirmarAccion("¿Eliminar este registro? No se puede deshacer."))) return;
    try {
      if (e.tipo === "venta") {
        const producto = productos.find(p => p.id === e.raw.producto_id);
        if (producto) {
          await onActualizarProducto(producto.id, {
            cantidad: producto.cantidad + Number(e.raw.cantidad),
            ganancia_acumulada: Math.max(0, (producto.ganancia_acumulada || 0) - Number(e.raw.ganancia)),
            vendidos: Math.max(0, (producto.vendidos || 0) - Number(e.raw.cantidad)),
          });
        }
        await supaApi.eliminarVenta(e.raw.id);
        await onRecargarProductos();
      } else if (e.tipo === "perdida") {
        const producto = productos.find(p => p.id === e.raw.producto_id);
        if (producto) await onActualizarProducto(producto.id, { cantidad: producto.cantidad + Number(e.raw.cantidad) });
        await supaApi.eliminarPerdida(e.raw.id);
        await onRecargarProductos();
      } else {
        await supaApi.eliminarMovimiento(e.raw.id);
      }
      await cargar();
    } catch (err) { mostrarError(err.message); }
  };

  const tiposLabel = {
    venta: "Ventas", perdida: "Pérdidas", dinero_entrada: "Entradas de dinero",
    dinero_salida: "Salidas de dinero", producto_agregado: "Productos agregados",
  };
  const tonos = {
    venta: "ok", perdida: "danger", dinero_entrada: "ok", dinero_salida: "danger", producto_agregado: "neutral",
  };

  const filtrados = filtro === "todos" ? eventos : eventos.filter(e => e.tipo === filtro);

  return (
    <div className="space-y-5">
      <div>
        <h1 className="text-xl font-bold text-slate-800 dark:text-white font-display">Historial</h1>
        <p className="text-sm text-slate-500 dark:text-white mt-1">Todo lo que ha pasado en tu negocio, en un solo lugar.</p>
      </div>

      {error && <div className="bg-rose-50 dark:bg-rose-900/20 border border-rose-200 dark:border-rose-800 text-rose-700 dark:text-rose-300 text-sm rounded-lg p-3">{error}</div>}

      <div className="flex gap-2 flex-wrap">
        <button onClick={() => setFiltro("todos")} className={`text-xs font-medium px-3 py-1.5 rounded-full ${filtro === "todos" ? "bg-[#16233D] text-white" : "bg-slate-100 dark:bg-neutral-900 text-slate-600 dark:text-white"}`}>Todos</button>
        {Object.entries(tiposLabel).map(([key, label]) => (
          <button key={key} onClick={() => setFiltro(key)} className={`text-xs font-medium px-3 py-1.5 rounded-full ${filtro === key ? "bg-[#16233D] text-white" : "bg-slate-100 dark:bg-neutral-900 text-slate-600 dark:text-white"}`}>{label}</button>
        ))}
      </div>

      <div className="bg-white dark:bg-black border border-slate-200 dark:border-white/10 rounded-2xl p-5">
        {cargando ? (
          <div className="flex items-center gap-2 text-sm text-slate-400 py-6"><IconLoading /> Cargando historial...</div>
        ) : filtrados.length === 0 ? (
          <p className="text-sm text-slate-400 text-center py-6">No hay movimientos para mostrar</p>
        ) : (
          <div className="space-y-2 max-h-[32rem] overflow-y-auto">
            {filtrados.map((e, i) => (
              <div key={i} className="flex justify-between items-center py-2.5 px-3 rounded-lg bg-slate-50 dark:bg-neutral-900">
                <div className="flex items-center gap-3">
                  <Badge tone={tonos[e.tipo]}>{tiposLabel[e.tipo]}</Badge>
                  <div>
                    <div className="text-sm font-medium text-slate-700 dark:text-white">{e.descripcion}</div>
                    <div className="text-xs text-slate-400 font-mono">{new Date(e.fecha).toLocaleString()}</div>
                  </div>
                </div>
                <div className="flex items-center gap-2">
                  {e.monto !== null && (
                    <div className={`font-mono font-semibold text-sm ${e.positivo ? "text-emerald-600 dark:text-emerald-400" : "text-rose-600 dark:text-rose-400"}`}>
                      {e.positivo ? "+" : "-"}{formatMoneda(Number(e.monto).toFixed(2))}
                    </div>
                  )}
                  {e.tipo !== "producto_agregado" && (
                    <button onClick={() => eliminarEvento(e)} className="text-slate-400 hover:text-rose-500 text-sm">🗑️</button>
                  )}
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function GraficaCanvas({ tipo, data, id }) {
  const canvasRef = React.useRef(null);
  const chartRef = React.useRef(null);

  useEffect(() => {
    if (!canvasRef.current || typeof Chart === "undefined") return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current, {
      type: tipo,
      data,
      options: {
        responsive: true,
        plugins: { legend: { display: data.datasets.length > 1, labels: { font: { size: 11 } } } },
        scales: tipo === "bar" || tipo === "line" ? { y: { beginAtZero: true } } : {},
      },
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [JSON.stringify(data), tipo]);

  return <canvas ref={canvasRef} id={id}></canvas>;
}

function PaginaEstadisticas({ consumoHogar }) {
  const [ventas, setVentas] = useState([]);
  const [perdidas, setPerdidas] = useState([]);
  const [cargando, setCargando] = useState(true);
  const [error, setError] = useState(null);

  const cargar = useCallback(async () => {
    try {
      setError(null);
      const [{ datos: v, offline: off1 }, { datos: p, offline: off2 }] = await Promise.all([
        obtenerConRespaldo("ventas_500", () => supaApi.listarVentas(500)),
        obtenerConRespaldo("perdidas_500", () => supaApi.listarPerdidas(500)),
      ]);
      setVentas(v); setPerdidas(p);
      if (off1 || off2) notificarConexion("sin_conexion");
    } catch (e) {
      setError("No se pudo cargar las estadísticas. Revisá tu conexión a internet.");
    } finally {
      setCargando(false);
    }
  }, []);

  useEffect(() => { cargar(); }, [cargar]);

  if (cargando) return <div className="flex items-center gap-2 text-sm text-slate-400 py-16 justify-center"><IconLoading /> Cargando estadísticas...</div>;

  const gananciaTotal = ventas.reduce((a, v) => a + Number(v.ganancia), 0);
  const perdidaTotal = perdidas.reduce((a, p) => a + Number(p.valor_perdido), 0);
  const unidadesVendidas = ventas.reduce((a, v) => a + Number(v.cantidad), 0);

  // Reporte del mes (incluye consumo del hogar)
  const ahoraMes = new Date();
  const esEsteMes = (f) => { const d = new Date(f); return d.getFullYear() === ahoraMes.getFullYear() && d.getMonth() === ahoraMes.getMonth(); };
  const ventasMes = ventas.filter(v => esEsteMes(v.creado_en));
  const totalVendidoMes = ventasMes.reduce((a, v) => a + v.cantidad * v.precio_venta, 0);
  const gananciaMes = ventasMes.reduce((a, v) => a + Number(v.ganancia), 0);
  const consumoHogarMes = (consumoHogar || []).filter(r => esEsteMes(r.creado_en)).reduce((a, r) => a + Number(r.costo_total), 0);
  const gananciaRealMes = gananciaMes - consumoHogarMes;

  // Ventas por día (últimos 14 días)
  const hoy = new Date();
  const dias = Array.from({ length: 14 }, (_, i) => {
    const d = new Date(hoy); d.setDate(d.getDate() - (13 - i));
    return d.toISOString().slice(0, 10);
  });
  const ventasPorDia = dias.map(dia =>
    ventas.filter(v => v.creado_en.slice(0, 10) === dia).reduce((a, v) => a + v.cantidad * v.precio_venta, 0)
  );

  // Productos más vendidos
  const porProducto = {};
  ventas.forEach(v => { porProducto[v.producto_nombre] = (porProducto[v.producto_nombre] || 0) + Number(v.cantidad); });
  const topProductos = Object.entries(porProducto).sort((a, b) => b[1] - a[1]).slice(0, 6);

  // Ganancias vs pérdidas por semana (últimas 6 semanas, agrupado simple)
  const semanas = Array.from({ length: 6 }, (_, i) => {
    const fin = new Date(hoy); fin.setDate(fin.getDate() - i * 7);
    const inicio = new Date(fin); inicio.setDate(inicio.getDate() - 6);
    return { inicio, fin, label: `${inicio.getDate()}/${inicio.getMonth()+1}` };
  }).reverse();
  const gananciaPorSemana = semanas.map(s =>
    ventas.filter(v => { const f = new Date(v.creado_en); return f >= s.inicio && f <= s.fin; }).reduce((a, v) => a + Number(v.ganancia), 0)
  );
  const perdidaPorSemana = semanas.map(s =>
    perdidas.filter(p => { const f = new Date(p.creado_en); return f >= s.inicio && f <= s.fin; }).reduce((a, p) => a + Number(p.valor_perdido), 0)
  );

  return (
    <div className="space-y-5">
      <div>
        <h1 className="text-xl font-bold text-slate-800 dark:text-white font-display">Estadísticas</h1>
        <p className="text-sm text-slate-500 dark:text-white mt-1">Cómo va creciendo tu negocio.</p>
      </div>

      {error && <div className="bg-rose-50 dark:bg-rose-900/20 border border-rose-200 dark:border-rose-800 text-rose-700 dark:text-rose-300 text-sm rounded-lg p-3">{error}</div>}

      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
        <StatCard label="Unidades vendidas" value={unidadesVendidas} icon={IconCart} accent="bg-[#2471A3]" />
        <StatCard label="Ganancia total" value={`${formatMoneda(gananciaTotal.toFixed(2))}`} icon={IconChart} accent="bg-emerald-600" />
        <StatCard label="Pérdidas totales" value={`${formatMoneda(perdidaTotal.toFixed(2))}`} icon={IconAlert} accent="bg-rose-600" />
        <StatCard label="Ganancia neta" value={`${formatMoneda((gananciaTotal - perdidaTotal).toFixed(2))}`} icon={IconWallet} accent="bg-[#16233D]" />
      </div>

      <div className="bg-white dark:bg-black border border-slate-200 dark:border-white/10 rounded-2xl p-5">
        <h2 className="font-semibold text-slate-800 dark:text-white text-sm mb-4">Reporte del mes</h2>
        <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
          <div>
            <div className="text-[11px] text-slate-400 dark:text-white/40 uppercase tracking-wide">Total vendido</div>
            <div className="text-lg font-bold font-mono text-slate-800 dark:text-white">{formatMoneda(totalVendidoMes.toFixed(2))}</div>
          </div>
          <div>
            <div className="text-[11px] text-slate-400 dark:text-white/40 uppercase tracking-wide">Ganancia</div>
            <div className="text-lg font-bold font-mono text-emerald-600 dark:text-emerald-400">{formatMoneda(gananciaMes.toFixed(2))}</div>
          </div>
          <div>
            <div className="text-[11px] text-slate-400 dark:text-white/40 uppercase tracking-wide">🏠 Consumo del hogar</div>
            <div className="text-lg font-bold font-mono text-rose-600 dark:text-rose-400">{formatMoneda(consumoHogarMes.toFixed(2))}</div>
          </div>
          <div>
            <div className="text-[11px] text-slate-400 dark:text-white/40 uppercase tracking-wide">Ganancia real</div>
            <div className="text-lg font-bold font-mono text-[#E3A73B]">{formatMoneda(gananciaRealMes.toFixed(2))}</div>
          </div>
        </div>
      </div>

      <div className="grid lg:grid-cols-2 gap-4">
        <div className="bg-white dark:bg-black border border-slate-200 dark:border-white/10 rounded-2xl p-5">
          <h2 className="font-semibold text-slate-800 dark:text-white text-sm mb-3">Ventas últimos 14 días</h2>
          {ventas.length === 0 ? <p className="text-sm text-slate-400 py-8 text-center">Todavía no hay ventas registradas</p> : (
            <GraficaCanvas tipo="line" id="ventasDia" data={{
              labels: dias.map(d => d.slice(5)),
              datasets: [{ label: `Ventas (${simboloMoneda()})`, data: ventasPorDia, borderColor: "#2471A3", backgroundColor: "#2471A322", tension: 0.3, fill: true }],
            }} />
          )}
        </div>

        <div className="bg-white dark:bg-black border border-slate-200 dark:border-white/10 rounded-2xl p-5">
          <h2 className="font-semibold text-slate-800 dark:text-white text-sm mb-3">Productos más vendidos</h2>
          {topProductos.length === 0 ? <p className="text-sm text-slate-400 py-8 text-center">Todavía no hay ventas registradas</p> : (
            <GraficaCanvas tipo="line" id="topProductos" data={{
              labels: topProductos.map(([nombre]) => nombre),
              datasets: [{ label: "Unidades vendidas", data: topProductos.map(([, cant]) => cant), borderColor: "#E3A73B", backgroundColor: "#E3A73B22", tension: 0.3, fill: true }],
            }} />
          )}
        </div>

        <div className="lg:col-span-2 bg-white dark:bg-black border border-slate-200 dark:border-white/10 rounded-2xl p-5">
          <h2 className="font-semibold text-slate-800 dark:text-white text-sm mb-3">Ganancias vs. pérdidas — últimas 6 semanas</h2>
          <GraficaCanvas tipo="line" id="gananciaVsPerdida" data={{
            labels: semanas.map(s => s.label),
            datasets: [
              { label: "Ganancia", data: gananciaPorSemana, borderColor: "#2E7D4F", backgroundColor: "#2E7D4F22", tension: 0.3, fill: true },
              { label: "Pérdidas", data: perdidaPorSemana, borderColor: "#C1442D", backgroundColor: "#C1442D22", tension: 0.3, fill: true },
            ],
          }} />
        </div>
      </div>
    </div>
  );
}

function PantallaLogin({ onAutenticado }) {
  const [modo, setModo] = useState("login"); // "login" | "registro" | "recuperar"
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [confirmarPassword, setConfirmarPassword] = useState("");
  const [verPassword, setVerPassword] = useState(false);
  const [cargando, setCargando] = useState(false);
  const [error, setError] = useState(null);
  const [aviso, setAviso] = useState(null);

  const enviar = async () => {
    setError(null); setAviso(null);

    if (modo === "recuperar") {
      if (!email.trim()) { setError("Poné tu correo"); return; }
      setCargando(true);
      try {
        await authApi.recuperar(email.trim());
        setAviso("Te enviamos un correo con un link para elegir una nueva contraseña.");
      } catch (e) {
        setError(e.message);
      } finally {
        setCargando(false);
      }
      return;
    }

    if (!email.trim() || !password) { setError("Poné correo y contraseña"); return; }
    if (modo === "registro") {
      if (password.length < 6) { setError("La contraseña debe tener al menos 6 caracteres"); return; }
      if (password !== confirmarPassword) { setError("Las contraseñas no coinciden"); return; }
    }
    setCargando(true);
    try {
      if (modo === "registro") {
        const data = await authApi.signUp(email.trim(), password);
        if (data.access_token) {
          onAutenticado(data);
        } else {
          setAviso("Cuenta creada. Revisá tu correo para confirmarla, y después iniciá sesión aquí.");
          setModo("login");
        }
      } else {
        const data = await authApi.signIn(email.trim(), password);
        onAutenticado(data);
      }
    } catch (e) {
      setError(e.message);
    } finally {
      setCargando(false);
    }
  };

  const tituloModo = { login: "Iniciá sesión para ver tu negocio", registro: "Creá tu cuenta para empezar", recuperar: "Te ayudamos a recuperar tu acceso" };

  return (
    <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4">
      <div className="bg-white border border-slate-200 rounded-2xl p-6 w-full max-w-sm">
        <div className="mb-4">
          <NovaBrand theme="light" size="md" />
        </div>
        <p className="text-sm text-slate-500 mb-5">{tituloModo[modo]}</p>

        {modo !== "recuperar" && (
          <div className="flex gap-2 mb-4 bg-slate-100 rounded-lg p-1">
            <button onClick={() => { setModo("login"); setError(null); setAviso(null); }} className={`flex-1 py-2 rounded-md text-sm font-medium ${modo === "login" ? "bg-white shadow text-slate-800" : "text-slate-500"}`}>Iniciar sesión</button>
            <button onClick={() => { setModo("registro"); setError(null); setAviso(null); }} className={`flex-1 py-2 rounded-md text-sm font-medium ${modo === "registro" ? "bg-white shadow text-slate-800" : "text-slate-500"}`}>Crear cuenta</button>
          </div>
        )}

        {error && <div className="bg-rose-50 border border-rose-200 text-rose-700 text-xs rounded-lg p-2.5 mb-3">{error}</div>}
        {aviso && <div className="bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs rounded-lg p-2.5 mb-3">{aviso}</div>}

        <label className="block text-xs font-semibold text-slate-500 uppercase mb-1">Correo</label>
        <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="tu@correo.com"
          className="w-full px-3 py-2 rounded-lg border border-slate-200 bg-white text-sm mb-3 outline-none focus:border-[#E3A73B]" />

        {modo !== "recuperar" && (
          <>
            <label className="block text-xs font-semibold text-slate-500 uppercase mb-1">Contraseña</label>
            <div className="relative mb-3">
              <input type={verPassword ? "text" : "password"} value={password} onChange={(e) => setPassword(e.target.value)} placeholder="Mínimo 6 caracteres"
                className="w-full px-3 py-2 pr-10 rounded-lg border border-slate-200 bg-white text-sm outline-none focus:border-[#E3A73B]" />
              <button type="button" onClick={() => setVerPassword(!verPassword)} className="absolute right-2 top-1/2 -translate-y-1/2 text-sm">
                {verPassword ? <IconEyeOff /> : <IconEye />}
              </button>
            </div>
          </>
        )}

        {modo === "registro" && (
          <>
            <label className="block text-xs font-semibold text-slate-500 uppercase mb-1">Confirmar contraseña</label>
            <input type={verPassword ? "text" : "password"} value={confirmarPassword} onChange={(e) => setConfirmarPassword(e.target.value)} placeholder="Repetí tu contraseña"
              className="w-full px-3 py-2 rounded-lg border border-slate-200 bg-white text-sm mb-3 outline-none focus:border-[#E3A73B]" />
          </>
        )}

        {modo === "login" && (
          <button type="button" onClick={() => { setModo("recuperar"); setError(null); setAviso(null); }} className="block text-xs text-slate-500 underline mb-4">
            ¿Olvidaste tu contraseña?
          </button>
        )}
        {modo !== "login" && <div className="mb-1" />}

        <button disabled={cargando} onClick={enviar} className="w-full bg-[#E3A73B] text-[#16233D] font-semibold text-sm px-4 py-2.5 rounded-lg disabled:opacity-50 flex items-center justify-center gap-2 mt-3">
          {cargando && <IconLoading />} {modo === "login" ? "Entrar" : modo === "registro" ? "Crear cuenta" : "Enviar correo de recuperación"}
        </button>

        {modo === "recuperar" && (
          <button type="button" onClick={() => { setModo("login"); setError(null); setAviso(null); }} className="block text-xs text-slate-500 underline mt-3 mx-auto">
            Volver a iniciar sesión
          </button>
        )}
      </div>
    </div>
  );
}

function PantallaNuevaPassword({ accessToken, onListo }) {
  const [password, setPassword] = useState("");
  const [confirmarPassword, setConfirmarPassword] = useState("");
  const [verPassword, setVerPassword] = useState(false);
  const [cargando, setCargando] = useState(false);
  const [error, setError] = useState(null);
  const [listo, setListo] = useState(false);

  const enviar = async () => {
    setError(null);
    if (password.length < 6) { setError("La contraseña debe tener al menos 6 caracteres"); return; }
    if (password !== confirmarPassword) { setError("Las contraseñas no coinciden"); return; }
    setCargando(true);
    try {
      await authApi.cambiarPassword(accessToken, password);
      setListo(true);
    } catch (e) {
      setError(e.message);
    } finally {
      setCargando(false);
    }
  };

  return (
    <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4">
      <div className="bg-white border border-slate-200 rounded-2xl p-6 w-full max-w-sm">
        <div className="mb-4">
          <NovaBrand theme="light" size="md" />
        </div>
        {listo ? (
          <>
            <p className="text-sm text-slate-500 mb-5">Tu contraseña se cambió correctamente.</p>
            <button onClick={onListo} className="w-full bg-[#E3A73B] text-[#16233D] font-semibold text-sm px-4 py-2.5 rounded-lg">Ir a iniciar sesión</button>
          </>
        ) : (
          <>
            <p className="text-sm text-slate-500 mb-5">Elegí tu nueva contraseña</p>
            {error && <div className="bg-rose-50 border border-rose-200 text-rose-700 text-xs rounded-lg p-2.5 mb-3">{error}</div>}

            <label className="block text-xs font-semibold text-slate-500 uppercase mb-1">Nueva contraseña</label>
            <div className="relative mb-3">
              <input type={verPassword ? "text" : "password"} value={password} onChange={(e) => setPassword(e.target.value)} placeholder="Mínimo 6 caracteres"
                className="w-full px-3 py-2 pr-10 rounded-lg border border-slate-200 bg-white text-sm outline-none focus:border-[#E3A73B]" />
              <button type="button" onClick={() => setVerPassword(!verPassword)} className="absolute right-2 top-1/2 -translate-y-1/2 text-sm">
                {verPassword ? <IconEyeOff /> : <IconEye />}
              </button>
            </div>

            <label className="block text-xs font-semibold text-slate-500 uppercase mb-1">Confirmar contraseña</label>
            <input type={verPassword ? "text" : "password"} value={confirmarPassword} onChange={(e) => setConfirmarPassword(e.target.value)} placeholder="Repetí tu contraseña"
              className="w-full px-3 py-2 rounded-lg border border-slate-200 bg-white text-sm mb-4 outline-none focus:border-[#E3A73B]" />

            <button disabled={cargando} onClick={enviar} className="w-full bg-[#E3A73B] text-[#16233D] font-semibold text-sm px-4 py-2.5 rounded-lg disabled:opacity-50 flex items-center justify-center gap-2">
              {cargando && <IconLoading />} Guardar nueva contraseña
            </button>
          </>
        )}
      </div>
    </div>
  );
}

function PantallaInvitacion({ invitacion, onAceptada }) {

    setError(null);

      setError(e.message);
