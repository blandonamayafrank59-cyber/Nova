let currentAccessToken = null;
let currentUserId = null;
let currentRefreshToken = null;
function getHeaders(extra = {}) {
  return {
    apikey: SUPABASE_ANON_KEY,
    Authorization: `Bearer ${currentAccessToken || SUPABASE_ANON_KEY}`,
    "Content-Type": "application/json",
    ...extra,
  };
}

// Callbacks que App() conecta para persistir/limpiar la sesión cuando se renueva o vence el token
let alRefrescarSesion = null;
let alExpirarSesion = null;
let refrescandoPromesa = null;

async function refrescarToken() {
  if (!currentRefreshToken) return false;
  if (refrescandoPromesa) return refrescandoPromesa;
  refrescandoPromesa = (async () => {
    try {
      const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
        method: "POST",
        headers: { apikey: SUPABASE_ANON_KEY, "Content-Type": "application/json" },
        body: JSON.stringify({ refresh_token: currentRefreshToken }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.access_token) return false;
      currentAccessToken = data.access_token;
      currentRefreshToken = data.refresh_token || currentRefreshToken;
      if (alRefrescarSesion) alRefrescarSesion(data);
      return true;
    } catch (e) {
      return false;
    } finally {
      refrescandoPromesa = null;
    }
  })();
  return refrescandoPromesa;
}

// Envoltorio de fetch: si el token venció (401), renueva la sesión sola y reintenta una vez.
async function peticionApi(url, opciones = {}) {
  const { method = "GET", extraHeaders = {}, body } = opciones;
  const intentar = () => fetch(url, { method, headers: getHeaders(extraHeaders), body });
  let res = await intentar();
  if (res.status === 401) {
    const renovado = await refrescarToken();
    if (renovado) {
      res = await intentar();
    } else if (alExpirarSesion) {
      alExpirarSesion();
    }
  }
  return res;
}

  async signIn(email, password) {

  },
  async cambiarPassword(accessToken, password) {

  },
};

function calcularEstadoCliente(cliente, ultimaActividad) {
  const saldo = Number(cliente.saldo_pendiente) || 0;
  if (saldo <= 0) return { label: "Al día", dot: "🟢", tono: "ok" };
  const fechaRef = ultimaActividad || cliente.creado_en;
  const dias = fechaRef ? (Date.now() - new Date(fechaRef).getTime()) / 86400000 : 999;
  if (dias > 15) return { label: "Atrasado", dot: "🔴", tono: "danger" };
  return { label: "Pendiente", dot: "🟡", tono: "warn" };
}

function TarjetaCliente({ cliente, totalPagado, ultimaActividad, onAbonar, onHistorial, onEditar, onEliminar }) {
  const saldo = Number(cliente.saldo_pendiente) || 0;
  const totalOriginal = saldo + totalPagado;
  const progreso = totalOriginal > 0 ? Math.min(100, Math.round((totalPagado / totalOriginal) * 100)) : 100;
  const estado = calcularEstadoCliente(cliente, ultimaActividad);

  return (

function ModalNuevoFiado({ abierto, clientes, productos, onGuardar, onCerrar, guardando }) {
  const [clienteId, setClienteId] = useState("");
  const [items, setItems] = useState([]);
  const [productoSel, setProductoSel] = useState("");
  const [cantidadSel, setCantidadSel] = useState("1");

  useEffect(() => {
    if (abierto) { setClienteId(""); setItems([]); setProductoSel(""); setCantidadSel("1"); }
  }, [abierto]);

  if (!abierto) return null;

  const agregarItem = () => {
    const producto = productos.find(p => p.id === productoSel);
    const cant = parseFloat(cantidadSel) || 0;
    if (!producto || cant <= 0) return;
    const yaEnCarrito = items.reduce((a, it) => a + (it.producto_id === producto.id ? it.cantidad : 0), 0);
    if (cant + yaEnCarrito > producto.cantidad) { alert(`Solo hay ${producto.cantidad} unidades de ${producto.nombre} en stock.`); return; }
    setItems([...items, { producto_id: producto.id, nombre: producto.nombre, cantidad: cant, precio_unitario: producto.venta }]);
    setProductoSel(""); setCantidadSel("1");
  };

  const quitarItem = (i) => setItems(items.filter((_, idx) => idx !== i));
  const total = items.reduce((a, it) => a + it.cantidad * it.precio_unitario, 0);

  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-40">
      <div className="bg-white dark:bg-black rounded-2xl p-6 w-full max-w-md max-h-[90vh] overflow-y-auto">
        <h2 className="font-semibold text-slate-800 dark:text-white mb-4 font-display">Registrar fiado</h2>

        <label className="block text-xs font-semibold text-slate-500 dark:text-white uppercase mb-1">Cliente</label>
        <select value={clienteId} onChange={(e) => setClienteId(e.target.value)}
          className="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm text-slate-700 dark:text-white outline-none focus:border-[#E3A73B] mb-4">
          <option value="">Seleccioná un cliente...</option>
          {clientes.map(c => <option key={c.id} value={c.id}>{c.nombre}</option>)}
        </select>

        <label className="block text-xs font-semibold text-slate-500 dark:text-white uppercase mb-1">Agregar producto</label>
        <div className="flex gap-2 mb-3">
          <select value={productoSel} onChange={(e) => setProductoSel(e.target.value)}
            className="flex-1 min-w-0 px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm text-slate-700 dark:text-white outline-none focus:border-[#E3A73B]">
            <option value="">Producto...</option>
            {productos.map(p => <option key={p.id} value={p.id}>{p.nombre} (stock: {p.cantidad})</option>)}
          </select>
          <input type="number" value={cantidadSel} onChange={(e) => setCantidadSel(e.target.value)} placeholder="Cant."
            className="w-16 px-2 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm text-slate-700 dark:text-white outline-none focus:border-[#E3A73B]" />
          <button onClick={agregarItem} className="px-3 rounded-lg bg-[#16233D] text-white text-sm font-semibold">+</button>
        </div>

        <div className="space-y-1.5 mb-3">
          {items.map((it, i) => (
            <div key={i} className="flex items-center justify-between text-sm bg-slate-50 dark:bg-neutral-900 rounded-lg px-3 py-2">
              <span className="text-slate-700 dark:text-white">{it.nombre} x{it.cantidad}</span>
              <div className="flex items-center gap-2">
                <span className="font-mono text-slate-500 dark:text-white/60">C${(it.cantidad * it.precio_unitario).toFixed(2)}</span>
                <button onClick={() => quitarItem(i)} className="text-rose-500 text-xs">✕</button>
              </div>
            </div>
          ))}
          {items.length === 0 && <p className="text-sm text-slate-400 py-1">Agregá al menos un producto.</p>}
        </div>

        <div className="bg-slate-50 dark:bg-neutral-900 rounded-lg p-3 text-sm text-slate-700 dark:text-white flex items-center justify-between mb-4">
          <span>Total del fiado</span>
          <span className="font-mono font-bold">C${total.toFixed(2)}</span>
        </div>

        <div className="flex gap-2 justify-end">
          <button onClick={onCerrar} className="px-4 py-2 rounded-lg text-sm font-medium border border-slate-200 dark:border-white/10 text-slate-600 dark:text-white">Cancelar</button>
          <button disabled={guardando || !clienteId || items.length === 0} onClick={() => onGuardar({ cliente_id: clienteId, productos: items, total })}
            className="px-4 py-2 rounded-lg text-sm font-semibold bg-[#E3A73B] text-[#16233D] disabled:opacity-50 flex items-center gap-2">
            {guardando && <IconLoading />} Registrar fiado
          </button>
        </div>
      </div>
    </div>
  );
}

function PaginaCuentasPorCobrar({ clientes, pagosFiado, productos, cargando, error, onRecargar, onCrearCliente, onActualizarCliente, onEliminarCliente, onCrearFiado, onRegistrarPago }) {
  const [busqueda, setBusqueda] = useState("");
  const [modalCliente, setModalCliente] = useState(false);
  const [clienteEditando, setClienteEditando] = useState(null);
  const [modalFiado, setModalFiado] = useState(false);
  const [clienteAbono, setClienteAbono] = useState(null);
  const [clienteHistorial, setClienteHistorial] = useState(null);
  const [guardando, setGuardando] = useState(false);
  const [eliminandoId, setEliminandoId] = useState(null);

  const pagosPorCliente = {};
  const ultimaPorCliente = {};
  pagosFiado.forEach(p => {
    pagosPorCliente[p.cliente_id] = (pagosPorCliente[p.cliente_id] || 0) + Number(p.monto);
    if (!ultimaPorCliente[p.cliente_id] || new Date(p.creado_en) > new Date(ultimaPorCliente[p.cliente_id])) {
      ultimaPorCliente[p.cliente_id] = p.creado_en;
    }
  });

  const clientesFiltrados = clientes.filter(c => c.nombre.toLowerCase().includes(busqueda.toLowerCase()));
  const totalPorCobrar = clientes.reduce((a, c) => a + (Number(c.saldo_pendiente) || 0), 0);
  const clientesPendientes = clientes.filter(c => Number(c.saldo_pendiente) > 0).length;
  const ahora = new Date();
  const recuperadoMes = pagosFiado.filter(p => {
    const f = new Date(p.creado_en);
    return f.getFullYear() === ahora.getFullYear() && f.getMonth() === ahora.getMonth();
  }).reduce((a, p) => a + Number(p.monto), 0);

  const guardarCliente = async (form) => {
    setGuardando(true);
    try {
      if (clienteEditando) await onActualizarCliente(clienteEditando.id, { nombre: form.nombre.trim(), telefono: form.telefono.trim() });
      else await onCrearCliente({ nombre: form.nombre.trim(), telefono: form.telefono.trim(), saldo_pendiente: 0 });
      setModalCliente(false); setClienteEditando(null);
    } catch (e) { alert(e.message); }
    finally { setGuardando(false); }
  };

  const guardarFiado = async (datos) => {
    setGuardando(true);
    try {
      await onCrearFiado(datos);
      setModalFiado(false);
    } catch (e) { alert(e.message); }
    finally { setGuardando(false); }
  };

  const guardarAbono = async (monto) => {
    setGuardando(true);
    try {
      await onRegistrarPago(clienteAbono, monto);
      setClienteAbono(null);
    } catch (e) { alert(e.message); }
    finally { setGuardando(false); }
  };

  const eliminarCliente = async (cliente) => {
    if (!confirm(`¿Eliminar a ${cliente.nombre}? Esto borra su historial de fiados y pagos, y devuelve al inventario los productos de sus fiados pendientes. No se puede deshacer.`)) return;
    setEliminandoId(cliente.id);
    try { await onEliminarCliente(cliente); }
    catch (e) { alert(e.message); }
    finally { setEliminandoId(null); }
  };

  return (
    <div>
      <div className="flex items-center justify-between mb-4 gap-3 flex-wrap">
        <div>
          <h1 className="text-xl font-bold text-slate-800 dark:text-white font-display">Cuentas por cobrar</h1>
          <p className="text-sm text-slate-500 dark:text-white/60 mt-1">Fiados, saldos y abonos de tus clientes.</p>
        </div>
        <div className="flex gap-2">
          <button onClick={() => { setClienteEditando(null); setModalCliente(true); }} className="text-xs font-semibold px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 text-slate-600 dark:text-white/80 hover:bg-slate-50 dark:hover:bg-white/5">+ Cliente</button>
          <button onClick={() => setModalFiado(true)} className="text-xs font-semibold px-3 py-2 rounded-lg bg-[#E3A73B] text-[#16233D] hover:brightness-105">+ Registrar fiado</button>
        </div>
      </div>

      <div className="grid grid-cols-2 md:grid-cols-3 gap-3 mb-5">
        <StatCard label="Total por cobrar" value={`C$${totalPorCobrar.toFixed(2)}`} icon={IconCard} accent="bg-[#16233D]" />
        <StatCard label="Clientes pendientes" value={clientesPendientes} icon={IconUsers} accent="bg-amber-500" />
        <StatCard label="Recuperado este mes" value={`C$${recuperadoMes.toFixed(2)}`} icon={IconWallet} accent="bg-emerald-600" />
      </div>

      {error && <div className="bg-rose-50 dark:bg-rose-900/10 border border-rose-200 dark:border-rose-900/30 text-rose-600 dark:text-rose-400 text-sm rounded-lg p-3 mb-4">{error}</div>}

      <input value={busqueda} onChange={(e) => setBusqueda(e.target.value)} placeholder="Buscar cliente..."
        className="w-full px-3 py-2.5 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm text-slate-700 dark:text-white outline-none focus:border-[#E3A73B] mb-4" />

      {cargando ? (
        <p className="text-sm text-slate-400 py-6 text-center">Cargando clientes...</p>
      ) : clientesFiltrados.length === 0 ? (
        <p className="text-sm text-slate-400 py-6 text-center">{clientes.length === 0 ? "Todavía no tenés clientes registrados." : "No se encontraron clientes."}</p>
      ) : (
        <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
          {clientesFiltrados.map(c => (
            <TarjetaCliente key={c.id} cliente={c} totalPagado={pagosPorCliente[c.id] || 0} ultimaActividad={ultimaPorCliente[c.id]}
              onAbonar={() => setClienteAbono(c)} onHistorial={() => setClienteHistorial(c)}
              onEditar={() => { setClienteEditando(c); setModalCliente(true); }} onEliminar={() => eliminarCliente(c)} />
          ))}
        </div>
      )}

      <ModalCliente abierto={modalCliente} cliente={clienteEditando} guardando={guardando} onGuardar={guardarCliente} onCerrar={() => { setModalCliente(false); setClienteEditando(null); }} />
      <ModalNuevoFiado abierto={modalFiado} clientes={clientes} productos={productos} guardando={guardando} onGuardar={guardarFiado} onCerrar={() => setModalFiado(false)} />
      <ModalAbono abierto={!!clienteAbono} cliente={clienteAbono} guardando={guardando} onGuardar={guardarAbono} onCerrar={() => setClienteAbono(null)} />
      <ModalHistorialCliente abierto={!!clienteHistorial} cliente={clienteHistorial} pagos={pagosFiado} onCerrar={() => setClienteHistorial(null)} />
    </div>
  );
}

function PaginaConsumoHogar({ productos, registros, cargando, error, onRegistrar, onEliminar }) {
  const [productoId, setProductoId] = useState("");
  const [cantidad, setCantidad] = useState("");
  const [nota, setNota] = useState("");
  const [guardando, setGuardando] = useState(false);
  const [eliminandoId, setEliminandoId] = useState(null);

  const producto = productos.find(p => p.id === productoId);
  const cantidadNum = parseFloat(cantidad) || 0;
  const costoUnitario = producto ? Number(producto.costo) : 0;
  const costoTotal = costoUnitario * cantidadNum;

  const registrar = async () => {
    if (!producto || cantidadNum <= 0) { alert("Elegí un producto y una cantidad mayor a 0"); return; }
    if (cantidadNum > producto.cantidad) { alert(`Solo hay ${producto.cantidad} unidades de ${producto.nombre} en stock.`); return; }
    setGuardando(true);
    try {
      await onRegistrar({ producto, cantidad: cantidadNum, nota: nota.trim() });
      setProductoId(""); setCantidad(""); setNota("");
    } catch (e) { alert(e.message); }
    finally { setGuardando(false); }
  };

  const eliminarRegistro = async (registro) => {
    if (!confirm(`¿Eliminar este consumo de ${registro.producto_nombre}? Se devuelve la cantidad al inventario. No se puede deshacer.`)) return;
    setEliminandoId(registro.id);
    try { await onEliminar(registro); }
    catch (e) { alert(e.message); }
    finally { setEliminandoId(null); }
  };

  const hoy = new Date();
  const esHoy = (f) => new Date(f).toDateString() === hoy.toDateString();
  const esEsteMes = (f) => { const d = new Date(f); return d.getFullYear() === hoy.getFullYear() && d.getMonth() === hoy.getMonth(); };
  const esEsteAno = (f) => new Date(f).getFullYear() === hoy.getFullYear();

  const consumoHoy = registros.filter(r => esHoy(r.creado_en)).reduce((a, r) => a + Number(r.costo_total), 0);
  const consumoMes = registros.filter(r => esEsteMes(r.creado_en)).reduce((a, r) => a + Number(r.costo_total), 0);
  const consumoAno = registros.filter(r => esEsteAno(r.creado_en)).reduce((a, r) => a + Number(r.costo_total), 0);

  return (
    <div className="space-y-5">
      <div>
        <h1 className="text-xl font-bold text-slate-800 dark:text-white font-display">🏠 Consumo del hogar</h1>
        <p className="text-sm text-slate-500 dark:text-white/60 mt-1">Productos que la familia consume del negocio, sin afectar ventas, caja ni cuentas por cobrar.</p>
      </div>

      {error && <div className="bg-rose-50 dark:bg-rose-900/10 border border-rose-200 dark:border-rose-900/30 text-rose-600 dark:text-rose-400 text-sm rounded-lg p-3">{error}</div>}

      <div className="grid grid-cols-3 gap-3">
        <StatCard label="Consumo de hoy" value={`C$${consumoHoy.toFixed(2)}`} icon={IconHome} accent="bg-[#16233D]" />
        <StatCard label="Consumo del mes" value={`C$${consumoMes.toFixed(2)}`} icon={IconWallet} accent="bg-amber-500" />
        <StatCard label="Consumo del año" value={`C$${consumoAno.toFixed(2)}`} icon={IconChart} accent="bg-rose-500" />
      </div>

      <div className="bg-white dark:bg-neutral-900 border border-slate-200 dark:border-white/10 rounded-2xl p-5">
        <h2 className="font-semibold text-slate-800 dark:text-white text-sm mb-4">Registrar consumo</h2>
        <div className="grid sm:grid-cols-2 gap-3 mb-3">
          <div>
            <label className="block text-xs font-semibold text-slate-500 dark:text-white uppercase mb-1">Producto</label>
            <select value={productoId} onChange={(e) => setProductoId(e.target.value)}
              className="w-full px-3 py-2.5 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm text-slate-700 dark:text-white outline-none focus:border-[#E3A73B]">
              <option value="">Seleccioná un producto...</option>
              {productos.map(p => <option key={p.id} value={p.id}>{p.nombre} (stock: {p.cantidad})</option>)}
            </select>
          </div>
          <div>
            <label className="block text-xs font-semibold text-slate-500 dark:text-white uppercase mb-1">Cantidad</label>
            <input type="number" value={cantidad} onChange={(e) => setCantidad(e.target.value)} placeholder="0"
              className="w-full px-3 py-2.5 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm text-slate-700 dark:text-white outline-none focus:border-[#E3A73B]" />
          </div>
        </div>
        <label className="block text-xs font-semibold text-slate-500 dark:text-white uppercase mb-1">Nota (opcional)</label>
        <input value={nota} onChange={(e) => setNota(e.target.value)} placeholder="Ej. Desayuno, Almuerzo, Cena, Uso personal..."
          className="w-full px-3 py-2.5 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm text-slate-700 dark:text-white outline-none focus:border-[#E3A73B] mb-3" />

        {producto && cantidadNum > 0 && (
          <div className="bg-slate-50 dark:bg-black rounded-lg p-3 text-xs text-slate-500 dark:text-white mb-3">
            Costo (precio de compra, no de venta): C${costoUnitario.toFixed(2)} x {cantidadNum} = <b className="text-rose-600 dark:text-rose-400">C${costoTotal.toFixed(2)}</b>
          </div>
        )}

        <button disabled={guardando} onClick={registrar} className="w-full bg-[#E3A73B] text-[#16233D] font-semibold text-sm px-4 py-3 rounded-lg disabled:opacity-50 flex items-center justify-center gap-2">
          {guardando && <IconLoading />} Registrar consumo
        </button>
      </div>

      <div className="bg-white dark:bg-neutral-900 border border-slate-200 dark:border-white/10 rounded-2xl p-5">
        <h2 className="font-semibold text-slate-800 dark:text-white text-sm mb-3">Historial</h2>
        {cargando ? (
          <p className="text-sm text-slate-400 py-4 text-center">Cargando...</p>
        ) : registros.length === 0 ? (
          <p className="text-sm text-slate-400 py-4 text-center">Todavía no hay consumos registrados.</p>
        ) : (
          <div className="space-y-2">
            {registros.slice(0, 50).map(r => (
              <div key={r.id} className="flex items-center justify-between bg-slate-50 dark:bg-black rounded-lg p-3">
                <div>
                  <div className="text-sm font-medium text-slate-700 dark:text-white">{r.producto_nombre} x{r.cantidad}</div>
                  <div className="text-xs text-slate-400 dark:text-white/40">{r.nota ? `${r.nota} · ` : ""}{new Date(r.creado_en).toLocaleString()}</div>
                </div>
                <div className="flex items-center gap-3">
                  <div className="text-sm font-mono font-semibold text-rose-600 dark:text-rose-400">C${Number(r.costo_total).toFixed(2)}</div>
                  <button onClick={() => eliminarRegistro(r)} disabled={eliminandoId === r.id} title="Eliminar" className="text-slate-400 hover:text-rose-500 disabled:opacity-40 text-sm">🗑️</button>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

              {Object.keys(ROL_LABEL).map(r => <option key={r} value={r}>{ROL_LABEL[r]}</option>)}
            </select>
          </div>
        </div>
        <div className="flex gap-2 justify-end mt-5">
          <button onClick={onCerrar} className="px-4 py-2 rounded-lg text-sm font-medium border border-slate-200 dark:border-white/10 text-slate-600 dark:text-white">Cancelar</button>
          <button disabled={guardando || !form.nombre.trim() || !form.correo.trim()} onClick={() => onGuardar(form)}
            className="px-4 py-2 rounded-lg text-sm font-semibold bg-[#E3A73B] text-[#16233D] disabled:opacity-50 flex items-center gap-2">
            {guardando && <IconLoading />} Enviar invitación
          </button>

function PaginaUsuarios({ nombreNegocio }) {
  const [miembros, setMiembros] = useState([]);
  const [cargando, setCargando] = useState(true);
  const [error, setError] = useState(null);
  const [modalAbierto, setModalAbierto] = useState(false);
  const [guardando, setGuardando] = useState(false);

  const cargar = useCallback(async () => {
    try {
      setError(null);
      const datos = await supaApi.listarMiembros();
      setMiembros(datos);
    } catch (e) {
      setError(e.message || "No se pudieron cargar los usuarios.");
    } finally {
      setCargando(false);
    }
  }, []);

  useEffect(() => { cargar(); }, [cargar]);

  const invitar = async (form) => {
    setGuardando(true);
    try {
      const creado = await supaApi.crearMiembro({
        nombre: form.nombre.trim(), correo: form.correo.trim().toLowerCase(), telefono: form.telefono.trim(),
        rol: form.rol, estado: "invitado", nombre_negocio: nombreNegocio.trim() || "el negocio",
      });
      setModalAbierto(false);
      await cargar();
      const nuevo = creado && creado[0];
      if (nuevo && nuevo.telefono) window.open(enlaceWhatsapp(nuevo), "_blank");
    } catch (e) { alert(e.message); }
    finally { setGuardando(false); }
  };

  const cambiarRol = async (miembro, rol) => {
    try { await supaApi.actualizarMiembro(miembro.id, { rol }); await cargar(); }
    catch (e) { alert(e.message); }
  };

  const quitarAcceso = async (miembro) => {
    if (!confirm(`¿Quitar el acceso de ${miembro.nombre || miembro.correo}?`)) return;
    try { await supaApi.eliminarMiembro(miembro.id); await cargar(); }
    catch (e) { alert(e.message); }
  };

  const enlaceWhatsapp = (m) => {
    const mensaje = `Hola ${m.nombre || ""}! 👋 Te invito a usar la app de nuestro negocio, Nova.

1️⃣ Abrí este enlace: https://mi-negocio-khaki.vercel.app
2️⃣ Tocá "Crear cuenta"
3️⃣ Usá este correo: ${m.correo}
4️⃣ Ponés la contraseña que vos quieras
5️⃣ En cuanto entrés, te va a aparecer un mensaje de bienvenida — tocá el botón dorado y listo, ya vas a estar adentro`;
    const telefonoLimpio = (m.telefono || "").replace(/\D/g, "");
    const numero = telefonoLimpio ? (telefonoLimpio.length <= 8 ? `505${telefonoLimpio}` : telefonoLimpio) : "";
    return `https://wa.me/${numero}?text=${encodeURIComponent(mensaje)}`;
  };

  return (
    <div>
      <div className="flex items-center justify-between mb-4 gap-3 flex-wrap">
        <div>
          <h1 className="text-xl font-bold text-slate-800 dark:text-white font-display">Usuarios</h1>
          <p className="text-sm text-slate-500 dark:text-white/60 mt-1">Quién puede entrar a {nombreNegocio.trim() || "tu negocio"} y qué puede hacer.</p>
        </div>
        <button onClick={() => setModalAbierto(true)} className="text-xs font-semibold px-3 py-2 rounded-lg bg-[#E3A73B] text-[#16233D] hover:brightness-105">+ Agregar usuario</button>
      </div>

      {error && <div className="bg-rose-50 dark:bg-rose-900/10 border border-rose-200 dark:border-rose-900/30 text-rose-600 dark:text-rose-400 text-sm rounded-lg p-3 mb-4">{error}</div>}

      {cargando ? (
        <p className="text-sm text-slate-400 py-6 text-center">Cargando...</p>
      ) : (
        <div className="space-y-2">
          <div className="bg-white dark:bg-neutral-900 border border-slate-200 dark:border-white/10 rounded-2xl p-4 flex items-center justify-between">
            <div>
              <div className="font-semibold text-slate-800 dark:text-white">Vos</div>
              <div className="text-xs text-slate-400 dark:text-white/40">Administrador principal</div>
            </div>
            <Badge tone="ok">Administrador</Badge>
          </div>
          {miembros.map(m => (
            <div key={m.id} className="bg-white dark:bg-neutral-900 border border-slate-200 dark:border-white/10 rounded-2xl p-4 flex items-center justify-between gap-3 flex-wrap">
              <div className="min-w-0">
                <div className="font-semibold text-slate-800 dark:text-white truncate">{m.nombre || m.correo}</div>
                <div className="text-xs text-slate-400 dark:text-white/40 truncate">{m.correo}{m.telefono ? ` · ${m.telefono}` : ""}</div>
              </div>
              <div className="flex items-center gap-2 shrink-0">
                <Badge tone={m.estado === "activo" ? "ok" : "warn"}>{m.estado === "activo" ? "Activo" : "Invitado"}</Badge>
                <select value={m.rol} onChange={(e) => cambiarRol(m, e.target.value)}
                  className="text-xs px-2 py-1.5 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-slate-700 dark:text-white outline-none">
                  {Object.keys(ROL_LABEL).map(r => <option key={r} value={r}>{ROL_LABEL[r]}</option>)}
                </select>
                {m.estado !== "activo" && (
                  <a href={enlaceWhatsapp(m)} target="_blank" rel="noopener noreferrer" title="Enviar invitación por WhatsApp"
                    className="text-xs px-2.5 py-1.5 rounded-lg bg-emerald-500 text-white font-medium hover:brightness-105">📲 WhatsApp</a>
                )}
                <button onClick={() => quitarAcceso(m)} title="Quitar acceso" className="text-xs px-2.5 py-1.5 rounded-lg border border-rose-200 dark:border-rose-900/30 text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-900/10">🗑️</button>
              </div>
            </div>
          ))}
          {miembros.length === 0 && <p className="text-sm text-slate-400 py-4 text-center">Todavía no invitaste a nadie más.</p>}
        </div>
      )}

      <ModalMiembro abierto={modalAbierto} guardando={guardando} onGuardar={invitar} onCerrar={() => setModalAbierto(false)} />
    </div>
  );
}

function PaginaCaja() {
  const [sesion, setSesion] = useState(null);
  const [movimientos, setMovimientos] = useState([]);
  const [historial, setHistorial] = useState([]);
  const [cargando, setCargando] = useState(true);
  const [error, setError] = useState(null);
  const [montoApertura, setMontoApertura] = useState("");
  const [nuevoTipo, setNuevoTipo] = useState("ingreso");
  const [nuevaDescripcion, setNuevaDescripcion] = useState("");
  const [nuevoMonto, setNuevoMonto] = useState("");
  const [procesando, setProcesando] = useState(false);

  const cargarTodo = useCallback(async () => {
    try {
      setError(null);
      const s = await supaApi.obtenerSesionAbierta();
      setSesion(s);
      if (s) {
        const movs = await supaApi.listarMovimientos(s.id);
        setMovimientos(movs);
      } else {
        setMovimientos([]);
        const h = await supaApi.listarSesionesCerradas();
        setHistorial(h);
      }
    } catch (e) {
      setError("No se pudo conectar con la caja. Revisá tu conexión a internet.");
    } finally {
      setCargando(false);
    }
  }, []);

  useEffect(() => { cargarTodo(); }, [cargarTodo]);

  const totalIngresos = movimientos.filter(m => m.tipo === "ingreso").reduce((a, m) => a + Number(m.monto), 0);
  const totalGastos = movimientos.filter(m => m.tipo === "gasto").reduce((a, m) => a + Number(m.monto), 0);
  const saldoActual = sesion ? Number(sesion.monto_inicial) + totalIngresos - totalGastos : 0;

  const abrirCaja = async () => {
    const monto = parseFloat(montoApertura) || 0;
    setProcesando(true);
    try {
      await supaApi.abrirCaja(monto);
      setMontoApertura("");
      await cargarTodo();
    } catch (e) { alert(e.message); }
    finally { setProcesando(false); }
  };

  const registrarMovimiento = async () => {
    const monto = parseFloat(nuevoMonto) || 0;
    if (monto <= 0) { alert("Poné un monto mayor a 0"); return; }
    setProcesando(true);
    try {
      await supaApi.crearMovimiento({ sesion_id: sesion.id, tipo: nuevoTipo, descripcion: nuevaDescripcion.trim(), monto });
      setNuevaDescripcion(""); setNuevoMonto("");
      await cargarTodo();
    } catch (e) { alert(e.message); }
    finally { setProcesando(false); }
  };

  const cerrarCaja = async () => {
    if (!confirm(`¿Cerrar la caja con un saldo final de C$${saldoActual.toFixed(2)}?`)) return;
    setProcesando(true);
    try {
      await supaApi.cerrarCaja(sesion.id, saldoActual);
      await cargarTodo();
    } catch (e) { alert(e.message); }
    finally { setProcesando(false); }
  };

  const eliminarMovimiento = async (m) => {
    if (!confirm("¿Eliminar este movimiento? No se puede deshacer.")) return;
    try { await supaApi.eliminarMovimiento(m.id); await cargarTodo(); }
    catch (e) { alert(e.message); }
  };

  const eliminarSesionHistorial = async (h) => {
    if (!confirm("¿Eliminar esta caja del historial? No se puede deshacer.")) return;
    try { await supaApi.eliminarSesionCaja(h.id); await cargarTodo(); }
    catch (e) { alert(e.message); }
  };

  if (cargando) return <div className="flex items-center justify-center py-16 text-slate-400 gap-2 text-sm"><IconLoading /> Cargando caja...</div>;

  return (
    <div className="space-y-5">
      <div>
        <h1 className="text-xl font-bold text-slate-800 dark:text-white font-display">Control de caja</h1>
        <p className="text-sm text-slate-500 dark:text-white mt-1">Registrá entradas y salidas de dinero del día.</p>
      </div>

      {error && <div className="bg-rose-50 dark:bg-rose-900/20 border border-rose-200 dark:border-rose-800 text-rose-700 dark:text-rose-300 text-sm rounded-lg p-3">{error}</div>}

      {!sesion ? (
        <div className="bg-white dark:bg-black border border-slate-200 dark:border-white/10 rounded-2xl p-6 max-w-sm">
          <h2 className="font-semibold text-slate-800 dark:text-white mb-3">Abrir caja</h2>
          <label className="block text-xs font-semibold text-slate-500 dark:text-white uppercase mb-1">Monto inicial (efectivo con el que abrís)</label>
          <input type="number" value={montoApertura} onChange={(e) => setMontoApertura(e.target.value)}
            className="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm mb-3 outline-none focus:border-[#E3A73B]" placeholder="0" />
          <button disabled={procesando} onClick={abrirCaja} className="w-full bg-[#E3A73B] text-[#16233D] font-semibold text-sm px-4 py-2 rounded-lg disabled:opacity-50 flex items-center justify-center gap-2">
            {procesando && <IconLoading />} Abrir caja
          </button>

          {historial.length > 0 && (
            <div className="mt-6 pt-4 border-t border-slate-100 dark:border-white/10">
              <h3 className="text-xs font-semibold text-slate-500 dark:text-white uppercase mb-2">Cajas anteriores</h3>
              <div className="space-y-2">
                {historial.map(h => (
                  <div key={h.id} className="flex justify-between items-center text-xs text-slate-500 dark:text-white py-1">
                    <span>{new Date(h.fecha_cierre).toLocaleDateString()}</span>
                    <div className="flex items-center gap-2">
                      <span className="font-mono">C${Number(h.monto_inicial).toFixed(2)} → C${Number(h.monto_final).toFixed(2)}</span>
                      <button onClick={() => eliminarSesionHistorial(h)} className="text-slate-400 hover:text-rose-500">🗑️</button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      ) : (
        <div className="space-y-5">
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
            <StatCard label="Monto inicial" value={`C$${Number(sesion.monto_inicial).toFixed(2)}`} icon={IconWallet} accent="bg-[#16233D]" />
            <StatCard label="Ingresos" value={`C$${totalIngresos.toFixed(2)}`} icon={IconChart} accent="bg-emerald-600" />
            <StatCard label="Gastos" value={`C$${totalGastos.toFixed(2)}`} icon={IconAlert} accent="bg-rose-600" />
            <StatCard label="Saldo actual" value={`C$${saldoActual.toFixed(2)}`} icon={IconCart} accent="bg-[#2471A3]" />
          </div>

          <div className="grid lg:grid-cols-2 gap-4">
            <div className="bg-white dark:bg-black border border-slate-200 dark:border-white/10 rounded-2xl p-5">
              <h2 className="font-semibold text-slate-800 dark:text-white text-sm mb-3">Registrar movimiento</h2>
              <div className="flex gap-2 mb-3">
                <button onClick={() => setNuevoTipo("ingreso")} className={`flex-1 py-2 rounded-lg text-sm font-medium ${nuevoTipo === "ingreso" ? "bg-emerald-600 text-white" : "bg-slate-100 dark:bg-neutral-900 text-slate-600 dark:text-white"}`}>Entrada</button>
                <button onClick={() => setNuevoTipo("gasto")} className={`flex-1 py-2 rounded-lg text-sm font-medium ${nuevoTipo === "gasto" ? "bg-rose-600 text-white" : "bg-slate-100 dark:bg-neutral-900 text-slate-600 dark:text-white"}`}>Salida</button>
              </div>
              <label className="block text-xs font-semibold text-slate-500 dark:text-white uppercase mb-1">Descripción</label>
              <input value={nuevaDescripcion} onChange={(e) => setNuevaDescripcion(e.target.value)} placeholder="Ej: Venta del día, compra de bolsas..."
                className="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm mb-3 outline-none focus:border-[#E3A73B]" />
              <label className="block text-xs font-semibold text-slate-500 dark:text-white uppercase mb-1">Monto</label>
              <input type="number" value={nuevoMonto} onChange={(e) => setNuevoMonto(e.target.value)} placeholder="0"
                className="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm mb-3 outline-none focus:border-[#E3A73B]" />
              <button disabled={procesando} onClick={registrarMovimiento} className="w-full bg-[#E3A73B] text-[#16233D] font-semibold text-sm px-4 py-2 rounded-lg disabled:opacity-50 flex items-center justify-center gap-2">
                {procesando && <IconLoading />} Registrar
              </button>
              <button disabled={procesando} onClick={cerrarCaja} className="w-full mt-2 border border-rose-300 dark:border-rose-800 text-rose-600 dark:text-rose-400 font-semibold text-sm px-4 py-2 rounded-lg">
                Cerrar caja
              </button>
            </div>

            <div className="bg-white dark:bg-black border border-slate-200 dark:border-white/10 rounded-2xl p-5">
              <h2 className="font-semibold text-slate-800 dark:text-white text-sm mb-3">Movimientos de hoy</h2>
              <div className="space-y-2 max-h-96 overflow-y-auto">
                {movimientos.length === 0 && <p className="text-sm text-slate-400 text-center py-6">Todavía no hay movimientos</p>}
                {movimientos.map(m => (
                  <div key={m.id} className="flex justify-between items-center py-2 px-3 rounded-lg bg-slate-50 dark:bg-neutral-900">
                    <div>
                      <div className="text-sm font-medium text-slate-700 dark:text-white">{m.descripcion || (m.tipo === "ingreso" ? "Entrada de dinero" : "Salida de dinero")}</div>
                      <div className="text-xs text-slate-400 font-mono">{new Date(m.creado_en).toLocaleTimeString()}</div>
                    </div>
                    <div className="flex items-center gap-2">
                      <div className={`font-mono font-semibold text-sm ${m.tipo === "ingreso" ? "text-emerald-600 dark:text-emerald-400" : "text-rose-600 dark:text-rose-400"}`}>
                        {m.tipo === "ingreso" ? "+" : "-"}C${Number(m.monto).toFixed(2)}
                      </div>
                      <button onClick={() => eliminarMovimiento(m)} className="text-slate-400 hover:text-rose-500 text-sm">🗑️</button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function PaginaPerdidas({ productos, onActualizarProducto, onRecargarProductos }) {
  const [perdidas, setPerdidas] = useState([]);
  const [cargando, setCargando] = useState(true);
  const [error, setError] = useState(null);
  const [productoId, setProductoId] = useState("");
  const [cantidad, setCantidad] = useState("");
  const [motivo, setMotivo] = useState("dañado");
  const [procesando, setProcesando] = useState(false);

  const cargar = useCallback(async () => {
    try {
      setError(null);
      const datos = await supaApi.listarPerdidas();
      setPerdidas(datos);
    } catch (e) {
      setError("No se pudo conectar. Revisá tu conexión a internet.");
    } finally {
      setCargando(false);
    }
  }, []);

  useEffect(() => { cargar(); }, [cargar]);

  const productoSeleccionado = productos.find(p => p.id === productoId);
  const cantidadNum = parseFloat(cantidad) || 0;
  const valorPerdido = productoSeleccionado ? productoSeleccionado.costo * cantidadNum : 0;

  const registrar = async () => {
    if (!productoSeleccionado) { alert("Elegí un producto"); return; }
    if (cantidadNum <= 0) { alert("Poné una cantidad mayor a 0"); return; }
    setProcesando(true);
    try {
      await supaApi.registrarPerdida({
        producto_id: productoSeleccionado.id,
        producto_nombre: productoSeleccionado.nombre,
        cantidad: cantidadNum,
        motivo,
        valor_perdido: valorPerdido,
      });
      const nuevaCantidad = Math.max(0, productoSeleccionado.cantidad - cantidadNum);
      await onActualizarProducto(productoSeleccionado.id, { cantidad: nuevaCantidad });
      setProductoId(""); setCantidad("");
      await cargar();
      await onRecargarProductos();
    } catch (e) { alert(e.message); }
    finally { setProcesando(false); }
  };

  const totalPerdido = perdidas.reduce((a, p) => a + Number(p.valor_perdido), 0);

  const eliminarPerdida = async (p) => {
    if (!confirm(`¿Eliminar esta pérdida de ${p.producto_nombre}? Se devuelve la cantidad al inventario.`)) return;
    try {
      const producto = productos.find(prod => prod.id === p.producto_id);
      if (producto) await onActualizarProducto(producto.id, { cantidad: producto.cantidad + Number(p.cantidad) });
      await supaApi.eliminarPerdida(p.id);
      await cargar();
      await onRecargarProductos();
    } catch (e) { alert(e.message); }
  };

  return (
    <div className="space-y-5">
      <div>
        <h1 className="text-xl font-bold text-slate-800 dark:text-white font-display">Pérdidas</h1>
        <p className="text-sm text-slate-500 dark:text-white mt-1">Registrá productos dañados, perdidos o vencidos — se descuentan del inventario.</p>
      </div>

      {error && <div className="bg-rose-50 dark:bg-rose-900/20 border border-rose-200 dark:border-rose-800 text-rose-700 dark:text-rose-300 text-sm rounded-lg p-3">{error}</div>}

      <div className="grid lg:grid-cols-3 gap-4">
        <div className="bg-white dark:bg-black border border-slate-200 dark:border-white/10 rounded-2xl p-5">
          <h2 className="font-semibold text-slate-800 dark:text-white text-sm mb-3">Registrar pérdida</h2>
          <label className="block text-xs font-semibold text-slate-500 dark:text-white uppercase mb-1">Producto</label>
          <select value={productoId} onChange={(e) => setProductoId(e.target.value)}
            className="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm mb-3 outline-none focus:border-[#E3A73B]">
            <option value="">Seleccioná un producto</option>
            {productos.map(p => <option key={p.id} value={p.id}>{p.nombre} (stock: {p.cantidad})</option>)}
          </select>
          <label className="block text-xs font-semibold text-slate-500 dark:text-white uppercase mb-1">Cantidad perdida</label>
          <input type="number" value={cantidad} onChange={(e) => setCantidad(e.target.value)} placeholder="0"
            className="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm mb-3 outline-none focus:border-[#E3A73B]" />
          <label className="block text-xs font-semibold text-slate-500 dark:text-white uppercase mb-1">Motivo</label>
          <select value={motivo} onChange={(e) => setMotivo(e.target.value)}
            className="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm mb-3 outline-none focus:border-[#E3A73B]">
            <option value="dañado">Producto dañado</option>
            <option value="perdido">Producto perdido</option>
            <option value="vencido">Producto vencido</option>
          </select>
          {productoSeleccionado && cantidadNum > 0 && (
            <div className="bg-rose-50 dark:bg-rose-900/20 rounded-lg p-3 text-xs text-rose-700 dark:text-rose-300 mb-3">
              Valor perdido estimado: <b>C${valorPerdido.toFixed(2)}</b>
            </div>
          )}
          <button disabled={procesando} onClick={registrar} className="w-full bg-rose-600 text-white font-semibold text-sm px-4 py-2 rounded-lg disabled:opacity-50 flex items-center justify-center gap-2">
            {procesando && <IconLoading />} Registrar pérdida
          </button>
        </div>

        <div className="lg:col-span-2 space-y-4">
          <StatCard label="Total perdido acumulado" value={`C$${totalPerdido.toFixed(2)}`} icon={IconAlert} accent="bg-rose-600" />
          <div className="bg-white dark:bg-black border border-slate-200 dark:border-white/10 rounded-2xl p-5">
            <h2 className="font-semibold text-slate-800 dark:text-white text-sm mb-3">Historial de pérdidas</h2>
            {cargando ? (
              <div className="flex items-center gap-2 text-sm text-slate-400 py-4"><IconLoading /> Cargando...</div>
            ) : perdidas.length === 0 ? (
              <p className="text-sm text-slate-400 text-center py-6">Todavía no hay pérdidas registradas 👍</p>
            ) : (
              <div className="space-y-2 max-h-96 overflow-y-auto">
                {perdidas.map(p => (
                  <div key={p.id} className="flex justify-between items-center py-2 px-3 rounded-lg bg-rose-50/60 dark:bg-rose-900/10">
                    <div>
                      <div className="text-sm font-medium text-slate-700 dark:text-white">{p.producto_nombre}</div>
                      <div className="text-xs text-slate-400">{p.motivo} · {p.cantidad} u. · {new Date(p.creado_en).toLocaleString()}</div>
                    </div>
                    <div className="flex items-center gap-2">
                      <div className="font-mono font-semibold text-sm text-rose-600 dark:text-rose-400">-C${Number(p.valor_perdido).toFixed(2)}</div>
                      <button onClick={() => eliminarPerdida(p)} className="text-slate-400 hover:text-rose-500 text-sm">🗑️</button>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

function ModalProducto({ abierto, producto, onGuardar, onCerrar, guardando }) {
  const [form, setForm] = useState({ nombre: "", categoria: "", costo: "", venta: "", cantidad: "", minimo: "" });

  useEffect(() => {
    if (producto) {
      setForm({ nombre: producto.nombre, categoria: producto.categoria || "", costo: producto.costo, venta: producto.venta, cantidad: producto.cantidad, minimo: producto.minimo });
    } else {
      setForm({ nombre: "", categoria: "", costo: "", venta: "", cantidad: "", minimo: "" });
    }
  }, [producto, abierto]);

  if (!abierto) return null;
  const costoNum = parseFloat(form.costo) || 0;
  const ventaNum = parseFloat(form.venta) || 0;
  const ganancia = ventaNum - costoNum;
  const margen = costoNum > 0 ? ((ganancia / costoNum) * 100).toFixed(0) : 0;

  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-40">
      <div className="bg-white dark:bg-black rounded-2xl p-6 w-full max-w-sm max-h-[90vh] overflow-y-auto">
        <h2 className="font-semibold text-slate-800 dark:text-white mb-4 font-display">{producto ? "Editar producto" : "Agregar producto"}</h2>
        <div className="space-y-3">
          {[
            { key: "nombre", label: "Nombre del producto", type: "text" },
            { key: "categoria", label: "Categoría (opcional)", type: "text" },
            { key: "costo", label: "Precio de costo", type: "number" },
            { key: "venta", label: "Precio de venta", type: "number" },
            { key: "cantidad", label: "Cantidad en stock", type: "number" },
            { key: "minimo", label: "Alertar cuando queden menos de", type: "number" },
          ].map((campo) => (
            <div key={campo.key}>
              <label className="block text-xs font-semibold text-slate-500 dark:text-white uppercase mb-1">{campo.label}</label>
              <input
                type={campo.type}
                value={form[campo.key]}
                onChange={(e) => setForm({ ...form, [campo.key]: e.target.value })}
                className="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm text-slate-700 dark:text-white outline-none focus:border-[#E3A73B]"
              />
            </div>
          ))}
          <div className="bg-slate-50 dark:bg-neutral-900 rounded-lg p-3 text-xs text-slate-500 dark:text-white">
            Ganancia: <b className="text-emerald-600 dark:text-emerald-400">C${ganancia.toFixed(2)}</b> · Margen: <b className="text-emerald-600 dark:text-emerald-400">{margen}%</b>
          </div>
        </div>
        <div className="flex gap-2 justify-end mt-5">
          <button onClick={onCerrar} className="px-4 py-2 rounded-lg text-sm font-medium border border-slate-200 dark:border-white/10 text-slate-600 dark:text-white">Cancelar</button>
          <button disabled={guardando || !form.nombre.trim()} onClick={() => onGuardar(form)} className="px-4 py-2 rounded-lg text-sm font-semibold bg-[#E3A73B] text-[#16233D] disabled:opacity-50 flex items-center gap-2">
            {guardando && <IconLoading />} Guardar
          </button>
        </div>
      </div>
    </div>
  );
}

function PaginaInventario({ productos, cargando, error, onRecargar, onCrear, onActualizar, onEliminar, onVentaRegistrada, verCostos = true, puedeEditar = true }) {
  const [busqueda, setBusqueda] = useState("");
  const [modalAbierto, setModalAbierto] = useState(false);
  const [productoEditando, setProductoEditando] = useState(null);
  const [guardando, setGuardando] = useState(false);

  const filtrados = productos.filter(p => p.nombre.toLowerCase().includes(busqueda.toLowerCase()));
  const abrirNuevo = () => { setProductoEditando(null); setModalAbierto(true); };
  const abrirEditar = (p) => { setProductoEditando(p); setModalAbierto(true); };

  const guardar = async (form) => {
    setGuardando(true);
    try {
      const datos = {
        nombre: form.nombre.trim(), categoria: form.categoria.trim(),
        costo: parseFloat(form.costo) || 0, venta: parseFloat(form.venta) || 0,
        cantidad: parseFloat(form.cantidad) || 0, minimo: parseFloat(form.minimo) || 0,
      };
      if (productoEditando) await onActualizar(productoEditando.id, datos);
      else await onCrear(datos);
      setModalAbierto(false);
    } catch (e) { alert(e.message); }
    finally { setGuardando(false); }
  };

  const vender = async (p, cant = 1) => {
    const nuevaCantidad = Math.max(0, p.cantidad - cant);
    const nuevaGanancia = (p.ganancia_acumulada || 0) + (p.venta - p.costo) * cant;
    const nuevosVendidos = (p.vendidos || 0) + cant;
    await onActualizar(p.id, { cantidad: nuevaCantidad, ganancia_acumulada: nuevaGanancia, vendidos: nuevosVendidos });
    await onVentaRegistrada({
      producto_id: p.id, producto_nombre: p.nombre, cantidad: cant,
      precio_venta: p.venta, precio_costo: p.costo, ganancia: (p.venta - p.costo) * cant,
    });
  };

  return (
    <div className="space-y-5">
      <div className="flex items-center justify-between flex-wrap gap-3">
        <div>
          <h1 className="text-xl font-bold text-slate-800 dark:text-white font-display">Inventario</h1>
          <p className="text-sm text-slate-500 dark:text-white mt-1">Conectado a la base de datos en la nube — se sincroniza entre dispositivos.</p>
        </div>
        <div className="flex gap-2">
          <button onClick={onRecargar} className="flex items-center gap-2 border border-slate-200 dark:border-white/10 text-slate-600 dark:text-white font-medium text-sm px-3 py-2 rounded-lg">
            <IconRefresh className={cargando ? "animate-spin inline-block" : "inline-block"} />
          </button>
          {puedeEditar && (
            <button onClick={abrirNuevo} className="flex items-center gap-2 bg-[#E3A73B] text-[#16233D] font-semibold text-sm px-4 py-2 rounded-lg hover:brightness-105">
              <IconPlus /> Agregar producto
            </button>
          )}
        </div>
      </div>

      {error && <div className="bg-rose-50 dark:bg-rose-900/20 border border-rose-200 dark:border-rose-800 text-rose-700 dark:text-rose-300 text-sm rounded-lg p-3">{error}</div>}

      <div className="relative max-w-xs">
        <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><IconSearch /></span>
        <input value={busqueda} onChange={(e) => setBusqueda(e.target.value)} placeholder="Buscar producto..."
          className="w-full pl-9 pr-3 py-2 rounded-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-black text-sm text-slate-700 dark:text-white outline-none focus:border-[#E3A73B]" />
      </div>

      {cargando && productos.length === 0 ? (
        <div className="flex items-center justify-center py-16 text-slate-400 gap-2 text-sm"><IconLoading /> Cargando inventario...</div>
      ) : filtrados.length === 0 ? (
        <div className="text-center py-16 text-slate-400 text-sm">{productos.length === 0 ? "Todavía no hay productos — agregá el primero." : "Sin resultados para tu búsqueda."}</div>
      ) : (
        <div className="bg-white dark:bg-black border border-slate-200 dark:border-white/10 rounded-2xl overflow-hidden overflow-x-auto">
          <table className="w-full text-sm">
            <thead>
              <tr className="bg-[#16233D] text-white text-xs uppercase tracking-wide">
                <th className="text-left px-4 py-3 font-semibold">Producto</th>
                <th className="text-left px-4 py-3 font-semibold hidden sm:table-cell">Categoría</th>
                <th className="text-right px-4 py-3 font-semibold">Stock</th>
                {verCostos && <th className="text-right px-4 py-3 font-semibold hidden md:table-cell">Costo</th>}
                <th className="text-right px-4 py-3 font-semibold">Venta</th>
                {verCostos && <th className="text-right px-4 py-3 font-semibold hidden md:table-cell">Margen</th>}
                <th className="text-center px-4 py-3 font-semibold">Estado</th>
                <th className="px-4 py-3"></th>
              </tr>
            </thead>
            <tbody>
              {filtrados.map((p, i) => {
                const bajo = p.cantidad <= p.minimo;
                const margen = p.costo > 0 ? ((p.venta - p.costo) / p.costo * 100).toFixed(0) : 0;
                return (
                  <tr key={p.id} className={`border-t border-slate-100 dark:border-white/10 ${i % 2 === 1 ? "bg-slate-50/60 dark:bg-black" : ""}`}>
                    <td className="px-4 py-3 font-medium text-slate-700 dark:text-white">{p.nombre}</td>
                    <td className="px-4 py-3 text-slate-500 dark:text-white hidden sm:table-cell">{p.categoria}</td>
                    <td className="px-4 py-3 text-right font-mono text-slate-700 dark:text-white">{p.cantidad}</td>
                    {verCostos && <td className="px-4 py-3 text-right font-mono text-slate-500 dark:text-white hidden md:table-cell">C${Number(p.costo).toFixed(2)}</td>}
                    <td className="px-4 py-3 text-right font-mono text-slate-700 dark:text-white">C${Number(p.venta).toFixed(2)}</td>
                    {verCostos && <td className="px-4 py-3 text-right font-mono text-emerald-600 dark:text-emerald-400 hidden md:table-cell">{margen}%</td>}
                    <td className="px-4 py-3 text-center">{bajo ? <Badge tone="danger">Stock bajo</Badge> : <Badge tone="ok">Bien</Badge>}</td>
                    <td className="px-4 py-3">
                      <div className="flex gap-1 justify-end">
                        {puedeEditar && <button onClick={() => vender(p, 1)} className="text-xs px-2 py-1 rounded bg-[#2471A3] text-white font-medium">-1</button>}
                        {puedeEditar && <button onClick={() => abrirEditar(p)} className="text-xs px-2 py-1 rounded border border-slate-200 dark:border-white/20 text-slate-600 dark:text-white">Editar</button>}
                        {puedeEditar && <button onClick={() => { if (confirm("¿Eliminar este producto?")) onEliminar(p.id); }} className="text-xs px-2 py-1 rounded text-rose-600 dark:text-rose-400">Eliminar</button>}
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
      <ModalProducto abierto={modalAbierto} producto={productoEditando} onGuardar={guardar} onCerrar={() => setModalAbierto(false)} guardando={guardando} />
    </div>
  );
}

function PaginaHistorial({ productos, onActualizarProducto, onRecargarProductos }) {
  const [eventos, setEventos] = useState([]);
  const [cargando, setCargando] = useState(true);
  const [error, setError] = useState(null);
  const [filtro, setFiltro] = useState("todos");

  const cargar = useCallback(async () => {
    try {
      setError(null);
      const [ventas, perdidas, movimientos, productosDb] = await Promise.all([
        supaApi.listarVentas(),
        supaApi.listarPerdidas(),
        supaApi.listarTodosMovimientosCaja(),
        supaApi.listarProductos(),
      ]);

      const items = [
        ...ventas.map(v => ({
          id: v.id, tipo: "venta", fecha: v.creado_en, raw: v,
          descripcion: `Venta: ${v.cantidad} u. de ${v.producto_nombre}`,
          monto: v.cantidad * v.precio_venta, positivo: true,
        })),
        ...perdidas.map(p => ({
          id: p.id, tipo: "perdida", fecha: p.creado_en, raw: p,
          descripcion: `Pérdida (${p.motivo}): ${p.cantidad} u. de ${p.producto_nombre}`,
          monto: p.valor_perdido, positivo: false,
        })),
        ...movimientos.map(m => ({
          id: m.id, tipo: m.tipo === "ingreso" ? "dinero_entrada" : "dinero_salida", fecha: m.creado_en, raw: m,
          descripcion: m.descripcion || (m.tipo === "ingreso" ? "Entrada de dinero" : "Salida de dinero"),
          monto: m.monto, positivo: m.tipo === "ingreso",
        })),
        ...productosDb.map(p => ({
          id: p.id, tipo: "producto_agregado", fecha: p.creado_en, raw: p,
          descripcion: `Producto agregado: ${p.nombre}`,
          monto: null, positivo: true,
        })),
      ].sort((a, b) => new Date(b.fecha) - new Date(a.fecha));

      setEventos(items);
    } catch (e) {
      setError("No se pudo cargar el historial. Revisá tu conexión a internet.");
    } finally {
      setCargando(false);
    }
  }, []);

  useEffect(() => { cargar(); }, [cargar]);

  const eliminarEvento = async (e) => {
    if (e.tipo === "producto_agregado") { alert("Para eliminar un producto, hacelo desde Inventario."); return; }
    if (!confirm("¿Eliminar este registro? No se puede deshacer.")) return;
    try {
      if (e.tipo === "venta") {
        const producto = productos.find(p => p.id === e.raw.producto_id);
        if (producto) {
          await onActualizarProducto(producto.id, {
            cantidad: producto.cantidad + Number(e.raw.cantidad),
            ganancia_acumulada: Math.max(0, (producto.ganancia_acumulada || 0) - Number(e.raw.ganancia)),
            vendidos: Math.max(0, (producto.vendidos || 0) - Number(e.raw.cantidad)),
          });
        }
        await supaApi.eliminarVenta(e.raw.id);
        await onRecargarProductos();
      } else if (e.tipo === "perdida") {
        const producto = productos.find(p => p.id === e.raw.producto_id);
        if (producto) await onActualizarProducto(producto.id, { cantidad: producto.cantidad + Number(e.raw.cantidad) });
        await supaApi.eliminarPerdida(e.raw.id);
        await onRecargarProductos();
      } else {
        await supaApi.eliminarMovimiento(e.raw.id);
      }
      await cargar();
    } catch (err) { alert(err.message); }
  };

  const tiposLabel = {
    venta: "Ventas", perdida: "Pérdidas", dinero_entrada: "Entradas de dinero",
    dinero_salida: "Salidas de dinero", producto_agregado: "Productos agregados",
  };
  const tonos = {
    venta: "ok", perdida: "danger", dinero_entrada: "ok", dinero_salida: "danger", producto_agregado: "neutral",
  };

  const filtrados = filtro === "todos" ? eventos : eventos.filter(e => e.tipo === filtro);

  return (
    <div className="space-y-5">
      <div>
        <h1 className="text-xl font-bold text-slate-800 dark:text-white font-display">Historial</h1>
        <p className="text-sm text-slate-500 dark:text-white mt-1">Todo lo que ha pasado en tu negocio, en un solo lugar.</p>
      </div>

      {error && <div className="bg-rose-50 dark:bg-rose-900/20 border border-rose-200 dark:border-rose-800 text-rose-700 dark:text-rose-300 text-sm rounded-lg p-3">{error}</div>}

      <div className="flex gap-2 flex-wrap">
        <button onClick={() => setFiltro("todos")} className={`text-xs font-medium px-3 py-1.5 rounded-full ${filtro === "todos" ? "bg-[#16233D] text-white" : "bg-slate-100 dark:bg-neutral-900 text-slate-600 dark:text-white"}`}>Todos</button>
        {Object.entries(tiposLabel).map(([key, label]) => (
          <button key={key} onClick={() => setFiltro(key)} className={`text-xs font-medium px-3 py-1.5 rounded-full ${filtro === key ? "bg-[#16233D] text-white" : "bg-slate-100 dark:bg-neutral-900 text-slate-600 dark:text-white"}`}>{label}</button>
        ))}
      </div>

      <div className="bg-white dark:bg-black border border-slate-200 dark:border-white/10 rounded-2xl p-5">
        {cargando ? (
          <div className="flex items-center gap-2 text-sm text-slate-400 py-6"><IconLoading /> Cargando historial...</div>
        ) : filtrados.length === 0 ? (
          <p className="text-sm text-slate-400 text-center py-6">No hay movimientos para mostrar</p>
        ) : (
          <div className="space-y-2 max-h-[32rem] overflow-y-auto">
            {filtrados.map((e, i) => (
              <div key={i} className="flex justify-between items-center py-2.5 px-3 rounded-lg bg-slate-50 dark:bg-neutral-900">
                <div className="flex items-center gap-3">
                  <Badge tone={tonos[e.tipo]}>{tiposLabel[e.tipo]}</Badge>
                  <div>
                    <div className="text-sm font-medium text-slate-700 dark:text-white">{e.descripcion}</div>
                    <div className="text-xs text-slate-400 font-mono">{new Date(e.fecha).toLocaleString()}</div>
                  </div>
                </div>
                <div className="flex items-center gap-2">
                  {e.monto !== null && (
                    <div className={`font-mono font-semibold text-sm ${e.positivo ? "text-emerald-600 dark:text-emerald-400" : "text-rose-600 dark:text-rose-400"}`}>
                      {e.positivo ? "+" : "-"}C${Number(e.monto).toFixed(2)}
                    </div>
                  )}
                  {e.tipo !== "producto_agregado" && (
                    <button onClick={() => eliminarEvento(e)} className="text-slate-400 hover:text-rose-500 text-sm">🗑️</button>
                  )}
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function GraficaCanvas({ tipo, data, id }) {
  const canvasRef = React.useRef(null);
  const chartRef = React.useRef(null);

  useEffect(() => {
    if (!canvasRef.current || typeof Chart === "undefined") return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current, {
      type: tipo,
      data,
      options: {
        responsive: true,
        plugins: { legend: { display: data.datasets.length > 1, labels: { font: { size: 11 } } } },
        scales: tipo === "bar" || tipo === "line" ? { y: { beginAtZero: true } } : {},
      },
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [JSON.stringify(data), tipo]);

  return <canvas ref={canvasRef} id={id}></canvas>;
}

function PaginaEstadisticas({ consumoHogar }) {
  const [ventas, setVentas] = useState([]);
  const [perdidas, setPerdidas] = useState([]);
  const [cargando, setCargando] = useState(true);
  const [error, setError] = useState(null);

  const cargar = useCallback(async () => {
    try {
      setError(null);
      const [v, p] = await Promise.all([supaApi.listarVentas(500), supaApi.listarPerdidas(500)]);
      setVentas(v); setPerdidas(p);
    } catch (e) {
      setError("No se pudo cargar las estadísticas. Revisá tu conexión a internet.");
    } finally {
      setCargando(false);
    }
  }, []);

  useEffect(() => { cargar(); }, [cargar]);

  if (cargando) return <div className="flex items-center gap-2 text-sm text-slate-400 py-16 justify-center"><IconLoading /> Cargando estadísticas...</div>;

  const gananciaTotal = ventas.reduce((a, v) => a + Number(v.ganancia), 0);
  const perdidaTotal = perdidas.reduce((a, p) => a + Number(p.valor_perdido), 0);
  const unidadesVendidas = ventas.reduce((a, v) => a + Number(v.cantidad), 0);

  // Reporte del mes (incluye consumo del hogar)
  const ahoraMes = new Date();
  const esEsteMes = (f) => { const d = new Date(f); return d.getFullYear() === ahoraMes.getFullYear() && d.getMonth() === ahoraMes.getMonth(); };
  const ventasMes = ventas.filter(v => esEsteMes(v.creado_en));
  const totalVendidoMes = ventasMes.reduce((a, v) => a + v.cantidad * v.precio_venta, 0);
  const gananciaMes = ventasMes.reduce((a, v) => a + Number(v.ganancia), 0);
  const consumoHogarMes = (consumoHogar || []).filter(r => esEsteMes(r.creado_en)).reduce((a, r) => a + Number(r.costo_total), 0);
  const gananciaRealMes = gananciaMes - consumoHogarMes;

  // Ventas por día (últimos 14 días)
  const hoy = new Date();
  const dias = Array.from({ length: 14 }, (_, i) => {
    const d = new Date(hoy); d.setDate(d.getDate() - (13 - i));
    return d.toISOString().slice(0, 10);
  });
  const ventasPorDia = dias.map(dia =>
    ventas.filter(v => v.creado_en.slice(0, 10) === dia).reduce((a, v) => a + v.cantidad * v.precio_venta, 0)
  );

  // Productos más vendidos
  const porProducto = {};
  ventas.forEach(v => { porProducto[v.producto_nombre] = (porProducto[v.producto_nombre] || 0) + Number(v.cantidad); });
  const topProductos = Object.entries(porProducto).sort((a, b) => b[1] - a[1]).slice(0, 6);

  // Ganancias vs pérdidas por semana (últimas 6 semanas, agrupado simple)
  const semanas = Array.from({ length: 6 }, (_, i) => {
    const fin = new Date(hoy); fin.setDate(fin.getDate() - i * 7);
    const inicio = new Date(fin); inicio.setDate(inicio.getDate() - 6);
    return { inicio, fin, label: `${inicio.getDate()}/${inicio.getMonth()+1}` };
  }).reverse();
  const gananciaPorSemana = semanas.map(s =>
    ventas.filter(v => { const f = new Date(v.creado_en); return f >= s.inicio && f <= s.fin; }).reduce((a, v) => a + Number(v.ganancia), 0)
  );
  const perdidaPorSemana = semanas.map(s =>
    perdidas.filter(p => { const f = new Date(p.creado_en); return f >= s.inicio && f <= s.fin; }).reduce((a, p) => a + Number(p.valor_perdido), 0)
  );

  return (
    <div className="space-y-5">
      <div>
        <h1 className="text-xl font-bold text-slate-800 dark:text-white font-display">Estadísticas</h1>
        <p className="text-sm text-slate-500 dark:text-white mt-1">Cómo va creciendo tu negocio.</p>
      </div>

function PantallaLogin({ onAutenticado }) {
  const [modo, setModo] = useState("login"); // "login" | "registro" | "recuperar"
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [confirmarPassword, setConfirmarPassword] = useState("");
  const [verPassword, setVerPassword] = useState(false);
  const [cargando, setCargando] = useState(false);
  const [error, setError] = useState(null);
  const [aviso, setAviso] = useState(null);

  const enviar = async () => {
    setError(null); setAviso(null);

    if (modo === "recuperar") {
      if (!email.trim()) { setError("Poné tu correo"); return; }
      setCargando(true);
      try {
        await authApi.recuperar(email.trim());
        setAviso("Te enviamos un correo con un link para elegir una nueva contraseña.");
      } catch (e) {
        setError(e.message);
      } finally {
        setCargando(false);
      }
      return;
    }

    if (!email.trim() || !password) { setError("Poné correo y contraseña"); return; }
    if (modo === "registro") {
      if (password.length < 6) { setError("La contraseña debe tener al menos 6 caracteres"); return; }
      if (password !== confirmarPassword) { setError("Las contraseñas no coinciden"); return; }
    }
    setCargando(true);
    try {
      if (modo === "registro") {
        const data = await authApi.signUp(email.trim(), password);
        if (data.access_token) {
          onAutenticado(data);
        } else {
          setAviso("Cuenta creada. Revisá tu correo para confirmarla, y después iniciá sesión aquí.");
          setModo("login");
        }
      } else {
        const data = await authApi.signIn(email.trim(), password);
        onAutenticado(data);
      }
    } catch (e) {
      setError(e.message);
    } finally {
      setCargando(false);
    }
  };

  const tituloModo = { login: "Iniciá sesión para ver tu negocio", registro: "Creá tu cuenta para empezar", recuperar: "Te ayudamos a recuperar tu acceso" };

  return (
    <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4">
      <div className="bg-white border border-slate-200 rounded-2xl p-6 w-full max-w-sm">
        <div className="mb-4">
          <NovaBrand theme="light" size="md" />
        </div>
        <p className="text-sm text-slate-500 mb-5">{tituloModo[modo]}</p>

        {modo !== "recuperar" && (
          <div className="flex gap-2 mb-4 bg-slate-100 rounded-lg p-1">
            <button onClick={() => { setModo("login"); setError(null); setAviso(null); }} className={`flex-1 py-2 rounded-md text-sm font-medium ${modo === "login" ? "bg-white shadow text-slate-800" : "text-slate-500"}`}>Iniciar sesión</button>
            <button onClick={() => { setModo("registro"); setError(null); setAviso(null); }} className={`flex-1 py-2 rounded-md text-sm font-medium ${modo === "registro" ? "bg-white shadow text-slate-800" : "text-slate-500"}`}>Crear cuenta</button>
          </div>
        )}

        {error && <div className="bg-rose-50 border border-rose-200 text-rose-700 text-xs rounded-lg p-2.5 mb-3">{error}</div>}
        {aviso && <div className="bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs rounded-lg p-2.5 mb-3">{aviso}</div>}

        <label className="block text-xs font-semibold text-slate-500 uppercase mb-1">Correo</label>
        <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="tu@correo.com"
          className="w-full px-3 py-2 rounded-lg border border-slate-200 bg-white text-sm mb-3 outline-none focus:border-[#E3A73B]" />

        {modo !== "recuperar" && (
          <>
            <label className="block text-xs font-semibold text-slate-500 uppercase mb-1">Contraseña</label>
            <div className="relative mb-3">
              <input type={verPassword ? "text" : "password"} value={password} onChange={(e) => setPassword(e.target.value)} placeholder="Mínimo 6 caracteres"
                className="w-full px-3 py-2 pr-10 rounded-lg border border-slate-200 bg-white text-sm outline-none focus:border-[#E3A73B]" />
              <button type="button" onClick={() => setVerPassword(!verPassword)} className="absolute right-2 top-1/2 -translate-y-1/2 text-sm">
                {verPassword ? <IconEyeOff /> : <IconEye />}
              </button>
            </div>
          </>
        )}

        {modo === "registro" && (
          <>
            <label className="block text-xs font-semibold text-slate-500 uppercase mb-1">Confirmar contraseña</label>
            <input type={verPassword ? "text" : "password"} value={confirmarPassword} onChange={(e) => setConfirmarPassword(e.target.value)} placeholder="Repetí tu contraseña"
              className="w-full px-3 py-2 rounded-lg border border-slate-200 bg-white text-sm mb-3 outline-none focus:border-[#E3A73B]" />
          </>
        )}

        {modo === "login" && (
          <button type="button" onClick={() => { setModo("recuperar"); setError(null); setAviso(null); }} className="block text-xs text-slate-500 underline mb-4">
            ¿Olvidaste tu contraseña?
          </button>
        )}
        {modo !== "login" && <div className="mb-1" />}

        <button disabled={cargando} onClick={enviar} className="w-full bg-[#E3A73B] text-[#16233D] font-semibold text-sm px-4 py-2.5 rounded-lg disabled:opacity-50 flex items-center justify-center gap-2 mt-3">
          {cargando && <IconLoading />} {modo === "login" ? "Entrar" : modo === "registro" ? "Crear cuenta" : "Enviar correo de recuperación"}
        </button>

        {modo === "recuperar" && (
          <button type="button" onClick={() => { setModo("login"); setError(null); setAviso(null); }} className="block text-xs text-slate-500 underline mt-3 mx-auto">
            Volver a iniciar sesión
          </button>
        )}
      </div>
    </div>
  );
}

function App() {
  const [tokenRecuperacion] = useState(() => {
    const hash = window.location.hash.startsWith("#") ? window.location.hash.slice(1) : "";
    const params = new URLSearchParams(hash);
    return params.get("type") === "recovery" ? params.get("access_token") : null;
  });

  const [sesion, setSesionState] = useState(() => {
    try { return JSON.parse(localStorage.getItem("mi_negocio_sesion")) || null; }
    catch { return null; }
  });
  currentAccessToken = sesion?.access_token || null;
  currentRefreshToken = sesion?.refresh_token || null;
  currentUserId = sesion?.user?.id || null;

  const [invitacion, setInvitacion] = useState(undefined); // undefined = sin revisar, null = ninguna, objeto = pendiente

  useEffect(() => {
    if (!sesion?.user?.email) { setInvitacion(undefined); return; }
    supaApi.buscarInvitacionPendiente(sesion.user.email).then(setInvitacion).catch(() => setInvitacion(null));
  }, [sesion?.user?.email]);

  const guardarSesion = (data) => {
    localStorage.setItem("mi_negocio_sesion", JSON.stringify(data));
    setSesionState(data);
  };
  const cerrarSesion = async () => {
    await authApi.signOut(sesion?.access_token);
    localStorage.removeItem("mi_negocio_sesion");
    setSesionState(null);
  };

  useEffect(() => {
    alRefrescarSesion = (data) => {
      localStorage.setItem("mi_negocio_sesion", JSON.stringify(data));
      setSesionState(data);
    };
    alExpirarSesion = () => {
      localStorage.removeItem("mi_negocio_sesion");
      setSesionState(null);
    };
    return () => { alRefrescarSesion = null; alExpirarSesion = null; };
  }, []);

  useEffect(() => {
    if (!sesion) return;
    const intervalo = setInterval(() => { refrescarToken(); }, 45 * 60 * 1000);
    return () => clearInterval(intervalo);
  }, [sesion]);

  if (tokenRecuperacion) {
    return <PantallaNuevaPassword accessToken={tokenRecuperacion} onListo={() => { window.location.hash = ""; window.location.reload(); }} />;
  }

  if (!sesion) {
    return <PantallaLogin onAutenticado={guardarSesion} />;
  }

  if (invitacion) {
    return <PantallaInvitacion invitacion={invitacion} onAceptada={() => setInvitacion(null)} />;
  }

  return <AppInterna sesion={sesion} onCerrarSesion={cerrarSesion} />;
}
