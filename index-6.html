let currentAccessToken = null;
function getHeaders(extra = {}) {
  return {
    apikey: SUPABASE_ANON_KEY,
    Authorization: `Bearer ${currentAccessToken || SUPABASE_ANON_KEY}`,
    "Content-Type": "application/json",
    ...extra,
  };
}

// --- Autenticación ---
const authApi = {
  async signUp(email, password) {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/signup`, {
      method: "POST",
      headers: { apikey: SUPABASE_ANON_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.msg || data.error_description || "No se pudo crear la cuenta");
    return data;
  },
  async signIn(email, password) {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
      method: "POST",
      headers: { apikey: SUPABASE_ANON_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error_description || data.msg || "Correo o contraseña incorrectos");
    return data;
  },
  async signOut(accessToken) {
    try {
      await fetch(`${SUPABASE_URL}/auth/v1/logout`, {
        method: "POST",
        headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${accessToken}` },
      });
    } catch (e) {}
  },
};

const supaApi = {
  async listarProductos() {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/productos?select=*&order=creado_en.asc`, { headers: getHeaders() });
    if (!res.ok) throw new Error("No se pudo cargar el inventario");
    return res.json();
  },
  async crearProducto(producto) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/productos`, {
      method: "POST",
      headers: getHeaders({ Prefer: "return=representation" }),
      body: JSON.stringify(producto),
    });
    if (!res.ok) throw new Error("No se pudo agregar el producto");
    return res.json();
  },
  async actualizarProducto(id, cambios) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/productos?id=eq.${id}`, {
      method: "PATCH",
      headers: getHeaders({ Prefer: "return=representation" }),
      body: JSON.stringify(cambios),
    });
    if (!res.ok) throw new Error("No se pudo actualizar el producto");
    return res.json();
  },
  async eliminarProducto(id) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/productos?id=eq.${id}`, { method: "DELETE", headers: getHeaders() });
    if (!res.ok) throw new Error("No se pudo eliminar el producto");
  },

  // --- Caja ---
  async obtenerSesionAbierta() {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/caja_sesiones?estado=eq.abierta&select=*&order=fecha_apertura.desc&limit=1`, { headers: getHeaders() });
    if (!res.ok) throw new Error("No se pudo revisar la caja");
    const datos = await res.json();
    return datos[0] || null;
  },
  async abrirCaja(montoInicial) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/caja_sesiones`, {
      method: "POST",
      headers: getHeaders({ Prefer: "return=representation" }),
      body: JSON.stringify({ monto_inicial: montoInicial, estado: "abierta" }),
    });
    if (!res.ok) throw new Error("No se pudo abrir la caja");
    return res.json();
  },
  async cerrarCaja(sesionId, montoFinal) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/caja_sesiones?id=eq.${sesionId}`, {
      method: "PATCH",
      headers: getHeaders({ Prefer: "return=representation" }),
      body: JSON.stringify({ estado: "cerrada", monto_final: montoFinal, fecha_cierre: new Date().toISOString() }),
    });
    if (!res.ok) throw new Error("No se pudo cerrar la caja");
    return res.json();
  },
  async listarMovimientos(sesionId) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/caja_movimientos?sesion_id=eq.${sesionId}&select=*&order=creado_en.desc`, { headers: getHeaders() });
    if (!res.ok) throw new Error("No se pudieron cargar los movimientos");
    return res.json();
  },
  async crearMovimiento(movimiento) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/caja_movimientos`, {
      method: "POST",
      headers: getHeaders({ Prefer: "return=representation" }),
      body: JSON.stringify(movimiento),
    });
    if (!res.ok) throw new Error("No se pudo registrar el movimiento");
    return res.json();
  },
  async listarSesionesCerradas() {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/caja_sesiones?estado=eq.cerrada&select=*&order=fecha_cierre.desc&limit=10`, { headers: getHeaders() });
    if (!res.ok) throw new Error("No se pudo cargar el historial de caja");
    return res.json();
  },

  // --- Ventas (historial y estadísticas) ---
  async registrarVenta(venta) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/ventas`, {
      method: "POST",
      headers: getHeaders({ Prefer: "return=representation" }),
      body: JSON.stringify(venta),
    });
    if (!res.ok) throw new Error("No se pudo registrar la venta");
    return res.json();
  },
  async listarVentas(limite = 200) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/ventas?select=*&order=creado_en.desc&limit=${limite}`, { headers: getHeaders() });
    if (!res.ok) throw new Error("No se pudieron cargar las ventas");
    return res.json();
  },

  // --- Pérdidas ---
  async registrarPerdida(perdida) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/perdidas`, {
      method: "POST",
      headers: getHeaders({ Prefer: "return=representation" }),
      body: JSON.stringify(perdida),
    });
    if (!res.ok) throw new Error("No se pudo registrar la pérdida");
    return res.json();
  },
  async listarPerdidas(limite = 200) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/perdidas?select=*&order=creado_en.desc&limit=${limite}`, { headers: getHeaders() });
    if (!res.ok) throw new Error("No se pudieron cargar las pérdidas");
    return res.json();
  },

  // --- Todos los movimientos de caja (para historial, sin filtrar por sesión) ---
  async listarTodosMovimientosCaja(limite = 200) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/caja_movimientos?select=*&order=creado_en.desc&limit=${limite}`, { headers: getHeaders() });
    if (!res.ok) throw new Error("No se pudieron cargar los movimientos de caja");
    return res.json();
  },
};

function Badge({ children, tone = "neutral" }) {
  const tones = {
    neutral: "bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300",
    warn: "bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-300",
    danger: "bg-rose-100 text-rose-700 dark:bg-rose-900/40 dark:text-rose-300",
    ok: "bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300",
  };
  return <span className={`text-[11px] font-semibold px-2 py-0.5 rounded-full ${tones[tone]}`}>{children}</span>;
}

          <Icon className="text-sm" />
        </div>
      </div>
      <div className="text-2xl font-bold text-slate-800 dark:text-slate-100 font-mono">{value}</div>

  );
}

function PaginaCaja() {
  const [sesion, setSesion] = useState(null);
  const [movimientos, setMovimientos] = useState([]);
  const [historial, setHistorial] = useState([]);
  const [cargando, setCargando] = useState(true);
  const [error, setError] = useState(null);
  const [montoApertura, setMontoApertura] = useState("");
  const [nuevoTipo, setNuevoTipo] = useState("ingreso");
  const [nuevaDescripcion, setNuevaDescripcion] = useState("");
  const [nuevoMonto, setNuevoMonto] = useState("");
  const [procesando, setProcesando] = useState(false);

  const cargarTodo = useCallback(async () => {
    try {
      setError(null);
      const s = await supaApi.obtenerSesionAbierta();
      setSesion(s);
      if (s) {
        const movs = await supaApi.listarMovimientos(s.id);
        setMovimientos(movs);
      } else {
        setMovimientos([]);
        const h = await supaApi.listarSesionesCerradas();
        setHistorial(h);
      }
    } catch (e) {
      setError("No se pudo conectar con la caja. Revisá tu conexión a internet.");
    } finally {
      setCargando(false);
    }
  }, []);

  useEffect(() => { cargarTodo(); }, [cargarTodo]);

  const totalIngresos = movimientos.filter(m => m.tipo === "ingreso").reduce((a, m) => a + Number(m.monto), 0);
  const totalGastos = movimientos.filter(m => m.tipo === "gasto").reduce((a, m) => a + Number(m.monto), 0);
  const saldoActual = sesion ? Number(sesion.monto_inicial) + totalIngresos - totalGastos : 0;

  const abrirCaja = async () => {
    const monto = parseFloat(montoApertura) || 0;
    setProcesando(true);
    try {
      await supaApi.abrirCaja(monto);
      setMontoApertura("");
      await cargarTodo();
    } catch (e) { alert(e.message); }
    finally { setProcesando(false); }
  };

  const registrarMovimiento = async () => {
    const monto = parseFloat(nuevoMonto) || 0;
    if (monto <= 0) { alert("Poné un monto mayor a 0"); return; }
    setProcesando(true);
    try {
      await supaApi.crearMovimiento({ sesion_id: sesion.id, tipo: nuevoTipo, descripcion: nuevaDescripcion.trim(), monto });
      setNuevaDescripcion(""); setNuevoMonto("");
      await cargarTodo();
    } catch (e) { alert(e.message); }
    finally { setProcesando(false); }
  };

  const cerrarCaja = async () => {
    if (!confirm(`¿Cerrar la caja con un saldo final de C$${saldoActual.toFixed(2)}?`)) return;
    setProcesando(true);
    try {
      await supaApi.cerrarCaja(sesion.id, saldoActual);
      await cargarTodo();
    } catch (e) { alert(e.message); }
    finally { setProcesando(false); }
  };

  if (cargando) return <div className="flex items-center justify-center py-16 text-slate-400 gap-2 text-sm"><IconLoading /> Cargando caja...</div>;

  return (
    <div className="space-y-5">
      <div>
        <h1 className="text-xl font-bold text-slate-800 dark:text-slate-100 font-display">Control de caja</h1>
        <p className="text-sm text-slate-500 dark:text-slate-400 mt-1">Registrá entradas y salidas de dinero del día.</p>
      </div>

      {error && <div className="bg-rose-50 dark:bg-rose-900/20 border border-rose-200 dark:border-rose-800 text-rose-700 dark:text-rose-300 text-sm rounded-lg p-3">{error}</div>}

      {!sesion ? (
        <div className="bg-white dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700/60 rounded-2xl p-6 max-w-sm">
          <h2 className="font-semibold text-slate-800 dark:text-slate-100 mb-3">Abrir caja</h2>
          <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase mb-1">Monto inicial (efectivo con el que abrís)</label>
          <input type="number" value={montoApertura} onChange={(e) => setMontoApertura(e.target.value)}
            className="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-sm mb-3 outline-none focus:border-[#E3A73B]" placeholder="0" />
          <button disabled={procesando} onClick={abrirCaja} className="w-full bg-[#E3A73B] text-[#1E3A32] font-semibold text-sm px-4 py-2 rounded-lg disabled:opacity-50 flex items-center justify-center gap-2">
            {procesando && <IconLoading />} Abrir caja
          </button>

          {historial.length > 0 && (
            <div className="mt-6 pt-4 border-t border-slate-100 dark:border-slate-700">
              <h3 className="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase mb-2">Cajas anteriores</h3>
              <div className="space-y-2">
                {historial.map(h => (
                  <div key={h.id} className="flex justify-between text-xs text-slate-500 dark:text-slate-400 py-1">
                    <span>{new Date(h.fecha_cierre).toLocaleDateString()}</span>
                    <span className="font-mono">C${Number(h.monto_inicial).toFixed(2)} → C${Number(h.monto_final).toFixed(2)}</span>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      ) : (
        <div className="space-y-5">
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
            <StatCard label="Monto inicial" value={`C$${Number(sesion.monto_inicial).toFixed(2)}`} icon={IconWallet} accent="bg-[#1E3A32]" />
            <StatCard label="Ingresos" value={`C$${totalIngresos.toFixed(2)}`} icon={IconChart} accent="bg-emerald-600" />
            <StatCard label="Gastos" value={`C$${totalGastos.toFixed(2)}`} icon={IconAlert} accent="bg-rose-600" />
            <StatCard label="Saldo actual" value={`C$${saldoActual.toFixed(2)}`} icon={IconCart} accent="bg-[#2471A3]" />
          </div>

          <div className="grid lg:grid-cols-2 gap-4">
            <div className="bg-white dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700/60 rounded-2xl p-5">
              <h2 className="font-semibold text-slate-800 dark:text-slate-100 text-sm mb-3">Registrar movimiento</h2>
              <div className="flex gap-2 mb-3">
                <button onClick={() => setNuevoTipo("ingreso")} className={`flex-1 py-2 rounded-lg text-sm font-medium ${nuevoTipo === "ingreso" ? "bg-emerald-600 text-white" : "bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300"}`}>Entrada</button>
                <button onClick={() => setNuevoTipo("gasto")} className={`flex-1 py-2 rounded-lg text-sm font-medium ${nuevoTipo === "gasto" ? "bg-rose-600 text-white" : "bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300"}`}>Salida</button>
              </div>
              <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase mb-1">Descripción</label>
              <input value={nuevaDescripcion} onChange={(e) => setNuevaDescripcion(e.target.value)} placeholder="Ej: Venta del día, compra de bolsas..."
                className="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-sm mb-3 outline-none focus:border-[#E3A73B]" />
              <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase mb-1">Monto</label>
              <input type="number" value={nuevoMonto} onChange={(e) => setNuevoMonto(e.target.value)} placeholder="0"
                className="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-sm mb-3 outline-none focus:border-[#E3A73B]" />
              <button disabled={procesando} onClick={registrarMovimiento} className="w-full bg-[#E3A73B] text-[#1E3A32] font-semibold text-sm px-4 py-2 rounded-lg disabled:opacity-50 flex items-center justify-center gap-2">
                {procesando && <IconLoading />} Registrar
              </button>
              <button disabled={procesando} onClick={cerrarCaja} className="w-full mt-2 border border-rose-300 dark:border-rose-800 text-rose-600 dark:text-rose-400 font-semibold text-sm px-4 py-2 rounded-lg">
                Cerrar caja
              </button>
            </div>

            <div className="bg-white dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700/60 rounded-2xl p-5">
              <h2 className="font-semibold text-slate-800 dark:text-slate-100 text-sm mb-3">Movimientos de hoy</h2>
              <div className="space-y-2 max-h-96 overflow-y-auto">
                {movimientos.length === 0 && <p className="text-sm text-slate-400 text-center py-6">Todavía no hay movimientos</p>}
                {movimientos.map(m => (
                  <div key={m.id} className="flex justify-between items-center py-2 px-3 rounded-lg bg-slate-50 dark:bg-slate-700/30">
                    <div>
                      <div className="text-sm font-medium text-slate-700 dark:text-slate-200">{m.descripcion || (m.tipo === "ingreso" ? "Entrada de dinero" : "Salida de dinero")}</div>
                      <div className="text-xs text-slate-400 font-mono">{new Date(m.creado_en).toLocaleTimeString()}</div>
                    </div>
                    <div className={`font-mono font-semibold text-sm ${m.tipo === "ingreso" ? "text-emerald-600 dark:text-emerald-400" : "text-rose-600 dark:text-rose-400"}`}>
                      {m.tipo === "ingreso" ? "+" : "-"}C${Number(m.monto).toFixed(2)}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function PaginaPerdidas({ productos, onActualizarProducto, onRecargarProductos }) {
  const [perdidas, setPerdidas] = useState([]);
  const [cargando, setCargando] = useState(true);
  const [error, setError] = useState(null);
  const [productoId, setProductoId] = useState("");
  const [cantidad, setCantidad] = useState("");
  const [motivo, setMotivo] = useState("dañado");
  const [procesando, setProcesando] = useState(false);

  const cargar = useCallback(async () => {
    try {
      setError(null);
      const datos = await supaApi.listarPerdidas();
      setPerdidas(datos);
    } catch (e) {
      setError("No se pudo conectar. Revisá tu conexión a internet.");
    } finally {
      setCargando(false);
    }
  }, []);

  useEffect(() => { cargar(); }, [cargar]);

  const productoSeleccionado = productos.find(p => p.id === productoId);
  const cantidadNum = parseFloat(cantidad) || 0;
  const valorPerdido = productoSeleccionado ? productoSeleccionado.costo * cantidadNum : 0;

  const registrar = async () => {
    if (!productoSeleccionado) { alert("Elegí un producto"); return; }
    if (cantidadNum <= 0) { alert("Poné una cantidad mayor a 0"); return; }
    setProcesando(true);
    try {
      await supaApi.registrarPerdida({
        producto_id: productoSeleccionado.id,
        producto_nombre: productoSeleccionado.nombre,
        cantidad: cantidadNum,
        motivo,
        valor_perdido: valorPerdido,
      });
      const nuevaCantidad = Math.max(0, productoSeleccionado.cantidad - cantidadNum);
      await onActualizarProducto(productoSeleccionado.id, { cantidad: nuevaCantidad });
      setProductoId(""); setCantidad("");
      await cargar();
      await onRecargarProductos();
    } catch (e) { alert(e.message); }
    finally { setProcesando(false); }
  };

  const totalPerdido = perdidas.reduce((a, p) => a + Number(p.valor_perdido), 0);

  return (
    <div className="space-y-5">
      <div>
        <h1 className="text-xl font-bold text-slate-800 dark:text-slate-100 font-display">Pérdidas</h1>
        <p className="text-sm text-slate-500 dark:text-slate-400 mt-1">Registrá productos dañados, perdidos o vencidos — se descuentan del inventario.</p>
      </div>

      {error && <div className="bg-rose-50 dark:bg-rose-900/20 border border-rose-200 dark:border-rose-800 text-rose-700 dark:text-rose-300 text-sm rounded-lg p-3">{error}</div>}

      <div className="grid lg:grid-cols-3 gap-4">
        <div className="bg-white dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700/60 rounded-2xl p-5">
          <h2 className="font-semibold text-slate-800 dark:text-slate-100 text-sm mb-3">Registrar pérdida</h2>
          <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase mb-1">Producto</label>
          <select value={productoId} onChange={(e) => setProductoId(e.target.value)}
            className="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-sm mb-3 outline-none focus:border-[#E3A73B]">
            <option value="">Seleccioná un producto</option>
            {productos.map(p => <option key={p.id} value={p.id}>{p.nombre} (stock: {p.cantidad})</option>)}
          </select>
          <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase mb-1">Cantidad perdida</label>
          <input type="number" value={cantidad} onChange={(e) => setCantidad(e.target.value)} placeholder="0"
            className="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-sm mb-3 outline-none focus:border-[#E3A73B]" />
          <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase mb-1">Motivo</label>
          <select value={motivo} onChange={(e) => setMotivo(e.target.value)}
            className="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-sm mb-3 outline-none focus:border-[#E3A73B]">
            <option value="dañado">Producto dañado</option>
            <option value="perdido">Producto perdido</option>
            <option value="vencido">Producto vencido</option>
          </select>
          {productoSeleccionado && cantidadNum > 0 && (
            <div className="bg-rose-50 dark:bg-rose-900/20 rounded-lg p-3 text-xs text-rose-700 dark:text-rose-300 mb-3">
              Valor perdido estimado: <b>C${valorPerdido.toFixed(2)}</b>
            </div>
          )}
          <button disabled={procesando} onClick={registrar} className="w-full bg-rose-600 text-white font-semibold text-sm px-4 py-2 rounded-lg disabled:opacity-50 flex items-center justify-center gap-2">
            {procesando && <IconLoading />} Registrar pérdida
          </button>
        </div>

        <div className="lg:col-span-2 space-y-4">
          <StatCard label="Total perdido acumulado" value={`C$${totalPerdido.toFixed(2)}`} icon={IconAlert} accent="bg-rose-600" />
          <div className="bg-white dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700/60 rounded-2xl p-5">
            <h2 className="font-semibold text-slate-800 dark:text-slate-100 text-sm mb-3">Historial de pérdidas</h2>
            {cargando ? (
              <div className="flex items-center gap-2 text-sm text-slate-400 py-4"><IconLoading /> Cargando...</div>
            ) : perdidas.length === 0 ? (
              <p className="text-sm text-slate-400 text-center py-6">Todavía no hay pérdidas registradas 👍</p>
            ) : (
              <div className="space-y-2 max-h-96 overflow-y-auto">
                {perdidas.map(p => (
                  <div key={p.id} className="flex justify-between items-center py-2 px-3 rounded-lg bg-rose-50/60 dark:bg-rose-900/10">
                    <div>
                      <div className="text-sm font-medium text-slate-700 dark:text-slate-200">{p.producto_nombre}</div>
                      <div className="text-xs text-slate-400">{p.motivo} · {p.cantidad} u. · {new Date(p.creado_en).toLocaleString()}</div>
                    </div>
                    <div className="font-mono font-semibold text-sm text-rose-600 dark:text-rose-400">-C${Number(p.valor_perdido).toFixed(2)}</div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

function ModalProducto({ abierto, producto, onGuardar, onCerrar, guardando }) {
  const [form, setForm] = useState({ nombre: "", categoria: "", costo: "", venta: "", cantidad: "", minimo: "" });

  useEffect(() => {
    if (producto) {
      setForm({ nombre: producto.nombre, categoria: producto.categoria || "", costo: producto.costo, venta: producto.venta, cantidad: producto.cantidad, minimo: producto.minimo });
    } else {
      setForm({ nombre: "", categoria: "", costo: "", venta: "", cantidad: "", minimo: "" });
    }
  }, [producto, abierto]);

  if (!abierto) return null;
  const costoNum = parseFloat(form.costo) || 0;
  const ventaNum = parseFloat(form.venta) || 0;
  const ganancia = ventaNum - costoNum;
  const margen = costoNum > 0 ? ((ganancia / costoNum) * 100).toFixed(0) : 0;

  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-40">
      <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 w-full max-w-sm max-h-[90vh] overflow-y-auto">
        <h2 className="font-semibold text-slate-800 dark:text-slate-100 mb-4 font-display">{producto ? "Editar producto" : "Agregar producto"}</h2>
        <div className="space-y-3">
          {[
            { key: "nombre", label: "Nombre del producto", type: "text" },
            { key: "categoria", label: "Categoría (opcional)", type: "text" },
            { key: "costo", label: "Precio de costo", type: "number" },
            { key: "venta", label: "Precio de venta", type: "number" },
            { key: "cantidad", label: "Cantidad en stock", type: "number" },
            { key: "minimo", label: "Alertar cuando queden menos de", type: "number" },
          ].map((campo) => (
            <div key={campo.key}>
              <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase mb-1">{campo.label}</label>
              <input
                type={campo.type}
                value={form[campo.key]}
                onChange={(e) => setForm({ ...form, [campo.key]: e.target.value })}
                className="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-sm text-slate-700 dark:text-slate-200 outline-none focus:border-[#E3A73B]"
              />
            </div>
          ))}
          <div className="bg-slate-50 dark:bg-slate-700/40 rounded-lg p-3 text-xs text-slate-500 dark:text-slate-400">
            Ganancia: <b className="text-emerald-600 dark:text-emerald-400">C${ganancia.toFixed(2)}</b> · Margen: <b className="text-emerald-600 dark:text-emerald-400">{margen}%</b>
          </div>
        </div>
        <div className="flex gap-2 justify-end mt-5">
          <button onClick={onCerrar} className="px-4 py-2 rounded-lg text-sm font-medium border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300">Cancelar</button>
          <button disabled={guardando || !form.nombre.trim()} onClick={() => onGuardar(form)} className="px-4 py-2 rounded-lg text-sm font-semibold bg-[#E3A73B] text-[#1E3A32] disabled:opacity-50 flex items-center gap-2">
            {guardando && <IconLoading />} Guardar
          </button>
        </div>
      </div>
    </div>
  );
}

function PaginaInventario({ productos, cargando, error, onRecargar, onCrear, onActualizar, onEliminar, onVentaRegistrada }) {
  const [busqueda, setBusqueda] = useState("");
  const [modalAbierto, setModalAbierto] = useState(false);
  const [productoEditando, setProductoEditando] = useState(null);
  const [guardando, setGuardando] = useState(false);

  const filtrados = productos.filter(p => p.nombre.toLowerCase().includes(busqueda.toLowerCase()));
  const abrirNuevo = () => { setProductoEditando(null); setModalAbierto(true); };
  const abrirEditar = (p) => { setProductoEditando(p); setModalAbierto(true); };

  const guardar = async (form) => {
    setGuardando(true);
    try {
      const datos = {
        nombre: form.nombre.trim(), categoria: form.categoria.trim(),
        costo: parseFloat(form.costo) || 0, venta: parseFloat(form.venta) || 0,
        cantidad: parseFloat(form.cantidad) || 0, minimo: parseFloat(form.minimo) || 0,
      };
      if (productoEditando) await onActualizar(productoEditando.id, datos);
      else await onCrear(datos);
      setModalAbierto(false);
    } catch (e) { alert(e.message); }
    finally { setGuardando(false); }
  };

  const vender = async (p, cant = 1) => {
    const nuevaCantidad = Math.max(0, p.cantidad - cant);
    const nuevaGanancia = (p.ganancia_acumulada || 0) + (p.venta - p.costo) * cant;
    const nuevosVendidos = (p.vendidos || 0) + cant;
    await onActualizar(p.id, { cantidad: nuevaCantidad, ganancia_acumulada: nuevaGanancia, vendidos: nuevosVendidos });
    await onVentaRegistrada({
      producto_id: p.id, producto_nombre: p.nombre, cantidad: cant,
      precio_venta: p.venta, precio_costo: p.costo, ganancia: (p.venta - p.costo) * cant,
    });
  };

  return (
    <div className="space-y-5">
      <div className="flex items-center justify-between flex-wrap gap-3">
        <div>
          <h1 className="text-xl font-bold text-slate-800 dark:text-slate-100 font-display">Inventario</h1>
          <p className="text-sm text-slate-500 dark:text-slate-400 mt-1">Conectado a la base de datos en la nube — se sincroniza entre dispositivos.</p>
        </div>
        <div className="flex gap-2">
          <button onClick={onRecargar} className="flex items-center gap-2 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 font-medium text-sm px-3 py-2 rounded-lg">
            <IconRefresh className={cargando ? "animate-spin inline-block" : "inline-block"} />
          </button>
          <button onClick={abrirNuevo} className="flex items-center gap-2 bg-[#E3A73B] text-[#1E3A32] font-semibold text-sm px-4 py-2 rounded-lg hover:brightness-105">
            <IconPlus /> Agregar producto
          </button>
        </div>
      </div>

      {error && <div className="bg-rose-50 dark:bg-rose-900/20 border border-rose-200 dark:border-rose-800 text-rose-700 dark:text-rose-300 text-sm rounded-lg p-3">{error}</div>}

      <div className="relative max-w-xs">
        <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><IconSearch /></span>
        <input value={busqueda} onChange={(e) => setBusqueda(e.target.value)} placeholder="Buscar producto..."
          className="w-full pl-9 pr-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm text-slate-700 dark:text-slate-200 outline-none focus:border-[#E3A73B]" />
      </div>

      {cargando && productos.length === 0 ? (
        <div className="flex items-center justify-center py-16 text-slate-400 gap-2 text-sm"><IconLoading /> Cargando inventario...</div>
      ) : filtrados.length === 0 ? (
        <div className="text-center py-16 text-slate-400 text-sm">{productos.length === 0 ? "Todavía no hay productos — agregá el primero." : "Sin resultados para tu búsqueda."}</div>
      ) : (
        <div className="bg-white dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700/60 rounded-2xl overflow-hidden overflow-x-auto">
          <table className="w-full text-sm">
            <thead>
              <tr className="bg-[#1E3A32] text-white text-xs uppercase tracking-wide">
                <th className="text-left px-4 py-3 font-semibold">Producto</th>
                <th className="text-left px-4 py-3 font-semibold hidden sm:table-cell">Categoría</th>
                <th className="text-right px-4 py-3 font-semibold">Stock</th>
                <th className="text-right px-4 py-3 font-semibold hidden md:table-cell">Costo</th>
                <th className="text-right px-4 py-3 font-semibold">Venta</th>
                <th className="text-right px-4 py-3 font-semibold hidden md:table-cell">Margen</th>
                <th className="text-center px-4 py-3 font-semibold">Estado</th>
                <th className="px-4 py-3"></th>
              </tr>
            </thead>
            <tbody>
              {filtrados.map((p, i) => {
                const bajo = p.cantidad <= p.minimo;
                const margen = p.costo > 0 ? ((p.venta - p.costo) / p.costo * 100).toFixed(0) : 0;
                return (
                  <tr key={p.id} className={`border-t border-slate-100 dark:border-slate-700/60 ${i % 2 === 1 ? "bg-slate-50/60 dark:bg-slate-800/30" : ""}`}>
                    <td className="px-4 py-3 font-medium text-slate-700 dark:text-slate-200">{p.nombre}</td>
                    <td className="px-4 py-3 text-slate-500 dark:text-slate-400 hidden sm:table-cell">{p.categoria}</td>
                    <td className="px-4 py-3 text-right font-mono text-slate-700 dark:text-slate-200">{p.cantidad}</td>
                    <td className="px-4 py-3 text-right font-mono text-slate-500 dark:text-slate-400 hidden md:table-cell">C${Number(p.costo).toFixed(2)}</td>
                    <td className="px-4 py-3 text-right font-mono text-slate-700 dark:text-slate-200">C${Number(p.venta).toFixed(2)}</td>
                    <td className="px-4 py-3 text-right font-mono text-emerald-600 dark:text-emerald-400 hidden md:table-cell">{margen}%</td>
                    <td className="px-4 py-3 text-center">{bajo ? <Badge tone="danger">Stock bajo</Badge> : <Badge tone="ok">Bien</Badge>}</td>
                    <td className="px-4 py-3">
                      <div className="flex gap-1 justify-end">
                        <button onClick={() => vender(p, 1)} className="text-xs px-2 py-1 rounded bg-[#2471A3] text-white font-medium">-1</button>
                        <button onClick={() => abrirEditar(p)} className="text-xs px-2 py-1 rounded border border-slate-200 dark:border-slate-600 text-slate-600 dark:text-slate-300">Editar</button>
                        <button onClick={() => { if (confirm("¿Eliminar este producto?")) onEliminar(p.id); }} className="text-xs px-2 py-1 rounded text-rose-600 dark:text-rose-400">Eliminar</button>
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
      <ModalProducto abierto={modalAbierto} producto={productoEditando} onGuardar={guardar} onCerrar={() => setModalAbierto(false)} guardando={guardando} />
    </div>
  );
}

function PaginaHistorial() {
  const [eventos, setEventos] = useState([]);
  const [cargando, setCargando] = useState(true);
  const [error, setError] = useState(null);
  const [filtro, setFiltro] = useState("todos");

  const cargar = useCallback(async () => {
    try {
      setError(null);
      const [ventas, perdidas, movimientos, productos] = await Promise.all([
        supaApi.listarVentas(),
        supaApi.listarPerdidas(),
        supaApi.listarTodosMovimientosCaja(),
        supaApi.listarProductos(),
      ]);

      const items = [
        ...ventas.map(v => ({
          tipo: "venta", fecha: v.creado_en,
          descripcion: `Venta: ${v.cantidad} u. de ${v.producto_nombre}`,
          monto: v.cantidad * v.precio_venta, positivo: true,
        })),
        ...perdidas.map(p => ({
          tipo: "perdida", fecha: p.creado_en,
          descripcion: `Pérdida (${p.motivo}): ${p.cantidad} u. de ${p.producto_nombre}`,
          monto: p.valor_perdido, positivo: false,
        })),
        ...movimientos.map(m => ({
          tipo: m.tipo === "ingreso" ? "dinero_entrada" : "dinero_salida", fecha: m.creado_en,
          descripcion: m.descripcion || (m.tipo === "ingreso" ? "Entrada de dinero" : "Salida de dinero"),
          monto: m.monto, positivo: m.tipo === "ingreso",
        })),
        ...productos.map(p => ({
          tipo: "producto_agregado", fecha: p.creado_en,
          descripcion: `Producto agregado: ${p.nombre}`,
          monto: null, positivo: true,
        })),
      ].sort((a, b) => new Date(b.fecha) - new Date(a.fecha));

      setEventos(items);
    } catch (e) {
      setError("No se pudo cargar el historial. Revisá tu conexión a internet.");
    } finally {
      setCargando(false);
    }
  }, []);

  useEffect(() => { cargar(); }, [cargar]);

  const tiposLabel = {
    venta: "Ventas", perdida: "Pérdidas", dinero_entrada: "Entradas de dinero",
    dinero_salida: "Salidas de dinero", producto_agregado: "Productos agregados",
  };
  const tonos = {
    venta: "ok", perdida: "danger", dinero_entrada: "ok", dinero_salida: "danger", producto_agregado: "neutral",
  };

  const filtrados = filtro === "todos" ? eventos : eventos.filter(e => e.tipo === filtro);

  return (
    <div className="space-y-5">
      <div>
        <h1 className="text-xl font-bold text-slate-800 dark:text-slate-100 font-display">Historial</h1>
        <p className="text-sm text-slate-500 dark:text-slate-400 mt-1">Todo lo que ha pasado en tu negocio, en un solo lugar.</p>
      </div>

      {error && <div className="bg-rose-50 dark:bg-rose-900/20 border border-rose-200 dark:border-rose-800 text-rose-700 dark:text-rose-300 text-sm rounded-lg p-3">{error}</div>}

      <div className="flex gap-2 flex-wrap">
        <button onClick={() => setFiltro("todos")} className={`text-xs font-medium px-3 py-1.5 rounded-full ${filtro === "todos" ? "bg-[#1E3A32] text-white" : "bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300"}`}>Todos</button>
        {Object.entries(tiposLabel).map(([key, label]) => (
          <button key={key} onClick={() => setFiltro(key)} className={`text-xs font-medium px-3 py-1.5 rounded-full ${filtro === key ? "bg-[#1E3A32] text-white" : "bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300"}`}>{label}</button>
        ))}
      </div>

      <div className="bg-white dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700/60 rounded-2xl p-5">
        {cargando ? (
          <div className="flex items-center gap-2 text-sm text-slate-400 py-6"><IconLoading /> Cargando historial...</div>
        ) : filtrados.length === 0 ? (
          <p className="text-sm text-slate-400 text-center py-6">No hay movimientos para mostrar</p>
        ) : (
          <div className="space-y-2 max-h-[32rem] overflow-y-auto">
            {filtrados.map((e, i) => (
              <div key={i} className="flex justify-between items-center py-2.5 px-3 rounded-lg bg-slate-50 dark:bg-slate-700/30">
                <div className="flex items-center gap-3">
                  <Badge tone={tonos[e.tipo]}>{tiposLabel[e.tipo]}</Badge>
                  <div>
                    <div className="text-sm font-medium text-slate-700 dark:text-slate-200">{e.descripcion}</div>
                    <div className="text-xs text-slate-400 font-mono">{new Date(e.fecha).toLocaleString()}</div>
                  </div>
                </div>
                {e.monto !== null && (
                  <div className={`font-mono font-semibold text-sm ${e.positivo ? "text-emerald-600 dark:text-emerald-400" : "text-rose-600 dark:text-rose-400"}`}>
                    {e.positivo ? "+" : "-"}C${Number(e.monto).toFixed(2)}
                  </div>
                )}
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function GraficaCanvas({ tipo, data, id }) {
  const canvasRef = React.useRef(null);
  const chartRef = React.useRef(null);

  useEffect(() => {
    if (!canvasRef.current || typeof Chart === "undefined") return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current, {
      type: tipo,
      data,
      options: {
        responsive: true,
        plugins: { legend: { display: data.datasets.length > 1, labels: { font: { size: 11 } } } },
        scales: tipo === "bar" || tipo === "line" ? { y: { beginAtZero: true } } : {},
      },
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [JSON.stringify(data), tipo]);

  return <canvas ref={canvasRef} id={id}></canvas>;
}

function PaginaEstadisticas() {
  const [ventas, setVentas] = useState([]);
  const [perdidas, setPerdidas] = useState([]);
  const [cargando, setCargando] = useState(true);
  const [error, setError] = useState(null);

  const cargar = useCallback(async () => {
    try {
      setError(null);
      const [v, p] = await Promise.all([supaApi.listarVentas(500), supaApi.listarPerdidas(500)]);
      setVentas(v); setPerdidas(p);
    } catch (e) {
      setError("No se pudo cargar las estadísticas. Revisá tu conexión a internet.");
    } finally {
      setCargando(false);
    }
  }, []);

  useEffect(() => { cargar(); }, [cargar]);

  if (cargando) return <div className="flex items-center gap-2 text-sm text-slate-400 py-16 justify-center"><IconLoading /> Cargando estadísticas...</div>;

  const gananciaTotal = ventas.reduce((a, v) => a + Number(v.ganancia), 0);
  const perdidaTotal = perdidas.reduce((a, p) => a + Number(p.valor_perdido), 0);
  const unidadesVendidas = ventas.reduce((a, v) => a + Number(v.cantidad), 0);

  // Ventas por día (últimos 14 días)
  const hoy = new Date();
  const dias = Array.from({ length: 14 }, (_, i) => {
    const d = new Date(hoy); d.setDate(d.getDate() - (13 - i));
    return d.toISOString().slice(0, 10);
  });
  const ventasPorDia = dias.map(dia =>
    ventas.filter(v => v.creado_en.slice(0, 10) === dia).reduce((a, v) => a + v.cantidad * v.precio_venta, 0)
  );

  // Productos más vendidos
  const porProducto = {};
  ventas.forEach(v => { porProducto[v.producto_nombre] = (porProducto[v.producto_nombre] || 0) + Number(v.cantidad); });
  const topProductos = Object.entries(porProducto).sort((a, b) => b[1] - a[1]).slice(0, 6);

  // Ganancias vs pérdidas por semana (últimas 6 semanas, agrupado simple)
  const semanas = Array.from({ length: 6 }, (_, i) => {
    const fin = new Date(hoy); fin.setDate(fin.getDate() - i * 7);
    const inicio = new Date(fin); inicio.setDate(inicio.getDate() - 6);
    return { inicio, fin, label: `${inicio.getDate()}/${inicio.getMonth()+1}` };
  }).reverse();
  const gananciaPorSemana = semanas.map(s =>
    ventas.filter(v => { const f = new Date(v.creado_en); return f >= s.inicio && f <= s.fin; }).reduce((a, v) => a + Number(v.ganancia), 0)
  );
  const perdidaPorSemana = semanas.map(s =>
    perdidas.filter(p => { const f = new Date(p.creado_en); return f >= s.inicio && f <= s.fin; }).reduce((a, p) => a + Number(p.valor_perdido), 0)
  );

  return (
    <div className="space-y-5">
      <div>
        <h1 className="text-xl font-bold text-slate-800 dark:text-slate-100 font-display">Estadísticas</h1>
        <p className="text-sm text-slate-500 dark:text-slate-400 mt-1">Cómo va creciendo tu negocio.</p>
      </div>

      {error && <div className="bg-rose-50 dark:bg-rose-900/20 border border-rose-200 dark:border-rose-800 text-rose-700 dark:text-rose-300 text-sm rounded-lg p-3">{error}</div>}

      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
        <StatCard label="Unidades vendidas" value={unidadesVendidas} icon={IconCart} accent="bg-[#2471A3]" />
        <StatCard label="Ganancia total" value={`C$${gananciaTotal.toFixed(2)}`} icon={IconChart} accent="bg-emerald-600" />
        <StatCard label="Pérdidas totales" value={`C$${perdidaTotal.toFixed(2)}`} icon={IconAlert} accent="bg-rose-600" />
        <StatCard label="Ganancia neta" value={`C$${(gananciaTotal - perdidaTotal).toFixed(2)}`} icon={IconWallet} accent="bg-[#1E3A32]" />
      </div>

      <div className="grid lg:grid-cols-2 gap-4">
        <div className="bg-white dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700/60 rounded-2xl p-5">
          <h2 className="font-semibold text-slate-800 dark:text-slate-100 text-sm mb-3">Ventas últimos 14 días</h2>
          {ventas.length === 0 ? <p className="text-sm text-slate-400 py-8 text-center">Todavía no hay ventas registradas</p> : (
            <GraficaCanvas tipo="line" id="ventasDia" data={{
              labels: dias.map(d => d.slice(5)),
              datasets: [{ label: "Ventas (C$)", data: ventasPorDia, borderColor: "#2471A3", backgroundColor: "#2471A322", tension: 0.3, fill: true }],
            }} />
          )}
        </div>

        <div className="bg-white dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700/60 rounded-2xl p-5">
          <h2 className="font-semibold text-slate-800 dark:text-slate-100 text-sm mb-3">Productos más vendidos</h2>
          {topProductos.length === 0 ? <p className="text-sm text-slate-400 py-8 text-center">Todavía no hay ventas registradas</p> : (
            <GraficaCanvas tipo="bar" id="topProductos" data={{
              labels: topProductos.map(([nombre]) => nombre),
              datasets: [{ label: "Unidades vendidas", data: topProductos.map(([, cant]) => cant), backgroundColor: "#E3A73B" }],
            }} />
          )}
        </div>

        <div className="lg:col-span-2 bg-white dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700/60 rounded-2xl p-5">
          <h2 className="font-semibold text-slate-800 dark:text-slate-100 text-sm mb-3">Ganancias vs. pérdidas — últimas 6 semanas</h2>
          <GraficaCanvas tipo="bar" id="gananciaVsPerdida" data={{
            labels: semanas.map(s => s.label),
            datasets: [
              { label: "Ganancia", data: gananciaPorSemana, backgroundColor: "#2E7D4F" },
              { label: "Pérdidas", data: perdidaPorSemana, backgroundColor: "#C1442D" },
            ],
          }} />
        </div>
      </div>
    </div>
  );
}

function PantallaLogin({ onAutenticado }) {
  const [modo, setModo] = useState("login"); // "login" | "registro"
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [cargando, setCargando] = useState(false);
  const [error, setError] = useState(null);
  const [aviso, setAviso] = useState(null);

  const enviar = async () => {
    setError(null); setAviso(null);
    if (!email.trim() || !password) { setError("Poné correo y contraseña"); return; }
    setCargando(true);
    try {
      if (modo === "registro") {
        const data = await authApi.signUp(email.trim(), password);
        if (data.access_token) {
          onAutenticado(data);
        } else {
          setAviso("Cuenta creada. Revisá tu correo para confirmarla, y después iniciá sesión aquí.");
          setModo("login");
        }
      } else {
        const data = await authApi.signIn(email.trim(), password);
        onAutenticado(data);
      }
    } catch (e) {
      setError(e.message);
    } finally {
      setCargando(false);
    }
  };

  return (
    <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4">
      <div className="bg-white border border-slate-200 rounded-2xl p-6 w-full max-w-sm">
        <h1 className="text-xl font-bold text-slate-800 font-display mb-1">Mi Negocio</h1>
        <p className="text-sm text-slate-500 mb-5">{modo === "login" ? "Iniciá sesión para ver tu negocio" : "Creá tu cuenta para empezar"}</p>

        <div className="flex gap-2 mb-4 bg-slate-100 rounded-lg p-1">
          <button onClick={() => { setModo("login"); setError(null); setAviso(null); }} className={`flex-1 py-2 rounded-md text-sm font-medium ${modo === "login" ? "bg-white shadow text-slate-800" : "text-slate-500"}`}>Iniciar sesión</button>
          <button onClick={() => { setModo("registro"); setError(null); setAviso(null); }} className={`flex-1 py-2 rounded-md text-sm font-medium ${modo === "registro" ? "bg-white shadow text-slate-800" : "text-slate-500"}`}>Crear cuenta</button>
        </div>

        {error && <div className="bg-rose-50 border border-rose-200 text-rose-700 text-xs rounded-lg p-2.5 mb-3">{error}</div>}
        {aviso && <div className="bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs rounded-lg p-2.5 mb-3">{aviso}</div>}

        <label className="block text-xs font-semibold text-slate-500 uppercase mb-1">Correo</label>
        <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="tu@correo.com"
          className="w-full px-3 py-2 rounded-lg border border-slate-200 bg-white text-sm mb-3 outline-none focus:border-[#E3A73B]" />

        <label className="block text-xs font-semibold text-slate-500 uppercase mb-1">Contraseña</label>
        <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} placeholder="Mínimo 6 caracteres"
          className="w-full px-3 py-2 rounded-lg border border-slate-200 bg-white text-sm mb-4 outline-none focus:border-[#E3A73B]" />

        <button disabled={cargando} onClick={enviar} className="w-full bg-[#E3A73B] text-[#1E3A32] font-semibold text-sm px-4 py-2.5 rounded-lg disabled:opacity-50 flex items-center justify-center gap-2">
          {cargando && <IconLoading />} {modo === "login" ? "Entrar" : "Crear cuenta"}
        </button>
      </div>
    </div>
  );
}

function App() {
  const [sesion, setSesionState] = useState(() => {
    try { return JSON.parse(localStorage.getItem("mi_negocio_sesion")) || null; }
    catch { return null; }
  });
  currentAccessToken = sesion?.access_token || null;

  const guardarSesion = (data) => {
    localStorage.setItem("mi_negocio_sesion", JSON.stringify(data));
    setSesionState(data);
  };
  const cerrarSesion = async () => {
    await authApi.signOut(sesion?.access_token);
    localStorage.removeItem("mi_negocio_sesion");
    setSesionState(null);
  };

  if (!sesion) {
    return <PantallaLogin onAutenticado={guardarSesion} />;
  }

  return <AppInterna sesion={sesion} onCerrarSesion={cerrarSesion} />;
}

function AppInterna({ sesion, onCerrarSesion }) {
  const [pagina, setPagina] = useState("dashboard");
  const [modoOscuro, setModoOscuro] = useState(false);
  const [sidebarAbierto, setSidebarAbierto] = useState(false);
  const [nombreNegocio, setNombreNegocio] = useState("Mi Negocio");
  const [productos, setProductos] = useState([]);
  const [cargando, setCargando] = useState(true);
  const [error, setError] = useState(null);

  const cargarProductos = useCallback(async () => {
    try {
      setError(null);
      const datos = await supaApi.listarProductos();
      setProductos(datos);
    } catch (e) {
      setError("No se pudo conectar con la base de datos. Revisá tu conexión a internet.");
    } finally {
      setCargando(false);
    }
  }, []);

  useEffect(() => {
    cargarProductos();
    const intervalo = setInterval(cargarProductos, 6000);
    return () => clearInterval(intervalo);
  }, [cargarProductos]);

  const handleCrear = async (datos) => { await supaApi.crearProducto(datos); await cargarProductos(); };
  const handleActualizar = async (id, cambios) => { await supaApi.actualizarProducto(id, cambios); await cargarProductos(); };
  const handleEliminar = async (id) => { await supaApi.eliminarProducto(id); await cargarProductos(); };

  const stockBajo = productos.filter(p => p.cantidad <= p.minimo).length;
  const valorStock = productos.reduce((a, p) => a + p.cantidad * p.costo, 0);
  const gananciaAcumulada = productos.reduce((a, p) => a + (p.ganancia_acumulada || 0), 0);
  const unidadesVendidas = productos.reduce((a, p) => a + (p.vendidos || 0), 0);

  const paginas = {
    dashboard: <PaginaDashboard productos={productos} stockBajo={stockBajo} valorStock={valorStock} gananciaAcumulada={gananciaAcumulada} unidadesVendidas={unidadesVendidas} />,
    inventario: <PaginaInventario productos={productos} cargando={cargando} error={error} onRecargar={cargarProductos} onCrear={handleCrear} onActualizar={handleActualizar} onEliminar={handleEliminar} onVentaRegistrada={supaApi.registrarVenta} />,
    caja: <PaginaCaja />,
    perdidas: <PaginaPerdidas productos={productos} onActualizarProducto={handleActualizar} onRecargarProductos={cargarProductos} />,
    historial: <PaginaHistorial />,
    estadisticas: <PaginaEstadisticas />,
    notas: <ProximamenteCard titulo="Notas y recordatorios" descripcion="Un espacio para pedidos pendientes, ideas y tareas del negocio." icon={IconNote} />,
    usuarios: <ProximamenteCard titulo="Usuarios y permisos" descripcion="Administrá quién puede entrar y qué puede hacer cada empleado." icon={IconUsers} />,
  };

  return (
    <div className={modoOscuro ? "dark" : ""}>
      <div className="min-h-screen bg-slate-50 dark:bg-slate-900 flex transition-colors">
        {sidebarAbierto && <div className="fixed inset-0 bg-black/40 z-20 lg:hidden" onClick={() => setSidebarAbierto(false)} />}
        <aside className={`fixed lg:static z-30 top-0 left-0 h-full w-64 bg-[#1E3A32] text-white flex flex-col transition-transform duration-200 ${sidebarAbierto ? "translate-x-0" : "-translate-x-full lg:translate-x-0"}`}>
          <div className="p-5 border-b border-white/10 flex items-center justify-between">
            <div>
              <input value={nombreNegocio} onChange={(e) => setNombreNegocio(e.target.value)} className="bg-transparent font-bold text-lg outline-none border-b border-dashed border-white/20 w-full font-display" />
              <div className="text-[11px] text-white/50 font-mono mt-1">Panel de administración</div>
            </div>
            <button className="lg:hidden text-white/70" onClick={() => setSidebarAbierto(false)}><IconClose /></button>
          </div>
          <nav className="flex-1 p-3 space-y-1 overflow-y-auto">
            {NAV_ITEMS.map((item) => (
              <button key={item.id} onClick={() => { setPagina(item.id); setSidebarAbierto(false); }}
                className={`w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-sm font-medium transition-colors ${pagina === item.id ? "bg-[#E3A73B] text-[#1E3A32]" : "text-white/80 hover:bg-white/10"}`}>
                <span className="flex items-center gap-2.5"><item.icon /> {item.label}</span>
                {!item.listo && <span className="text-[9px] uppercase font-bold bg-white/15 px-1.5 py-0.5 rounded">pronto</span>}
              </button>
            ))}
          </nav>
          <div className="p-4 border-t border-white/10 text-[11px] text-white/40 font-mono">v0.2 · Conectado a Supabase</div>
        </aside>
        <div className="flex-1 flex flex-col min-w-0">
          <header className="h-16 bg-white dark:bg-slate-800/80 border-b border-slate-200 dark:border-slate-700/60 flex items-center justify-between px-4 lg:px-6 sticky top-0 z-10">
            <div className="flex items-center gap-3">
              <button className="lg:hidden text-slate-500 dark:text-slate-300 text-xl" onClick={() => setSidebarAbierto(true)}><IconMenu /></button>
              <div className="hidden sm:flex items-center gap-2 text-sm text-slate-400 dark:text-slate-500">
                <span className="font-medium text-slate-600 dark:text-slate-300">{NAV_ITEMS.find(n => n.id === pagina)?.label}</span>
              </div>
            </div>
            <div className="flex items-center gap-2">
              <button className="w-9 h-9 rounded-lg flex items-center justify-center text-slate-500 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700/60"><IconBell /></button>
              <button onClick={() => setModoOscuro(!modoOscuro)} className="w-9 h-9 rounded-lg flex items-center justify-center text-slate-500 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700/60">
                {modoOscuro ? <IconSun /> : <IconMoon />}
              </button>
              <button onClick={onCerrarSesion} title="Cerrar sesión" className="text-xs font-medium px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-600 text-slate-500 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700/60">
                Cerrar sesión
              </button>
              <div className="w-9 h-9 rounded-full bg-[#E3A73B] text-[#1E3A32] flex items-center justify-center font-bold text-sm">
                {(sesion?.user?.email || "?").charAt(0).toUpperCase()}
              </div>
            </div>
          </header>
          <main className="flex-1 p-4 lg:p-6">{paginas[pagina]}</main>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
